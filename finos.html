color:#6B6B6D\">DECISIONS<\u002Fp><p style=\"margin:0;font-size:13px;line-height:1.5;color:#111111;text-wrap:pretty\">A recommendation that states its confidence, its reasoning and the risk it carries.<\u002Fp><\u002Fdiv>\n    <div style=\"background:#FFFFFF;padding:20px\"><p style=\"margin:0 0 8px;font-size:10.5px;font-weight:600;letter-spacing:.1em;color:#6B6B6D\">CONTROL<\u002Fp><p style=\"margin:0;font-size:13px;line-height:1.5;color:#111111;text-wrap:pretty\">Challenge, permissions and approval proportional to the consequence of the action.<\u002Fp><\u002Fdiv>\n    <div style=\"background:#FFFFFF;padding:20px\"><p style=\"margin:0 0 8px;font-size:10.5px;font-weight:600;letter-spacing:.1em;color:#6B6B6D\">AUDIT<\u002Fp><p style=\"margin:0;font-size:13px;line-height:1.5;color:#111111;text-wrap:pretty\">Every state change recorded with its actor, including the disagreement.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div>\n    <p data-reveal=\"1\" style=\"margin:0 0 16px;font-family:'Bebas Neue',sans-serif;font-size:{{ quoteSize }};line-height:.95;text-transform:uppercase;color:#111111;max-width:22ch;text-wrap:pretty\">FINOS doesn't try to make financial decisions disappear.<\u002Fp>\n    <p style=\"margin:0;font-size:{{ leadSize }};line-height:1.5;color:#39393B;max-width:56ch;text-wrap:pretty\">It makes the decision easier to understand, interrogate and act on.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n\n<div style=\"max-width:1240px;margin:0 auto;padding:0 {{ gutter }}\">\n  <div style=\"border-top:2px solid #111111;padding:24px 0;display:grid;grid-template-columns:{{ twoCol }};gap:24px;align-items:baseline\">\n    <p style=\"margin:0;font-size:10.5px;font-weight:600;letter-spacing:.1em;color:#6B6B6D\">FINAL EXPERIENCE TAKEAWAY<\u002Fp>\n    <p style=\"margin:0;font-size:{{ leadSize }};line-height:1.45;color:#111111;max-width:60ch;text-wrap:pretty\">FINOS connects financial context, scenario modelling, AI assistance and human approval in one decision system.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ============ 17 OUTCOMES & IMPACT ============ -->\n<div style='max-width:1240px;margin:0 auto;padding:0 24px 96px'><p style='margin:0 0 18px;font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#111'>From the prototype — the final system<\u002Fp><div style='display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:28px'><figure style='margin:0'><div style='border:1px solid rgba(17,17,17,.14);border-radius:14px;overflow:hidden;box-shadow:0 30px 70px -38px rgba(17,17,17,.35);background:#fff'><img src='assets/img/finos/accounts.jpg' alt='FINOS Accounts view listing linked accounts and balances' loading='lazy' style='display:block;width:100%;height:auto'/><\u002Fdiv><figcaption style='margin-top:12px;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#6B6B6D'>Accounts<\u002Ffigcaption><\u002Ffigure><figure style='margin:0'><div style='border:1px solid rgba(17,17,17,.14);border-radius:14px;overflow:hidden;box-shadow:0 30px 70px -38px rgba(17,17,17,.35);background:#fff'><img src='assets/img/finos/transactions.jpg' alt='FINOS Transactions view with categorised activity' loading='lazy' style='display:block;width:100%;height:auto'/><\u002Fdiv><figcaption style='margin-top:12px;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#6B6B6D'>Transactions<\u002Ffigcaption><\u002Ffigure><figure style='margin:0'><div style='border:1px solid rgba(17,17,17,.14);border-radius:14px;overflow:hidden;box-shadow:0 30px 70px -38px rgba(17,17,17,.35);background:#fff'><img src='assets/img/finos/bills.jpg' alt='FINOS Bills and Commitments view including a duplicate debit order flag' loading='lazy' style='display:block;width:100%;height:auto'/><\u002Fdiv><figcaption style='margin-top:12px;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#6B6B6D'>Bills &amp; Commitments<\u002Ffigcaption><\u002Ffigure><figure style='margin:0'><div style='border:1px solid rgba(17,17,17,.14);border-radius:14px;overflow:hidden;box-shadow:0 30px 70px -38px rgba(17,17,17,.35);background:#fff'><img src='assets/img/finos/portfolio.jpg' alt='FINOS Portfolio view of invested assets' loading='lazy' style='display:block;width:100%;height:auto'/><\u002Fdiv><figcaption style='margin-top:12px;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#6B6B6D'>Portfolio<\u002Ffigcaption><\u002Ffigure><figure style='margin:0'><div style='border:1px solid rgba(17,17,17,.14);border-radius:14px;overflow:hidden;box-shadow:0 30px 70px -38px rgba(17,17,17,.35);background:#fff'><img src='assets/img/finos/risk.jpg' alt='FINOS Risk view summarising exposure and cover' loading='lazy' style='display:block;width:100%;height:auto'/><\u002Fdiv><figcaption style='margin-top:12px;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#6B6B6D'>Risk<\u002Ffigcaption><\u002Ffigure><\u002Fdiv><\u002Fdiv><section id=\"ch17\" data-screen-label=\"17 Outcomes\" style=\"background:#F5F5F5;padding:{{ secPad }}\">\n  <div style=\"max-width:1240px;margin:0 auto\">\n    <p style=\"margin:0 0 24px;font-size:11px;font-weight:600;letter-spacing:.14em;color:#6B6B6D\">17 — OUTCOMES &amp; IMPACT<\u002Fp>\n    <h2 style=\"margin:0 0 32px;font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:{{ h2Size }};line-height:.94;letter-spacing:.005em;text-transform:uppercase;max-width:20ch;text-wrap:pretty\">The outcome wasn't another financial dashboard.<\u002Fh2>\n    <div style=\"display:grid;grid-template-columns:{{ twoCol }};gap:48px;margin-bottom:64px;align-items:start\">\n      <p style=\"margin:0;font-size:{{ leadSize }};line-height:1.5;color:#111111;text-wrap:pretty\">The strongest outcome was a clearer product model for how AI can support consequential financial decisions while keeping humans meaningfully involved.<\u002Fp>\n      <div style=\"border:1px solid #CACACB;border-radius:14px;padding:20px;background:#FFFFFF\">\n        <p style=\"margin:0 0 8px;font-size:10.5px;font-weight:600;letter-spacing:.1em;color:#6B6B6D\">NO BUSINESS METRICS CLAIMED<\u002Fp>\n        <p style=\"margin:0;font-size:12.5px;line-height:1.5;color:#39393B;text-wrap:pretty\">FINOS is a self-initiated concept. There is no revenue, conversion, retention, time-saving or satisfaction figure to report, so none is reported. The outcomes below are product and design outcomes.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <p style=\"margin:0 0 8px;font-size:11px;font-weight:600;letter-spacing:.14em;color:#6B6B6D\">PRODUCT / DESIGN OUTCOMES<\u002Fp>\n    <p style=\"margin:0 0 8px;font-size:13px;line-height:1.55;color:#39393B;max-width:74ch;text-wrap:pretty\">Because FINOS is a self-initiated prototype rather than a deployed product, these outcomes describe design and product-system improvements rather than measured business impact.<\u002Fp>\n    <p style=\"margin:0 0 24px;font-size:13.5px;color:#6B6B6D\">Hover or select an outcome to see the research signal behind it.<\u002Fp>\n    <div style=\"display:grid;grid-template-columns:{{ outGrid }};gap:16px;margin-bottom:64px\">\n      <sc-for list=\"{{ outs }}\" as=\"o\" hint-placeholder-count=\"5\">\n        <button sc-camel-on-click=\"{{ o.toggle }}\" sc-camel-on-mouse-enter=\"{{ o.enter }}\" sc-camel-on-mouse-leave=\"{{ o.leave }}\" sc-camel-on-focus=\"{{ o.focus }}\" aria-expanded=\"{{ o.expanded }}\" style=\"{{ o.style }}\">\n          <span style=\"font-family:'Bebas Neue',sans-serif;font-size:20px;line-height:1;color:#CACACB\">{{ o.n }}<\u002Fspan>\n          <span style=\"font-family:'Bebas Neue',sans-serif;font-size:24px;line-height:.98;text-transform:uppercase;color:#111111;text-wrap:pretty\">{{ o.title }}<\u002Fspan>\n          <span style=\"font-size:12.5px;line-height:1.5;color:#39393B;text-wrap:pretty\">{{ o.body }}<\u002Fspan>\n          <sc-if value=\"{{ o.open }}\">\n            <span style=\"border-top:1px solid #E5E5E5;padding-top:8px;font-size:11.5px;line-height:1.45;color:#111111;text-wrap:pretty\">{{ o.link }}<\u002Fspan>\n          <\u002Fsc-if>\n        <\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <p style=\"margin:0 0 24px;font-size:11px;font-weight:600;letter-spacing:.14em;color:#6B6B6D\">RESEARCH SIGNAL → DESIGN RESPONSE → PRODUCT OUTCOME<\u002Fp>\n    <div style=\"border:1px solid #CACACB;border-radius:14px;overflow:hidden;background:#FFFFFF;margin-bottom:64px\">\n      <div style=\"display:grid;grid-template-columns:{{ triGrid }};gap:16px;padding:12px 20px;border-bottom:1px solid #E5E5E5;background:#FAFAFA\">\n        <span style=\"font-size:10.5px;font-weight:600;letter-spacing:.08em;color:#6B6B6D\">RESEARCH SIGNAL<\u002Fspan>\n        <span style=\"font-size:10.5px;font-weight:600;letter-spacing:.08em;color:#6B6B6D\">DESIGN RESPONSE<\u002Fspan>\n        <span style=\"font-size:10.5px;font-weight:600;letter-spacing:.08em;color:#6B6B6D\">PRODUCT OUTCOME<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"padding:20px;display:flex;flex-direction:column;gap:16px\">\n        <sc-for list=\"{{ r2o }}\" as=\"r\" hint-placeholder-count=\"5\">\n          <div style=\"display:grid;grid-template-columns:{{ triGrid }};gap:16px;border-bottom:1px solid #EFEFEF;padding-bottom:16px\">\n            <span style=\"font-size:13px;color:#39393B;text-wrap:pretty\">{{ r.sig }}<\u002Fspan>\n            <span style=\"font-size:13.5px;font-weight:600;color:#111111;text-wrap:pretty\">{{ r.resp }}<\u002Fspan>\n            <span style=\"font-size:13px;color:#39393B;text-wrap:pretty\">{{ r.out }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <p data-reveal=\"1\" style=\"margin:0;font-family:'Bebas Neue',sans-serif;font-size:{{ revealSize }};line-height:.92;letter-spacing:.005em;text-transform:uppercase;color:#111111;max-width:26ch;text-wrap:pretty\">The measurable outcome wasn't a business KPI. It was a more coherent product model for responsible AI-assisted financial decision-making.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ 18 WHAT I LEARNED ============ -->\n<section id=\"ch18\" data-screen-label=\"18 Learned\" style=\"max-width:1240px;margin:0 auto;padding:{{ secPad }}\">\n  <p style=\"margin:0 0 24px;font-size:11px;font-weight:600;letter-spacing:.14em;color:#6B6B6D\">18 — WHAT I LEARNED<\u002Fp>\n  <h2 style=\"margin:0 0 64px;font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:{{ h2Size }};line-height:.94;letter-spacing:.005em;text-transform:uppercase;max-width:20ch;text-wrap:pretty\">Designing FINOS changed how I think about AI products.<\u002Fh2>\n  <div style=\"display:flex;flex-direction:column;gap:32px\">\n    <sc-for list=\"{{ lessons }}\" as=\"l\" hint-placeholder-count=\"5\">\n      <div style=\"{{ l.style }}\">\n        <button sc-camel-on-click=\"{{ l.toggle }}\" aria-expanded=\"{{ l.expanded }}\" style=\"width:100%;text-align:left;background:transparent;border:0;padding:0;cursor:pointer;display:flex;gap:24px;align-items:baseline\">\n          <span style=\"font-family:'Bebas Neue',sans-serif;font-size:24px;line-height:1;color:#CACACB;flex:0 0 auto\">{{ l.n }}<\u002Fspan>\n          <span style=\"flex:1 1 auto;font-family:'Bebas Neue',sans-serif;font-size:{{ quoteSize }};line-height:.95;text-transform:uppercase;color:#111111;text-wrap:pretty\">{{ l.title }}<\u002Fspan>\n        <\u002Fbutton>\n        <sc-if value=\"{{ l.open }}\">\n          <p style=\"margin:16px 0 0 0;font-size:{{ leadSize }};line-height:1.5;color:#39393B;max-width:74ch;text-wrap:pretty\">{{ l.body }}<\u002Fp>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ 19 LIMITATIONS & NEXT STEPS ============ -->\n<section id=\"ch19\" data-screen-label=\"19 Limitations\" style=\"background:#F5F5F5;padding:{{ secPad }}\">\n  <div style=\"max-width:1240px;margin:0 auto\">\n    <p style=\"margin:0 0 24px;font-size:11px;font-weight:600;letter-spacing:.14em;color:#6B6B6D\">19 — LIMITATIONS &amp; NEXT STEPS<\u002Fp>\n    <h2 style=\"margin:0 0 64px;font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:{{ h2Size }};line-height:.94;letter-spacing:.005em;text-transform:uppercase;max-width:20ch;text-wrap:pretty\">FINOS is a prototype, not a finished financial product.<\u002Fh2>\n\n    <div style=\"display:grid;grid-template-columns:{{ twoCol }};gap:16px;margin-bottom:64px;align-items:start\">\n      <div style=\"border:1px solid #111111;border-radius:14px;padding:20px;background:#FFFFFF\">\n        <p style=\"margin:0 0 16px;font-size:10.5px;font-weight:600;letter-spacing:.1em;color:#111111\">WHAT THIS PROJECT DEMONSTRATES<\u002Fp>\n        <div style=\"display:flex;flex-direction:column;gap:12px;font-size:13.5px;font-weight:600;color:#111111\">\n          <span style=\"border-top:1px solid #EFEFEF;padding-top:12px\">A decision-centred financial product model<\u002Fspan>\n          <span style=\"border-top:1px solid #EFEFEF;padding-top:12px\">Human-in-the-loop AI interactions<\u002Fspan>\n          <span style=\"border-top:1px solid #EFEFEF;padding-top:12px\">Scenario-based decision support<\u002Fspan>\n          <span style=\"border-top:1px solid #EFEFEF;padding-top:12px\">Explainable recommendations<\u002Fspan>\n          <span style=\"border-top:1px solid #EFEFEF;padding-top:12px\">Challengeable AI<\u002Fspan>\n          <span style=\"border-top:1px solid #EFEFEF;padding-top:12px\">Proportional approval<\u002Fspan>\n          <span style=\"border-top:1px solid #EFEFEF;padding-top:12px\">Decision traceability<\u002Fspan>\n          <span style=\"border-top:1px solid #EFEFEF;padding-top:12px\">A coherent end-to-end experience<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <p style=\"margin:0 0 8px;font-size:10.5px;font-weight:600;letter-spacing:.1em;color:#6B6B6D\">WHAT WOULD NEED TO BE VALIDATED NEXT<\u002Fp>\n        <p style=\"margin:0 0 16px;font-size:12.5px;color:#6B6B6D\">Select one to see why it matters.<\u002Fp>\n        <div style=\"display:flex;flex-direction:column;gap:12px\">\n          <sc-for list=\"{{ lims }}\" as=\"li\" hint-placeholder-count=\"7\">\n            <button sc-camel-on-click=\"{{ li.toggle }}\" sc-camel-on-mouse-enter=\"{{ li.enter }}\" sc-camel-on-focus=\"{{ li.focus }}\" aria-expanded=\"{{ li.expanded }}\" style=\"{{ li.style }}\">\n              <span style=\"display:flex;gap:12px;align-items:baseline\">\n                <span style=\"font-family:'Bebas Neue',sans-serif;font-size:18px;line-height:1.2;color:#CACACB\">{{ li.n }}<\u002Fspan>\n                <span style=\"flex:1 1 auto;font-size:13.5px;font-weight:700;color:#111111;text-wrap:pretty\">{{ li.title }}<\u002Fspan>\n              <\u002Fspan>\n              <span style=\"font-size:12.5px;line-height:1.5;color:#39393B;text-wrap:pretty\">{{ li.body }}<\u002Fspan>\n              <sc-if value=\"{{ li.open }}\">\n                <span style=\"border-left:3px solid #111111;padding-left:12px;font-size:12.5px;line-height:1.5;color:#111111;text-wrap:pretty\">{{ li.why }}<\u002Fspan>\n              <\u002Fsc-if>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <h3 style=\"margin:0 0 24px;font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:{{ quoteSize }};line-height:.95;letter-spacing:.005em;text-transform:uppercase;color:#111111;max-width:20ch;text-wrap:pretty\">What I would validate first<\u002Fh3>\n    <ol style=\"list-style:none;margin:0 0 24px;padding:0;display:flex;flex-direction:column;gap:16px\">\n      <sc-for list=\"{{ valFirst }}\" as=\"v\" hint-placeholder-count=\"5\">\n        <li style=\"border:1px solid #CACACB;border-radius:14px;padding:20px;background:#FFFFFF;display:grid;grid-template-columns:{{ twoCol }};gap:24px;align-items:start\">\n          <div style=\"display:flex;gap:12px;align-items:baseline\">\n            <span style=\"font-family:'Bebas Neue',sans-serif;font-size:20px;line-height:1;color:#CACACB\">{{ v.n }}<\u002Fspan>\n            <div>\n              <p style=\"margin:0 0 6px;font-size:14px;font-weight:700;color:#111111;text-wrap:pretty\">{{ v.k }}<\u002Fp>\n              <span style=\"font-size:10.5px;font-weight:600;letter-spacing:.08em;color:#39393B;border:1px solid #CACACB;border-radius:999px;padding:4px 10px\">{{ v.p }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <p style=\"margin:0;font-size:13px;line-height:1.55;color:#39393B;text-wrap:pretty\">{{ v.v }}<\u002Fp>\n        <\u002Fli>\n      <\u002Fsc-for>\n    <\u002Fol>\n    <p style=\"margin:0 0 64px;border-left:3px solid #111111;padding-left:16px;font-size:13.5px;line-height:1.55;color:#111111;max-width:64ch;text-wrap:pretty\">These priorities define what would need to be proven before FINOS could move from prototype toward production.<\u002Fp>\n\n    <p style=\"margin:0 0 24px;font-size:11px;font-weight:600;letter-spacing:.14em;color:#6B6B6D\">NEXT ITERATION<\u002Fp>\n    <div style=\"display:grid;grid-template-columns:{{ roadGrid }};gap:16px;margin-bottom:64px\">\n      <sc-for list=\"{{ road }}\" as=\"r\" hint-placeholder-count=\"7\">\n        <div style=\"{{ r.style }}\">\n          <span style=\"font-family:'Bebas Neue',sans-serif;font-size:18px;line-height:1;color:#CACACB\">{{ r.n }}<\u002Fspan>\n          <span style=\"{{ r.labelStyle }}\">{{ r.label }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <div>\n      <p data-reveal=\"1\" style=\"margin:0 0 16px;font-family:'Bebas Neue',sans-serif;font-size:{{ quoteSize }};line-height:.95;text-transform:uppercase;color:#111111;max-width:22ch;text-wrap:pretty\">The next version shouldn't simply add more features.<\u002Fp>\n      <p style=\"margin:0;font-size:{{ leadSize }};line-height:1.5;color:#39393B;max-width:60ch;text-wrap:pretty\">It should reduce uncertainty about whether the system is trustworthy enough to use in the real world.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ 20 FINAL REFLECTION ============ -->\n<section id=\"ch20\" data-screen-label=\"20 Reflection\" style=\"background:#111111;color:#FFFFFF;padding:{{ finalPad }}\">\n  <div style=\"max-width:1240px;margin:0 auto\">\n    <p style=\"margin:0 0 32px;font-size:11px;font-weight:600;letter-spacing:.14em;color:#9E9EA0\">20 — FINAL REFLECTION<\u002Fp>\n    <h2 style=\"margin:0 0 48px;font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:{{ h2Size }};line-height:.94;letter-spacing:.005em;text-transform:uppercase;color:#FFFFFF;max-width:20ch;text-wrap:pretty\">Designing for consequential AI decisions.<\u002Fh2>\n    <div style=\"display:flex;flex-direction:column;gap:24px;max-width:72ch;margin-bottom:96px\">\n      <p style=\"margin:0;font-size:{{ leadSize }};line-height:1.5;color:#E5E5E5;text-wrap:pretty\">FINOS started as a question about what an AI financial assistant could become.<\u002Fp>\n      <p style=\"margin:0;font-size:{{ leadSize }};line-height:1.5;color:#E5E5E5;text-wrap:pretty\">It evolved into a deeper exploration of how AI should participate in decisions that people cannot afford to misunderstand.<\u002Fp>\n      <p style=\"margin:0;font-size:12.5px;font-weight:600;letter-spacing:.08em;color:#9E9EA0\">THE FINAL PRINCIPLE WAS SIMPLE<\u002Fp>\n    <\u002Fdiv>\n\n    <p data-reveal=\"1\" style=\"margin:0 0 32px;font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:{{ finalSize }};line-height:.88;letter-spacing:.005em;text-transform:uppercase;color:#FFFFFF;max-width:22ch;text-wrap:pretty\">AI should increase decision capability — not remove decision agency.<\u002Fp>\n    <p style=\"margin:0 0 24px;font-size:{{ leadSize }};line-height:1.5;color:#E5E5E5;max-width:64ch;text-wrap:pretty\">That principle became the filter I used to decide where FINOS should automate, where it should explain and where it should return control to the human.<\u002Fp>\n    <p style=\"margin:0 0 96px;font-size:{{ leadSize }};line-height:1.5;color:#9E9EA0;max-width:56ch;text-wrap:pretty\">FINOS is my exploration of what that principle could look like in a financial operating system.<\u002Fp>\n\n    <div style=\"border-top:1px solid #2B2B2B;padding-top:48px;margin-bottom:96px\">\n      <h3 style=\"margin:0 0 32px;font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:{{ quoteSize }};line-height:.95;letter-spacing:.005em;text-transform:uppercase;color:#FFFFFF\">FINOS in 30 seconds<\u002Fh3>\n      <dl style=\"margin:0;display:flex;flex-direction:column;gap:20px\">\n        <sc-for list=\"{{ thirty }}\" as=\"t\" hint-placeholder-count=\"5\">\n          <div style=\"display:grid;grid-template-columns:{{ twoCol }};gap:24px;border-top:1px solid #2B2B2B;padding-top:16px;align-items:baseline\">\n            <dt style=\"font-size:10.5px;font-weight:600;letter-spacing:.1em;color:#9E9EA0\">{{ t.k }}<\u002Fdt>\n            <dd style=\"margin:0;font-size:{{ leadSize }};line-height:1.45;color:#FFFFFF;max-width:60ch;text-wrap:pretty\">{{ t.v }}<\u002Fdd>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdl>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:{{ outGrid }};gap:16px;margin-bottom:96px\">\n      <sc-for list=\"{{ summ }}\" as=\"s\" hint-placeholder-count=\"5\">\n        <div style=\"border-top:1px solid #2B2B2B;padding-top:16px;display:flex;flex-direction:column;gap:8px\">\n          <span style=\"font-family:'Bebas Neue',sans-serif;font-size:18px;line-height:1;color:#6B6B6D\">{{ s.n }}<\u002Fspan>\n          <span style=\"font-size:10.5px;font-weight:600;letter-spacing:.1em;color:#9E9EA0\">{{ s.k }}<\u002Fspan>\n          <span style=\"font-size:13px;line-height:1.5;color:#FFFFFF;text-wrap:pretty\">{{ s.v }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <div style=\"border-top:1px solid #2B2B2B;padding-top:48px;display:flex;flex-direction:column;gap:24px\">\n      <div>\n        <p style=\"margin:0 0 4px;font-family:'Bebas Neue',sans-serif;font-size:40px;line-height:1;letter-spacing:.16em;color:#FFFFFF\">FINOS<\u002Fp>\n        <p style=\"margin:0;font-size:13px;color:#9E9EA0\">AI Financial Operating System<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-wrap:wrap;gap:12px;align-items:center\">\n        <a href=\"finos-proto.html\" style=\"height:46px;display:inline-flex;align-items:center;padding:0 24px;border-radius:999px;background:#FFFFFF;color:#111111;font-size:13.5px;font-weight:600\" style-hover=\"background:#E5E5E5\">View FINOS prototype →<\u002Fa>\n        <a href=\"#ch01\" style=\"height:46px;display:inline-flex;align-items:center;padding:0 24px;border-radius:999px;border:1px solid #2B2B2B;color:#FFFFFF;font-size:13.5px;font-weight:600\" style-hover=\"border-color:#6B6B6D\">Back to the start<\u002Fa>\n        <span aria-disabled=\"true\" style=\"height:46px;display:inline-flex;align-items:center;padding:0 24px;border-radius:999px;border:1px dashed #2B2B2B;color:#6B6B6D;font-size:13.5px;font-weight:600\">Next project · not yet published<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n\n\n<footer style=\"max-width:1240px;margin:0 auto;padding:32px {{ gutter }};display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;border-top:1px solid #E5E5E5\">\n  <span style=\"font-size:11.5px;color:#6B6B6D\">FINOS · self-initiated product concept · research-informed prototype V1.4.1<\u002Fspan>\n  <span style=\"font-size:11.5px;color:#6B6B6D\">All financial figures shown are simulated demo data.<\u002Fspan>\n<\u002Ffooter>\n\n<\u002Fmain>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#111111&quot;,&quot;options&quot;:[&quot;#007D48&quot;,&quot;#111111&quot;,&quot;#39393B&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Presentation&quot;},&quot;revealMotion&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Presentation&quot;},&quot;showChapterRail&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Presentation&quot;}}\">\nclass Component extends DCLogic {\n  state = { vw: 1440, active: 'ch01', openQ: null, lens: 'all', openHyp: 0, prin: null, dom: null, openDD: 0, ver: 5, find: 0, iter: 0, out: -1, less: 0, lim: -1 };\n\n  RQ = [\n    ['Financial context', 'How do people currently assemble information before making significant financial decisions?', 'Understanding what information people gather before deciding.'],\n    ['Decision friction', 'Where does financial decision-making become difficult or overwhelming?', 'Locating the point where reasoning breaks down.'],\n    ['Trust conditions', 'What information does someone need before trusting a financial recommendation?', 'Identifying what has to be visible for a recommendation to be evaluated.'],\n    ['AI usefulness', 'When does an AI recommendation feel useful versus risky?', 'Finding where AI assistance helps and where it unsettles.'],\n    ['Autonomy limits', 'How much autonomy should an AI financial system have?', 'Testing where automation should stop and a person should decide.'],\n    ['Challengeability', 'What would allow someone to challenge or override an AI recommendation confidently?', 'Understanding what disagreement needs in order to be possible.'],\n    ['Accountability', 'What should happen after a consequential financial decision is made?', 'Establishing what record a decision has to leave behind.']\n  ];\n\n  METHODS = [\n    ['Exploratory research', 'Understanding financial decision-making, fragmentation, trust and AI expectations.', 'Exploratory'],\n    ['Product / competitive analysis', 'Examining how existing financial and AI products approach information, recommendations, automation and user control.', 'Desk research'],\n    ['Scenario exploration', 'Using consequential financial scenarios to identify where users need context, comparison and explanation.', 'Directional'],\n    ['Usability evaluation', 'Testing whether emerging FINOS flows made recommendations, scenarios, challengeability and approval understandable.', 'Prototype evaluation']\n  ];\n\n  LENSES = [\n    ['Context', 'What information does the user need?'],\n    ['Decision', 'How are alternatives evaluated?'],\n    ['Trust', 'What makes a recommendation believable?'],\n    ['Control', 'When should the human remain in the loop?']\n  ];\n\n  AFF = [\n    ['ctx', 'Financial information is spread across multiple places.'],\n    ['ctx', 'Users need to understand their current position before planning.'],\n    ['ctx', 'Balances alone do not explain what is affordable.'],\n    ['ctx', 'Upcoming commitments are easy to overlook.'],\n    ['ctx', 'Cash and investments are reasoned about separately.'],\n    ['ctx', 'A coherent picture has to be assembled manually.'],\n    ['dec', 'One financial change can affect several goals.'],\n    ['dec', 'Comparing possible outcomes is difficult.'],\n    ['dec', 'Trade-offs move together rather than one at a time.'],\n    ['dec', 'Users want to see the effect before committing.'],\n    ['dec', 'Small changes in assumptions can change the answer.'],\n    ['dec', 'There is rarely one obviously correct option.'],\n    ['tru', 'Users want to know why an AI recommendation was made.'],\n    ['tru', 'AI confidence alone does not explain the recommendation.'],\n    ['tru', 'Evidence carries more weight than certainty.'],\n    ['tru', 'Unexplained precision reduces trust rather than building it.'],\n    ['tru', 'Users look for what the system might be assuming.'],\n    ['ctl', 'Users may want to challenge an assumption.'],\n    ['ctl', 'Accepting or rejecting feels too binary.'],\n    ['ctl', 'Consequential actions need explicit approval.'],\n    ['ctl', 'Routine, low-consequence work is welcome to be automated.'],\n    ['ctl', 'Users need visibility into what the system changed.']\n  ];\n\n  HYP = [\n    ['Financial information is fragmented.', 'Users need a coherent financial picture before evaluating a decision.', 'If FINOS establishes financial context before presenting recommendations, users will have a clearer mental model of the decision.', 'Unified Financial Context'],\n    ['Users need to understand AI recommendations.', 'A recommendation without reasoning is difficult to evaluate.', 'If FINOS exposes evidence, assumptions, risks and alternatives, users will be better able to evaluate the recommendation.', 'Decision Rationale'],\n    ['Users may disagree with an AI recommendation.', 'Accept or reject is too binary for a consequential decision.', 'If users can change assumptions and recalculate the recommendation, they will have greater control over the decision.', 'Challenge Recommendation'],\n    ['Financial actions carry different consequences.', 'Automation should not have one universal autonomy level.', 'If human approval is proportional to the consequence of an action, FINOS can automate repetitive work while preserving control over consequential decisions.', 'Governed AI Agents + Approval']\n  ];\n\n  DOMAINS = [\n    ['Money', ['Accounts', 'Transactions', 'Cash Flow', 'Bills', 'Documents'], 'Establishes what is true today.'],\n    ['Wealth', ['Portfolio', 'Investments', 'Risk', 'Goals'], 'Establishes what is at stake.'],\n    ['Intelligence', ['Ask FINOS', 'Insights', 'Forecasts', 'AI Recommendations'], 'Interprets both, and says what it means.'],\n    ['Decisions', ['Decision Room', 'Scenario Builder', 'Scenario Comparison', 'Decision History'], 'Where a question becomes a modelled, recorded decision.'],\n    ['Automations', ['AI Agents', 'Tasks', 'Approvals', 'Activity'], 'Prepares work and waits for authority.'],\n    ['Workspace', ['Team', 'Permissions', 'Integrations', 'Audit'], 'Defines who may do what, and keeps the record.']\n  ];\n\n  JOURNEY = [\n    ['Understand', 'Understand the current financial context.'],\n    ['Model', 'Create the property scenario.'],\n    ['Compare', 'Compare alternative strategies.'],\n    ['Evaluate', 'Inspect the FINOS recommendation.'],\n    ['Challenge', 'Question an assumption.'],\n    ['Recalculate', 'Explore the changed outcome.'],\n    ['Approve', 'Review and approve the decision.'],\n    ['Audit', 'Understand what happened.']\n  ];\n\n  AIROLE = [\n    ['AI does', ['Synthesises financial context', 'Identifies patterns', 'Models scenarios', 'Generates recommendations', 'Explains its reasoning', 'Flags uncertainty', 'Prepares actions']],\n    ['AI does not', ['Make irreversible decisions without approval', 'Hide its assumptions', 'Present uncertain conclusions as facts', 'Remove the ability to challenge it', 'Execute consequential actions silently']],\n    ['Human does', ['Evaluates', 'Questions', 'Changes assumptions', 'Approves', 'Rejects', 'Owns the final decision']]\n  ];\n\n  DD = [\n    ['Design around decisions, not dashboards.', 'Financial dashboards prioritise visibility. Visibility does not tell you what to do.', 'Make a consequential decision a first-class product object, not a by-product of browsing.', 'Decision Room', 'Users move from financial context into a structured decision workflow.'],\n    ['Model scenarios instead of presenting one answer.', 'Financial decisions carry trade-offs that move together.', 'Let users compare possible futures rather than receive a single verdict.', 'Scenario Builder + Scenario Comparison', 'Users can see how an assumption changes the outcome.'],\n    ['Make recommendations inspectable.', 'AI output can feel like a black box, and confidence alone explains nothing.', 'Expose the reasoning as part of the recommendation itself.', 'Decision Rationale · why, evidence, assumptions, risks, alternatives, confidence', 'The recommendation becomes something users can evaluate rather than obey.'],\n    ['Make disagreement a first-class interaction.', 'Accept or reject is too binary for a consequential decision.', 'Let users challenge the assumption underneath the recommendation.', 'Challenge Recommendation', 'Users explore how changing their priorities changes the recommendation.'],\n    ['Scale autonomy with consequence.', 'Not all automation carries the same risk.', 'Make human control proportional to what the action would do.', 'AI Agents + Review + Approval', 'Repetitive work is automated without treating every action as equally safe.'],\n    ['Give every consequential decision a trace.', 'Approval alone does not create accountability.', 'Preserve the reasoning, not just the outcome.', 'Decision History + Audit', 'Users can see what was recommended, challenged, changed and approved.']\n  ];\n\n  VERS = [\n    ['Concept', 'Concept', 'Establish the vision', 'An AI financial operating system combining financial context, intelligence, scenarios and decision support.', 'Could FINOS become more than a financial dashboard?', 'question'],\n    ['V1', 'Product foundation', 'Establish breadth', 'The core ecosystem and the first version of the financial decision experience: financial overview, intelligence, scenario modelling, decision experience, AI assistance.', 'The first prototype established the product breadth, but the system still needed a clearer decision model.', 'learning'],\n    ['V1.1', 'System strengthening', 'Connect the parts', 'Strengthened the workflows underneath the interface — navigation, decision flow, scenario relationships, AI interaction and workflow continuity — without changing the visual system.', 'FINOS needed stronger continuity between financial context, modelling and decision-making.', 'learning'],\n    ['V1.3', 'Decision experience', 'Deepen the decision', 'Expanded the Decision Room, scenario comparison, recommendation, challenge, approval and decision history, and the relationships between them.', 'The product was becoming less about viewing financial information and more about supporting a consequential decision.', 'learning'],\n    ['V1.4', 'Research-informed iteration', 'Explain and control', 'Applied research-backed decisions around explanation, challengeability, human control and traceability — decision rationale, challenge flow, human approval, audit, AI confidence and uncertainty.', 'The core interaction model became clearer: AI prepares and explains; humans evaluate, challenge and approve.', 'learning'],\n    ['V1.4.1', 'Refined experience', 'Clarity and consistency', 'Refined the V1.4 implementation: one action pipeline behind every state change, risk-proportional approval with individual confirmation above low risk, scenario versions that store their computed result, enforced permissions, and consistent spacing and corner treatment across every card.', 'Refinement was not decoration — most of it was making the system behave consistently everywhere it had behaved differently.', 'learning']\n  ];\n\n  FINDS = [\n    ['P1', 'Decision clarity', 'A recommendation can read as a verdict.', 'When the recommended option was the most prominent thing on screen, it could be read as the answer rather than as advice — the point where the user stops evaluating and starts complying.', 'On a consequential financial decision, a recommendation mistaken for a verdict transfers authorship of the decision to the system. Nothing in the interface should let that happen quietly.', 'Prototype evaluation · exploratory', 'USABILITY FINDING', 'The recommendation now names itself as a recommendation, carries its confidence in the same block, and the approval step requires the user to acknowledge that FINOS recommended rather than authorised the decision.'],\n    ['P1', 'AI explainability', 'Confidence without reasoning explains nothing.', 'A confidence label on its own invited either blanket trust or blanket suspicion. Users had no way to tell which part of the reasoning was weak.', 'A recommendation that cannot be inspected cannot be evaluated — and an enterprise decision that cannot be evaluated cannot be defended afterwards.', 'Prototype evaluation · exploratory', 'USABILITY FINDING', 'Decision Rationale exposes why, evidence, assumptions, risks, alternatives and confidence together — including risks FINOS states against its own recommendation.'],\n    ['P1', 'Challengeability', 'Disagreement had nowhere to go.', 'With only accept or reject available, a user who disagreed with an assumption had to reject the whole recommendation — losing the analysis along with the assumption.', 'Most real disagreement is with one input, not the entire model. Forcing an all-or-nothing response pushes users out of the system to do the thinking elsewhere.', 'Prototype evaluation · exploratory', 'USABILITY FINDING', 'Challenge Recommendation is a visible, intentional action that changes a named assumption and re-runs the same engine — so the answer can move against FINOS.'],\n    ['P2', 'Approval & control', 'Approval needs a restatement, not a button.', 'The consequences of approving were established several steps earlier, in the scenario and the comparison — not at the moment of authorising.', 'Authority exercised without a summary of what is being authorised is a governance gap, not just a usability one.', 'Prototype evaluation · exploratory', 'USABILITY FINDING', 'Review & Approve restates decision, scenario version, recommendation, assumptions, key trade-off, risk carried and expected monthly impact before the approve action is available.'],\n    ['P2', 'Traceability', 'A decision without its reasoning is just an outcome.', 'An approved decision that records only its result loses the assumptions and the disagreement that produced it.', 'Accountability needs the argument, not the conclusion — particularly where an AI system contributed to it.', 'Desk research + prototype evaluation · directional', 'DIRECTIONAL FINDING', 'The decision trail preserves the version saved, the challenge, the recalculation, the approval and who performed each — and the challenge is kept in the record rather than edited out.'],\n    ['P3', 'Post-decision monitoring', 'Whether users return to a saved decision is untested.', 'FINOS can monitor a decision after approval and raise a review, but no evaluation covered whether users come back to a decision record months later, or what would bring them back.', 'If nobody returns, monitoring is engineering rather than product. This one needs real longitudinal use to answer.', 'No evaluation evidence', 'HYPOTHESIS — NOT YET VALIDATED', 'Left as a stated hypothesis rather than designed against — the honest position at prototype stage.']\n  ];\n\n  ITERS = [\n    ['Recommendation interpretation', 'Users need to distinguish AI guidance from a final decision.', 'Strengthen the recommendation hierarchy and the human decision state.', 'A clearer separation between AI recommendation and human approval.', 'Decision clarity'],\n    ['Recommendation reasoning', 'Users need enough context to evaluate the recommendation.', 'Strengthen Decision Rationale.', 'Users can inspect why, evidence, assumptions, risks, alternatives and confidence.', 'Explainability'],\n    ['Challengeability', 'Users need a direct mechanism for questioning the recommendation.', 'Strengthen the Challenge Recommendation interaction.', 'Challenge becomes an intentional part of the decision flow.', 'Challengeability'],\n    ['Approval comprehension', 'Consequential actions require an explicit review moment.', 'Strengthen Review & Approve.', 'Users review the decision before authorising it.', 'Human control'],\n    ['Post-decision traceability', 'The decision should remain understandable after action.', 'Strengthen Decision History and Audit.', 'The system preserves decision, scenario, recommendation, challenge, changes, approval and outcome.', 'Traceability']\n  ];\n\n  TASKS = [\n    'Review your financial position and identi
