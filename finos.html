6px 0 0;text-align:center;font-size:11.5px;color:#6B6B6D;text-wrap:pretty\">Seven sources; one picture the user has to assemble themselves.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- THEME 02 -->\n  <div data-reveal=\"1\" style=\"border-top:2px solid #111111;padding-top:24px;margin-bottom:64px\">\n    <div style=\"display:grid;grid-template-columns:{{ probGrid }};gap:{{ probGap }};align-items:start\">\n      <div>\n        <p style=\"margin:0 0 12px;font-size:11px;font-weight:600;letter-spacing:.14em;color:#6B6B6D\">THEME 02<\u002Fp>\n        <h3 style=\"margin:0 0 16px;font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:{{ h3Size }};line-height:1;text-transform:uppercase\">Recommendations need reasoning.<\u002Fh3>\n        <p style=\"margin:0 0 24px;font-size:14.5px;line-height:1.55;color:#39393B;text-wrap:pretty\">A recommendation becomes harder to trust when the user cannot understand the assumptions, evidence or trade-offs behind it.<\u002Fp>\n        <div style=\"border-left:3px solid #111111;padding-left:16px;margin-bottom:16px\">\n          <p style=\"margin:0 0 6px;font-size:10.5px;font-weight:600;letter-spacing:.1em;color:#6B6B6D\">INSIGHT<\u002Fp>\n          <p style=\"margin:0;font-size:13.5px;line-height:1.5;color:#111111;text-wrap:pretty\">Explainability needs to be part of the decision itself, not a footnote after it.<\u002Fp>\n        <\u002Fdiv>\n        <p style=\"margin:0;display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:600;letter-spacing:.06em;color:#FFFFFF;background:#111111;border-radius:999px;padding:8px 16px\">DESIGN IMPLICATION · CREATE A DECISION RATIONALE LAYER<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"border:1px solid #E5E5E5;border-radius:14px;padding:{{ diagramPad }};background:#FAFAFA\">\n        <p style=\"margin:0 0 20px;text-align:center;font-family:'Bebas Neue',sans-serif;font-size:30px;line-height:1;text-transform:uppercase;color:#FFFFFF;background:#111111;border-radius:14px;padding:14px\">RECOMMENDATION<\u002Fp>\n        <p aria-hidden=\"true\" style=\"margin:0 0 20px;text-align:center;color:#CACACB;font-size:18px\">↓<\u002Fp>\n        <div style=\"display:flex;flex-direction:column;gap:8px\">\n          <span style=\"font-size:12.5px;font-weight:600;letter-spacing:.06em;color:#111111;background:#FFFFFF;border:1px solid #CACACB;border-radius:999px;padding:10px 16px\">WHY?<\u002Fspan>\n          <span style=\"font-size:12.5px;font-weight:600;letter-spacing:.06em;color:#111111;background:#FFFFFF;border:1px solid #CACACB;border-radius:999px;padding:10px 16px\">EVIDENCE<\u002Fspan>\n          <span style=\"font-size:12.5px;font-weight:600;letter-spacing:.06em;color:#111111;background:#FFFFFF;border:1px solid #CACACB;border-radius:999px;padding:10px 16px\">ASSUMPTIONS<\u002Fspan>\n          <span style=\"font-size:12.5px;font-weight:600;letter-spacing:.06em;color:#111111;background:#FFFFFF;border:1px solid #CACACB;border-radius:999px;padding:10px 16px\">RISKS<\u002Fspan>\n          <span style=\"font-size:12.5px;font-weight:600;letter-spacing:.06em;color:#111111;background:#FFFFFF;border:1px solid #CACACB;border-radius:999px;padding:10px 16px\">ALTERNATIVES<\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"margin:16px 0 0;font-size:11.5px;color:#6B6B6D;text-wrap:pretty\">Each layer is something the user asked for before accepting an outcome.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- THEME 03 -->\n  <div data-reveal=\"1\" style=\"border-top:2px solid #111111;padding-top:24px;margin-bottom:64px\">\n    <div style=\"display:grid;grid-template-columns:{{ probGrid }};gap:{{ probGap }};align-items:start\">\n      <div>\n        <p style=\"margin:0 0 12px;font-size:11px;font-weight:600;letter-spacing:.14em;color:#6B6B6D\">THEME 03<\u002Fp>\n        <h3 style=\"margin:0 0 16px;font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:{{ h3Size }};line-height:1;text-transform:uppercase\">Trust requires the ability to disagree.<\u002Fh3>\n        <p style=\"margin:0 0 24px;font-size:14.5px;line-height:1.55;color:#39393B;text-wrap:pretty\">Accepting or rejecting an AI recommendation is too binary for consequential financial decisions.<\u002Fp>\n        <div style=\"border-left:3px solid #111111;padding-left:16px;margin-bottom:16px\">\n          <p style=\"margin:0 0 6px;font-size:10.5px;font-weight:600;letter-spacing:.1em;color:#6B6B6D\">INSIGHT<\u002Fp>\n          <p style=\"margin:0;font-size:13.5px;line-height:1.5;color:#111111;text-wrap:pretty\">Challengeability should be a first-class interaction, not an escape hatch.<\u002Fp>\n        <\u002Fdiv>\n        <p style=\"margin:0;display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:600;letter-spacing:.06em;color:#FFFFFF;background:#111111;border-radius:999px;padding:8px 16px\">DESIGN IMPLICATION · LET USERS CHALLENGE AND RE-RUN<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"border:1px solid #E5E5E5;border-radius:14px;padding:{{ diagramPad }};background:#FAFAFA\">\n        <p style=\"margin:0 0 12px;font-size:10.5px;font-weight:600;letter-spacing:.1em;color:#6B6B6D\">WHAT WE STARTED WITH<\u002Fp>\n        <div style=\"display:flex;gap:12px;align-items:center;margin-bottom:24px\">\n          <span style=\"flex:1 1 auto;text-align:center;font-size:12.5px;font-weight:600;letter-spacing:.06em;color:#6B6B6D;border:1px dashed #CACACB;border-radius:999px;padding:10px 16px;text-decoration:line-through\">ACCEPT<\u002Fspan>\n          <span style=\"font-size:11px;color:#9E9EA0\">or<\u002Fspan>\n          <span style=\"flex:1 1 auto;text-align:center;font-size:12.5px;font-weight:600;letter-spacing:.06em;color:#6B6B6D;border:1px dashed #CACACB;border-radius:999px;padding:10px 16px;text-decoration:line-through\">REJECT<\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"margin:0 0 12px;font-size:10.5px;font-weight:600;letter-spacing:.1em;color:#111111\">WHAT THE RESEARCH ASKED FOR<\u002Fp>\n        <div style=\"display:flex;flex-direction:column;gap:8px\">\n          <span style=\"font-size:12.5px;font-weight:600;letter-spacing:.06em;color:#FFFFFF;background:#111111;border-radius:999px;padding:10px 16px\">QUESTION<\u002Fspan>\n          <span style=\"font-size:12.5px;font-weight:600;letter-spacing:.06em;color:#FFFFFF;background:#111111;border-radius:999px;padding:10px 16px\">CHANGE ASSUMPTION<\u002Fspan>\n          <span style=\"font-size:12.5px;font-weight:600;letter-spacing:.06em;color:#FFFFFF;background:#111111;border-radius:999px;padding:10px 16px\">RECALCULATE<\u002Fspan>\n          <span style=\"font-size:12.5px;font-weight:600;letter-spacing:.06em;color:#FFFFFF;background:#111111;border-radius:999px;padding:10px 16px\">COMPARE<\u002Fspan>\n          <span style=\"font-size:12.5px;font-weight:600;letter-spacing:.06em;color:#FFFFFF;background:#111111;border-radius:999px;padding:10px 16px\">DECIDE<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- THEME 04 -->\n  <div data-reveal=\"1\" style=\"border-top:2px solid #111111;padding-top:24px;margin-bottom:64px\">\n    <p style=\"margin:0 0 12px;font-size:11px;font-weight:600;letter-spacing:.14em;color:#6B6B6D\">THEME 04<\u002Fp>\n    <div style=\"display:grid;grid-template-columns:{{ twoCol }};gap:48px;margin-bottom:32px;align-items:start\">\n      <h3 style=\"margin:0;font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:{{ h3Size }};line-height:1;text-transform:uppercase\">Automation needs proportional control.<\u002Fh3>\n      <p style=\"margin:0;font-size:14.5px;line-height:1.55;color:#39393B;text-wrap:pretty\">Not every financial action carries the same consequence. The appropriate level of human involvement should depend on what the system is about to do.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:{{ triGrid }};gap:16px;margin-bottom:24px\">\n      <div style=\"border:1px solid #E5E5E5;border-radius:14px;padding:20px\">\n        <p style=\"margin:0 0 12px;font-size:10.5px;font-weight:600;letter-spacing:.1em;color:#6B6B6D\">LOW CONSEQUENCE<\u002Fp>\n        <p style=\"margin:0 0 16px;font-family:'Bebas Neue',sans-serif;font-size:26px;line-height:1;text-transform:uppercase\">AI can automate<\u002Fp>\n        <p style=\"margin:0;font-size:12.5px;line-height:1.5;color:#39393B;text-wrap:pretty\">Categorising a transaction. Reversible, low value, high volume.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"border:1px solid #E5E5E5;border-radius:14px;padding:20px\">\n        <p style=\"margin:0 0 12px;font-size:10.5px;font-weight:600;letter-spacing:.1em;color:#6B6B6D\">MEDIUM CONSEQUENCE<\u002Fp>\n        <p style=\"margin:0 0 16px;font-family:'Bebas Neue',sans-serif;font-size:26px;line-height:1;text-transform:uppercase\">AI prepares<br>Human reviews<\u002Fp>\n        <p style=\"margin:0;font-size:12.5px;line-height:1.5;color:#39393B;text-wrap:pretty\">Reclassifying a record or flagging a duplicate. Correctable, but visible.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"border:1px solid #111111;border-radius:14px;padding:20px;background:#111111;color:#FFFFFF\">\n        <p style=\"margin:0 0 12px;font-size:10.5px;font-weight:600;letter-spacing:.1em;color:#9E9EA0\">HIGH CONSEQUENCE<\u002Fp>\n        <p style=\"margin:0 0 16px;font-family:'Bebas Neue',sans-serif;font-size:26px;line-height:1;text-transform:uppercase;color:#FFFFFF\">AI prepares<br>Human approves<br>System executes<\u002Fp>\n        <p style=\"margin:0;font-size:12.5px;line-height:1.5;color:#E5E5E5;text-wrap:pretty\">Moving money or recording a decision. Hard to unwind, so never automatic.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:{{ twoCol }};gap:24px\">\n      <div style=\"border-left:3px solid #111111;padding-left:16px\">\n        <p style=\"margin:0 0 6px;font-size:10.5px;font-weight:600;letter-spacing:.1em;color:#6B6B6D\">INSIGHT<\u002Fp>\n        <p style=\"margin:0;font-size:13.5px;line-height:1.5;color:#111111;text-wrap:pretty\">The level of human control should increase with the consequence of the action.<\u002Fp>\n      <\u002Fdiv>\n      <p style=\"margin:0;align-self:end;display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:600;letter-spacing:.06em;color:#FFFFFF;background:#111111;border-radius:999px;padding:8px 16px;justify-self:start\">DESIGN IMPLICATION · GOVERNED AUTOMATION AND EXPLICIT APPROVAL<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- synthesis band -->\n<section aria-label=\"Research synthesis\" style=\"background:#111111;color:#FFFFFF;padding:{{ bandPad }}\">\n  <div style=\"max-width:1240px;margin:0 auto\">\n    <p style=\"margin:0 0 24px;font-size:11px;font-weight:600;letter-spacing:.14em;color:#9E9EA0\">RESEARCH SYNTHESIS<\u002Fp>\n    <h2 style=\"margin:0 0 40px;font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:{{ h2Size }};line-height:.94;text-transform:uppercase;color:#FFFFFF;max-width:22ch;text-wrap:pretty\">The research pointed to the same underlying problem.<\u002Fh2>\n    <div style=\"display:flex;flex-wrap:wrap;gap:16px;align-items:center;margin-bottom:40px\">\n      <span style=\"font-family:'Bebas Neue',sans-serif;font-size:28px;line-height:1;text-transform:uppercase;color:#FFFFFF;border-bottom:2px solid #FFFFFF;padding-bottom:4px\">Fragmentation<\u002Fspan>\n      <span aria-hidden=\"true\" style=\"color:#6B6B6D;font-size:20px\">+<\u002Fspan>\n      <span style=\"font-family:'Bebas Neue',sans-serif;font-size:28px;line-height:1;text-transform:uppercase;color:#FFFFFF;border-bottom:2px solid #FFFFFF;padding-bottom:4px\">Complexity<\u002Fspan>\n      <span aria-hidden=\"true\" style=\"color:#6B6B6D;font-size:20px\">+<\u002Fspan>\n      <span style=\"font-family:'Bebas Neue',sans-serif;font-size:28px;line-height:1;text-transform:uppercase;color:#FFFFFF;border-bottom:2px solid #FFFFFF;padding-bottom:4px\">Trust<\u002Fspan>\n      <span aria-hidden=\"true\" style=\"color:#6B6B6D;font-size:20px\">+<\u002Fspan>\n      <span style=\"font-family:'Bebas Neue',sans-serif;font-size:28px;line-height:1;text-transform:uppercase;color:#FFFFFF;border-bottom:2px solid #FFFFFF;padding-bottom:4px\">Control<\u002Fspan>\n    <\u002Fdiv>\n    <p data-reveal=\"1\" style=\"margin:0;font-family:'Bebas Neue',sans-serif;font-size:{{ revealSize }};line-height:.9;letter-spacing:.005em;text-transform:uppercase;color:#FFFFFF;max-width:20ch;text-wrap:pretty\">People need help making decisions — not just finding information.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- affinity + coding -->\n<section aria-label=\"Exploratory synthesis\" style=\"max-width:1240px;margin:0 auto;padding:{{ secPad }}\">\n  <div style=\"display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:end;margin-bottom:24px\">\n    <div>\n      <p style=\"margin:0 0 12px;font-size:11px;font-weight:600;letter-spacing:.14em;color:#6B6B6D\">EXPLORATORY SYNTHESIS<\u002Fp>\n      <h3 style=\"margin:0;font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:{{ h3Size }};line-height:1;text-transform:uppercase\">22 evidence statements, four clusters.<\u002Fh3>\n    <\u002Fdiv>\n    <p style=\"margin:0;font-size:12.5px;color:#6B6B6D;max-width:44ch;text-wrap:pretty\">Synthesised observations, not verbatim quotes. Filter by cluster to see what fed each theme.<\u002Fp>\n  <\u002Fdiv>\n  <div role=\"group\" aria-label=\"Filter evidence by cluster\" style=\"display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px\">\n    <sc-for list=\"{{ affFilters }}\" as=\"f\" hint-placeholder-count=\"5\">\n      <button sc-camel-on-click=\"{{ f.pick }}\" aria-pressed=\"{{ f.pressed }}\" style=\"{{ f.style }}\">{{ f.label }}<\u002Fbutton>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:{{ affGrid }};gap:16px;margin-bottom:64px\">\n    <sc-for list=\"{{ aff }}\" as=\"a\" hint-placeholder-count=\"22\">\n      <div style=\"{{ a.style }}\">\n        <p style=\"{{ a.textStyle }}\">{{ a.text }}<\u002Fp>\n        <span style=\"{{ a.tagStyle }}\">{{ a.group }}<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n\n  <p style=\"margin:0 0 24px;font-size:11px;font-weight:600;letter-spacing:.14em;color:#6B6B6D\">OBSERVATIONS → CODES → THEMES → INSIGHTS<\u002Fp>\n  <div style=\"display:grid;grid-template-columns:{{ codedGrid }};gap:16px;margin-bottom:64px\">\n    <sc-for list=\"{{ coded }}\" as=\"c\" hint-placeholder-count=\"3\">\n      <div style=\"border:1px solid #E5E5E5;border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:12px\">\n        <div>\n          <p style=\"margin:0 0 4px;font-size:10px;font-weight:600;letter-spacing:.08em;color:#9E9EA0\">OBSERVATION<\u002Fp>\n          <p style=\"margin:0;font-size:13px;line-height:1.45;color:#111111;text-wrap:pretty\">{{ c.o }}<\u002Fp>\n        <\u002Fdiv>\n        <span aria-hidden=\"true\" style=\"color:#CACACB\">↓<\u002Fspan>\n        <div>\n          <p style=\"margin:0 0 4px;font-size:10px;font-weight:600;letter-spacing:.08em;color:#9E9EA0\">CODE<\u002Fp>\n          <p style=\"margin:0;font-size:13px;font-weight:600;color:#111111\">{{ c.c }}<\u002Fp>\n        <\u002Fdiv>\n        <span aria-hidden=\"true\" style=\"color:#CACACB\">↓<\u002Fspan>\n        <div>\n          <p style=\"margin:0 0 4px;font-size:10px;font-weight:600;letter-spacing:.08em;color:#9E9EA0\">THEME<\u002Fp>\n          <p style=\"margin:0;font-size:13px;font-weight:600;color:#111111\">{{ c.t }}<\u002Fp>\n        <\u002Fdiv>\n        <span aria-hidden=\"true\" style=\"color:#CACACB\">↓<\u002Fspan>\n        <div style=\"border-left:3px solid #111111;padding-left:12px;margin-top:auto\">\n          <p style=\"margin:0 0 4px;font-size:10px;font-weight:600;letter-spacing:.08em;color:#6B6B6D\">INSIGHT<\u002Fp>\n          <p style=\"margin:0;font-size:13.5px;line-height:1.45;color:#111111;text-wrap:pretty\">{{ c.ins }}<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n\n  <p style=\"margin:0 0 8px;font-size:11px;font-weight:600;letter-spacing:.14em;color:#6B6B6D\">DIRECTIONAL RESEARCH SIGNALS<\u002Fp>\n  <p style=\"margin:0 0 24px;font-size:12.5px;color:#6B6B6D;max-width:80ch;text-wrap:pretty\">These describe the scope of the synthesis, not the behaviour of a population. No percentages are claimed because no representative sample was collected.<\u002Fp>\n  <div style=\"display:grid;grid-template-columns:{{ signalGrid }};gap:16px\">\n    <sc-for list=\"{{ signals }}\" as=\"s\" hint-placeholder-count=\"4\">\n      <div style=\"border-top:2px solid #111111;padding-top:16px\">\n        <p style=\"margin:0 0 8px;font-family:'Bebas Neue',sans-serif;font-size:44px;line-height:.9;font-variant-numeric:tabular-nums\">{{ s.num }}<\u002Fp>\n        <p style=\"margin:0 0 8px;font-size:13px;line-height:1.45;color:#111111;text-wrap:pretty\">{{ s.what }}<\u002Fp>\n        <p style=\"margin:0;font-size:12px;line-height:1.45;color:#6B6B6D;text-wrap:pretty\">{{ s.imp }}<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ 07 OPPORTUNITY ============ -->\n<section id=\"ch07\" data-screen-label=\"07 Opportunity\" style=\"background:#F5F5F5;padding:{{ secPad }}\">\n  <div style=\"max-width:1240px;margin:0 auto\">\n    <p style=\"margin:0 0 24px;font-size:11px;font-weight:600;letter-spacing:.14em;color:#6B6B6D\">07 — FROM INSIGHTS TO OPPORTUNITY<\u002Fp>\n    <h2 style=\"margin:0 0 32px;font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:{{ h2Size }};line-height:.94;letter-spacing:.005em;text-transform:uppercase;max-width:22ch;text-wrap:pretty\">Research only became useful when it changed what I designed.<\u002Fh2>\n    <div style=\"display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:48px\">\n      <span style=\"font-size:11px;font-weight:600;letter-spacing:.1em;color:#111111;background:#FFFFFF;border:1px solid #CACACB;border-radius:999px;padding:8px 16px\">RESEARCH OBSERVATION<\u002Fspan>\n      <span aria-hidden=\"true\" style=\"color:#CACACB\">→<\u002Fspan>\n      <span style=\"font-size:11px;font-weight:600;letter-spacing:.1em;color:#111111;background:#FFFFFF;border:1px solid #CACACB;border-radius:999px;padding:8px 16px\">INSIGHT<\u002Fspan>\n      <span aria-hidden=\"true\" style=\"color:#CACACB\">→<\u002Fspan>\n      <span style=\"font-size:11px;font-weight:600;letter-spacing:.1em;color:#111111;background:#FFFFFF;border:1px solid #CACACB;border-radius:999px;padding:8px 16px\">HYPOTHESIS<\u002Fspan>\n      <span aria-hidden=\"true\" style=\"color:#CACACB\">→<\u002Fspan>\n      <span style=\"font-size:11px;font-weight:600;letter-spacing:.1em;color:#FFFFFF;background:#111111;border-radius:999px;padding:8px 16px\">DESIGN RESPONSE<\u002Fspan>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;gap:16px;margin-bottom:64px\">\n      <sc-for list=\"{{ hyps }}\" as=\"h\" hint-placeholder-count=\"4\">\n        <div style=\"{{ h.cardStyle }}\">\n          <button sc-camel-on-click=\"{{ h.toggle }}\" aria-expanded=\"{{ h.expanded }}\" style=\"{{ h.headStyle }}\">\n            <span style=\"display:flex;gap:16px;align-items:baseline\">\n              <span style=\"font-family:'Bebas Neue',sans-serif;font-size:26px;line-height:1;color:#CACACB\">{{ h.n }}<\u002Fspan>\n              <span style=\"font-size:16px;font-weight:700;line-height:1.35;color:#111111;text-wrap:pretty\">{{ h.resp }}<\u002Fspan>\n            <\u002Fspan>\n            <span aria-hidden=\"true\" style=\"{{ h.signStyle }}\">+<\u002Fspan>\n          <\u002Fbutton>\n          <sc-if value=\"{{ h.open }}\">\n            <div style=\"padding:0 24px 24px;display:grid;grid-template-columns:{{ twoCol }};gap:24px\">\n              <div style=\"display:flex;flex-direction:column;gap:16px\">\n                <div>\n                  <p style=\"margin:0 0 4px;font-size:10px;font-weight:600;letter-spacing:.08em;color:#9E9EA0\">OBSERVATION<\u002Fp>\n                  <p style=\"margin:0;font-size:13.5px;line-height:1.5;color:#111111;text-wrap:pretty\">{{ h.obs }}<\u002Fp>\n                <\u002Fdiv>\n                <div>\n                  <p style=\"margin:0 0 4px;font-size:10px;font-weight:600;letter-spacing:.08em;color:#9E9EA0\">INSIGHT<\u002Fp>\n                  <p style=\"margin:0;font-size:13.5px;line-height:1.5;color:#111111;text-wrap:pretty\">{{ h.ins }}<\u002Fp>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:16px\">\n                <div style=\"border-left:3px solid #111111;padding-left:16px\">\n                  <p style=\"margin:0 0 4px;font-size:10px;font-weight:600;letter-spacing:.08em;color:#6B6B6D\">HYPOTHESIS<\u002Fp>\n                  <p style=\"margin:0;font-size:14px;line-height:1.5;color:#111111;text-wrap:pretty\">{{ h.hyp }}<\u002Fp>\n                <\u002Fdiv>\n                <p style=\"margin:0;align-self:flex-start;font-size:12px;font-weight:600;letter-spacing:.06em;color:#FFFFFF;background:#111111;border-radius:999px;padding:8px 16px\">DESIGN RESPONSE · {{ h.resp }}<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <p style=\"margin:0 0 24px;font-size:11px;font-weight:600;letter-spacing:.14em;color:#6B6B6D\">USER NEED × PRODUCT OPPORTUNITY<\u002Fp>\n    <div style=\"border:1px solid #CACACB;border-radius:14px;overflow:hidden;background:#FFFFFF\">\n      <sc-for list=\"{{ matrix }}\" as=\"m\" hint-placeholder-count=\"6\">\n        <div style=\"display:grid;grid-template-columns:{{ matrixCol }};gap:16px;padding:20px;border-bottom:1px solid #EFEFEF\">\n          <p style=\"margin:0;font-size:14.5px;line-height:1.4;color:#39393B;text-wrap:pretty\">{{ m.need }}<\u002Fp>\n          <p style=\"margin:0;font-size:14.5px;font-weight:700;line-height:1.4;color:#111111;text-wrap:pretty\">{{ m.opp }}<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ 08 PRODUCT STRATEGY ============ -->\n<section id=\"ch08\" data-screen-label=\"08 Strategy\" style=\"max-width:1240px;margin:0 auto;padding:{{ secPad }}\">\n  <p style=\"margin:0 0 24px;font-size:11px;font-weight:600;letter-spacing:.14em;color:#6B6B6D\">08 — PRODUCT STRATEGY<\u002Fp>\n  <h2 style=\"margin:0 0 48px;font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:{{ h2Size }};line-height:.94;letter-spacing:.005em;text-transform:uppercase;max-width:20ch;text-wrap:pretty\">The research synthesis changed what FINOS needed to prioritise.<\u002Fh2>\n\n  <div style=\"display:grid;grid-template-columns:{{ twoCol }};gap:{{ probGap }};margin-bottom:64px;align-items:start\">\n    <div style=\"border:1px solid #E5E5E5;border-radius:14px;padding:{{ diagramPad }};background:#FAFAFA\">\n      <p style=\"margin:0 0 12px;font-size:10.5px;font-weight:600;letter-spacing:.1em;color:#9E9EA0\">BEFORE<\u002Fp>\n      <p style=\"margin:0 0 24px;font-family:'Bebas Neue',sans-serif;font-size:30px;line-height:1;text-transform:uppercase;color:#6B6B6D\">AI financial dashboard<\u002Fp>\n      <div style=\"display:flex;flex-direction:column;gap:8px\">\n        <span style=\"font-size:13px;color:#6B6B6D;border:1px dashed #CACACB;border-radius:999px;padding:10px 16px\">Data<\u002Fspan>\n        <span aria-hidden=\"true\" style=\"color:#CACACB;font-size:14px\">↓<\u002Fspan>\n        <span style=\"font-size:13px;color:#6B6B6D;border:1px dashed #CACACB;border-radius:999px;padding:10px 16px\">Insights<\u002Fspan>\n        <span aria-hidden=\"true\" style=\"color:#CACACB;font-size:14px\">↓<\u002Fspan>\n        <span style=\"font-size:13px;color:#6B6B6D;border:1px dashed #CACACB;border-radius:999px;padding:10px 16px\">AI recommendations<\u002Fspan>\n      <\u002Fdiv>\n      <p style=\"margin:20px 0 0;font-size:12px;line-height:1.5;color:#6B6B6D;text-wrap:pretty\">Ends where the hard part begins: the user is handed an answer with nothing to evaluate it against.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"border:1px solid #111111;border-radius:14px;padding:{{ diagramPad }};background:#111111;color:#FFFFFF\">\n      <p style=\"margin:0 0 12px;font-size:10.5px;font-weight:600;letter-spacing:.1em;color:#9E9EA0\">AFTER<\u002Fp>\n      <p style=\"margin:0 0 24px;font-family:'Bebas Neue',sans-serif;font-size:30px;line-height:1;text-transform:uppercase;color:#FFFFFF\">Financial decision operating system<\u002Fp>\n      <div style=\"display:flex;flex-wrap:wrap;gap:8px\">\n        <sc-for list=\"{{ finosSteps }}\" as=\"s\" hint-placeholder-count=\"8\">\n          <span style=\"font-size:12px;font-weight:600;letter-spacing:.04em;color:#FFFFFF;border:1px solid #2B2B2B;border-radius:999px;padding:8px 14px\">{{ s.what }}<\u002Fspan>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <p style=\"margin:20px 0 0;font-size:12px;line-height:1.5;color:#E5E5E5;text-wrap:pretty\">Context, scenario, trade-offs, recommendation, human evaluation, challenge, approval, action and audit — one continuous loop.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <p style=\"margin:0 0 8px;font-size:11px;font-weight:600;letter-spacing:.14em;color:#6B6B6D\">PRODUCT PRINCIPLES<\u002Fp>\n  <p style=\"margin:0 0 24px;font-size:12.5px;color:#6B6B6D\">Hover or focus a principle to see the capability it produced in the architecture below.<\u002Fp>\n  <div style=\"display:grid;grid-template-columns:{{ prinGrid }};gap:16px;margin-bottom:64px\">\n    <sc-for list=\"{{ prins }}\" as=\"p\" hint-placeholder-count=\"6\">\n      <div sc-camel-tab-index=\"0\" sc-camel-on-mouse-enter=\"{{ p.enter }}\" sc-camel-on-mouse-leave=\"{{ p.leave }}\" sc-camel-on-focus=\"{{ p.enter }}\" sc-camel-on-blur=\"{{ p.leave }}\" style=\"{{ p.style }}\">\n        <span style=\"{{ p.numStyle }}\">{{ p.n }}<\u002Fspan>\n        <p style=\"{{ p.labelStyle }}\">{{ p.label }}<\u002Fp>\n        <p style=\"{{ p.descStyle }}\">{{ p.desc }}<\u002Fp>\n        <span style=\"{{ p.capStyle }}\">→ {{ p.cap }}<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n\n  <div style=\"background:#111111;color:#FFFFFF;border-radius:14px;padding:{{ diagramPad }}\">\n    <p style=\"margin:0 0 24px;font-size:11px;font-weight:600;letter-spacing:.14em;color:#9E9EA0\">THE PRODUCT SYSTEM<\u002Fp>\n    <div style=\"display:grid;grid-template-columns:{{ archGrid }};gap:32px;align-items:start\">\n      <div style=\"display:flex;flex-direction:column;gap:8px\">\n        <sc-for list=\"{{ arch }}\" as=\"a\" hint-placeholder-count=\"8\">\n          <div style=\"{{ a.style }}\">\n            <span style=\"{{ a.numStyle }}\">{{ a.n }}<\u002Fspan>\n            <span style=\"{{ a.labelStyle }}\">{{ a.label }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div>\n        <p style=\"margin:0 0 16px;font-size:10.5px;font-weight:600;letter-spacing:.1em;color:#9E9EA0\">SUPPORTING CAPABILITIES<\u002Fp>\n        <div style=\"display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px\">\n          <sc-for list=\"{{ caps }}\" as=\"c\" hint-placeholder-count=\"8\">\n            <span style=\"font-size:12px;font-weight:600;letter-spacing:.04em;color:#E5E5E5;border:1px solid #2B2B2B;border-radius:999px;padding:8px 14px\">{{ c.c }}<\u002Fspan>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <p style=\"margin:0;font-size:13px;line-height:1.55;color:#E5E5E5;text-wrap:pretty\">Every layer of the system is answerable to the one above it. Nothing executes that a person did not authorise, and nothing is authorised without its reasoning attached.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"margin-top:64px;border-top:2px solid #111111;padding-top:32px;display:grid;grid-template-columns:{{ twoCol }};gap:48px;align-items:start\">\n    <p style=\"margin:0;font-family:'Bebas Neue',sans-serif;font-size:{{ quoteSize }};line-height:.95;text-transform:uppercase;max-width:18ch;text-wrap:pretty\">FINOS is not designed to replace financial judgement.<\u002Fp>\n    <div style=\"display:flex;flex-direction:column;gap:16px\">\n      <p style=\"margin:0;font-size:{{ leadSize }};line-height:1.5;color:#111111;text-wrap:pretty\">It is designed to make financial judgement more informed, more explainable and easier to act on.<\u002Fp>\n      <p style=\"margin:0;font-size:14.5px;line-height:1.55;color:#39393B;text-wrap:pretty\">That became the foundation for the product architecture.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n\n<div style=\"max-width:1240px;margin:0 auto;padding:0 {{ gutter }}\">\n  <div style=\"border-top:2px solid #111111;padding:24px 0;display:grid;grid-template-columns:{{ twoCol }};gap:24px;align-items:baseline\">\n    <p style=\"margin:0;font-size:10.5px;font-weight:600;letter-spacing:.1em;color:#6B6B6D\">RESEARCH TAKEAWAY<\u002Fp>\n    <p style=\"margin:0;font-size:{{ leadSize }};line-height:1.45;color:#111111;max-width:60ch;text-wrap:pretty\">Users don’t only need an answer. They need enough context to understand, challenge and act on it.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ============ 09 EXPERIENCE ARCHITECTURE ============ -->\n<section id=\"ch09\" data-screen-label=\"09 Architecture\" style=\"max-width:1240px;margin:0 auto;padding:{{ secPad }}\">\n  <p style=\"margin:0 0 24px;font-size:11px;font-weight:600;letter-spacing:.14em;color:#6B6B6D\">09 — EXPERIENCE ARCHITECTURE<\u002Fp>\n  <h2 style=\"margin:0 0 32px;font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:{{ h2Size }};line-height:.94;letter-spacing:.005em;text-transform:uppercase;max-width:18ch;text-wrap:pretty\">Turning the strategy into a system.<\u002Fh2>\n  <div style=\"display:grid;grid-template-columns:{{ twoCol }};gap:48px;margin-bottom:64px\">\n    <p style=\"margin:0;font-size:{{ leadSize }};line-height:1.5;color:#111111;text-wrap:pretty\">FINOS had to support more than financial visibility. The architecture needed to connect context, intelligence, scenarios, decisions, automation and governance without forcing users to understand the underlying complexity.<\u002Fp>\n    <div style=\"display:flex;flex-wrap:wrap;gap:12px;align-items:center;align-content:flex-start\">\n      <span style=\"font-size:11px;font-weight:600;letter-spacing:.1em;color:#111111;border:1px solid #E5E5E5;border-radius:999px;padding:8px 16px\">RESEARCH<\u002Fspan>\n      <span aria-hidden=\"true\" style=\"color:#CACACB\">→<\u002Fspan>\n      <span style=\"font-size:11px;font-weight:600;letter-spacing:.1em;color:#111111;border:1px solid #E5E5E5;border-radius:999px;padding:8px 16px\">PRODUCT STRATEGY<\u002Fspan>\n      <span aria-hidden=\"true\" style=\"color:#CACACB\">→<\u002Fspan>\n      <span style=\"font-size:11px;font-weight:600;letter-spacing:.1em;color:#FFFFFF;background:#111111;border-radius:999px;padding:8px 16px\">EXPERIENCE ARCHITECTURE<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <h3 style=\"margin:0 0 8px;font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:{{ h3Size }};line-height:1;text-transform:uppercase\">The FINOS experience model.<\u002Fh3>\n  <p style=\"margin:0 0 24px;font-size:13.5px;color:#6B6B6D\">Hover or focus an area to see the job it does in the system.<\u002Fp>\n  <div style=\"background:#111111;color:#FFFFFF;border-radius:14px;padding:{{ diagramPad }};margin-bottom:24px;display:flex;flex-wrap:wrap;gap:24px;align-items:center;justify-content:space-between\">\n    <p style=\"margin:0;font-family:'Bebas Neue',sans-serif;font-size:40px;line-height:1;letter-spacing:.14em;text-transform:uppercase;color:#FFFFFF\">FINOS<\u002Fp>\n    <p style=\"margin:0;flex:1 1 320px;font-size:14.5px;line-height:1.5;color:#E5E5E5;text-wrap:pretty\">{{ coreRole }}<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:{{ domGrid }};gap:16px;margin-bottom:64px\">\n    <sc-for list=\"{{ domains }}\" as=\"d\" hint-placeholder-count=\"6\">\n      <div sc-camel-tab-index=\"0\" sc-camel-on-mouse-enter=\"{{ d.enter }}\" sc-camel-on-mouse-leave=\"{{ d.leave }}\" sc-camel-on-focus=\"{{ d.enter }}\" sc-camel-on-blur=\"{{ d.leave }}\" style=\"{{ d.style }}\">\n        <p style=\"{{ d.labelStyle }}\">{{ d.label }}<\u002Fp>\n        <div style=\"display:flex;flex-wrap:wrap;gap:8px\">\n          <sc-for list=\"{{ d.items }}\" as=\"i\" hint-placeholder-count=\"4\">\n            <span style=\"{{ d.itemStyle }}\">{{ i.t }}<\u002Fspan>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <p style=\"{{ d.roleStyle }}\">{{ d.role }}<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n\n  <div style=\"border-top:2px solid #111111;padding-top:24px;margin-bottom:64px\">\n    <div style=\"display:grid;grid-template-columns:{{ twoCol }};gap:48px;margin-bottom:32px;align-items:start\">\n      <h3 style=\"margin:0;font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:{{ h3Size }};line-height:1;text-transform:uppercase;max-width:20ch\">The decision layer became the centre.<\u002Fh3>\n      <p style=\"margin:0;font-size:14.5px;line-height:1.55;color:#39393B;text-wrap:pretty\">Although FINOS contains a broad financial operating system, consequential decisions became the central interaction model. Everything else exists to feed a decision, or to account for one.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-wrap:wrap;gap:8px;align-items:center\">\n      <span style=\"font-size:12px;font-weight:600;letter-spacing:.06em;color:#111111;border:1px solid #CACACB;border-radius:999px;padding:10px 16px\">CONTEXT<\u002Fspan>\n      <span aria-hidden=\"true\" style=\"color:#CACACB\">→<\u002Fspan>\n      <span style=\"font-size:12px;font-weight:600;letter-spacing:.06em;color:#FFFFFF;background:#111111;border-radius:999px;padding:10px 16px\">DECISION<\u002Fspan>\n      <span aria-hidden=\"true\" style=\"color:#CACACB\">→<\u002Fspan>\n      <span style=\"font-size:12px;font-weight:600;letter-spacing:.06em;color:#111111;border:1px solid #CACACB;border-radius:999px;padding:10px 16px\">SCENARIO<\u002Fspan>\n      <span aria-hidden=\"true\" style=\"color:#CACACB\">→<\u002Fspan>\n      <span style=\"font-size:12px;font-weight:600;letter-spacing:.06em;color:#111111;border:1px solid #CACACB;border-radius:999px;padding:10px 16px\">RECOMMENDATION<\u002Fspan>\n      <span aria-hidden=\"true\" style=\"color:#CACACB\">→<\u002Fspan>\n      <span style=\"font-size:12px;font-weight:600;letter-spacing:.06em;color:#111111;border:1px solid #CACACB;border-radius:999px;padding:10px 16px\">ACTION<\u002Fspan>\n      <span aria-hidden=\"true\" style=\"color:#CACACB\">→<\u002Fspan>\n      <span style=\"font-size:12px;font-weight:600;letter-spacing:.06em;color:#111111;border:1px solid #CACACB;border-radius:999px;padding:10px 16px\">AUDIT<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <p style=\"margin:0 0 24px;font-size:11px;font-weight:600;letter-spacing:.14em;color:#6B6B6D\">INFORMATION ARCHITECTURE<\u002Fp>\n  <div style=\"display:grid;grid-template-columns:{{ iaGrid }};gap:16px;margin-bottom:64px\">\n    <div style=\"border:1px solid #E5E5E5;border-radius:14px;padding:20px\">\n      <p style=\"margin:0 0 16px;font-size:10.5px;font-weight:600;letter-spacing:.1em;color:#6B6B6D\">PRIMARY NAVIGATION<\u002Fp>\n      <div style=\"display:flex;flex-direction:column;gap:8px\">\n        <span style=\"font-size:14px;font-weight:600;color:#111111;border-bottom:1px solid #EFEFEF;padding-bottom:8px\">Overview<\u002Fspan>\n        <span style=\"font-size:14px;font-weight:600;color:#111111;border-bottom:1px solid #EFEFEF;padding-bottom:8px\">Money<\u002Fspan>\n        <span style=\"font-size:14px;font-weight:600;color:#111111;border-bottom:1px solid #EFEFEF;padding-bottom:8px\">Wealth<\u002Fspan>\n        <span style=\"font-size:14px;font-weight:600;color:#111111;border-bottom:1px solid #EFEFEF;padding-bottom:8px\">Intelligence<\u002Fspan>\n        <span style=\"font-size:14px;font-weight:700;color:#111111;border-bottom:2px solid #111111;padding-bottom:8px\">Decisions<\u002Fspan>\n        <span style=\"font-size:14px;font-weight:600;color:#111111;border-bottom:1px solid #EFEFEF;padding-bottom:8px\">Automations<\u002Fspan>\n        <span style=\"font-size:14px;font-weight:600;color:#111111\">Workspace<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"border:1px solid #111111;border-radius:14px;padding:20px;background:#FAFAFA\">\n      <p style=\"margin:0 0 16px;font-size:10.5px;font-weight:600;letter-spacing:.1em;color:#6B6B6D\">DECISIONS · SUBSTRUCTURE<\u002Fp>\n      <div style=\"display:flex;flex-direction:column;gap:12px\">\n        <span style=\"font-size:14px;font-weight:700;color:#111111\">Decisions<\u002Fspan>\n        <span style=\"font-size:13.5px;color:#39393B;padding-left:16px;border-left:1px solid #CACACB\">Active Decisions<\u002Fspan>\n        <span style=\"font-size:13.5px;color:#39393B;padding-left:16px;border-left:1px solid #CACACB\">Scenario Builder<\u002Fspan>\n        <span style=\"font-size:13.5px;color:#39393B;padding-left:16px;border-left:1px solid #CACACB\">Scenario Comparison<\u002Fspan>\n        <span style=\"font-size:13.5px;color:#39393B;padding-left:16px;border-left:1px solid #CACACB\">Decision History<\u002Fspan>\n        <span style=\"font-size:13.5px;color:#39393B;padding-left:16px;border-left:1px solid #CACACB\">Audit / Activity<\u002Fspan>\n      <\u002Fdiv>\n      <p style=\"margin:16px 0 0;font-size:12px;line-height:1.5;color:#6B6B6D;text-wrap:pretty\">Existing FINOS navigation terminology — no new categories were invented for the case study.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <p style=\"margin:0 0 24px;font-size:11px;font-weight:600;letter-spacing:.14em;color:#6B6B6D\">WHY THIS ARCHITECTURE<\u002Fp>\n  <div style=\"display:grid;grid-template-columns:{{ triGrid }};gap:16px;margin-bottom:32px\">\n    <div style=\"border-top:2px solid #111111;padding-top:16px\">\n      <span style=\"font-family:'Bebas Neue',sans-serif;font-size:26px;line-height:1;color:#CACACB\">01<\u002Fspan>\n      <p style=\"margin:8px 0 0;font-size:14.5px;font-weight:700;line-height:1.35;color:#111111;text-wrap:pretty\">Context should be available before decision-making.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"border-top:2px solid #111111;padding-top:16px\">\n      <span style=\"font-family:'Bebas Neue',sans-serif;font-size:26px;line-height:1;color:#CACACB\">02<\u002Fspan>\n      <p style=\"margin:8px 0 0;font-size:14.5px;font-weight:700;line-height:1.35;color:#111111;text-wrap:pretty\">Decisions should be separated from general information.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"border-top:2px solid #111111;padding-top:16px\">\n      <span style=\"font-family:'Bebas Neue',sans-serif;font-size:26px;line-height:1;color:#CACACB\">03<\u002Fspan>\n      <p style=\"margin:8px 0 0;font-size:14.5px;font-weight:700;line-height:1.35;color:#111111;text-wrap:pretty\">Consequential actions should have explicit control and traceability.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <p style=\"margin:0;border-left:3px solid #111111;padding-left:16px;font-size:{{ leadSize }};line-height:1.5;color:#111111;max-width:70ch;text-wrap:pretty\">This separation allowed FINOS to remain a broad financial operating system while giving consequential decisions their own deliberate experience.<\u002Fp>\n<\u002Fsection>\n\n<div style='max-width:1240px;margin:0 auto;padding:0 24px 96px'><p style='margin:0 0 18px;font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#111'>Where the decision journey begins<\u002Fp><figure style='margin:0'><div style='border-radius:20px;overflow:hidden;box-shadow:0 50px 110px -48px rgba(17,17,17,.5);background:#0b0b0c'><img src='assets/img/finos/mock-scenario.jpg' alt='FINOS Scenario Builder exploring a property purchase — assumptions on the left, forecast and compared approaches on the right' loading='lazy' style='display:block;width:100%;height:auto'/><\u002Fdiv><figcaption style='margin-top:14px;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#6B6B6D'>Mockup 03 — Scenario Builder · assumptions in, consequences out<\u002Ffigcaption><\u002Ffigure><\u002Fdiv>\n\n<!-- ============ 10 HERO DECISION JOURNEY ============ -->\n<div style='max-width:1240px;margin:0 auto;padding:0 24px 96px'><p style='margin:0 0 18px;font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#111'>From the prototype — the architecture in practice<\u002Fp><div style='display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:28px'><figure style='margin:0'><div style='border:1px solid rgba(17,17,17,.14);border-radius:14px;overflow:hidden;box-shadow:0 30px 70px -38px rgba(17,17,17,.35);background:#fff'><img src='assets/img/finos/cashflow.jpg' alt='FINOS Cash Flow view with income, outflow and monthly surplus' loading='lazy' style='display:block;width:100%;height:auto'/><\u002Fdiv><figcaption style='margin-top:12px;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#6B6B6D'>Fig 02 — Cash Flow · understanding the position<\u002Ffigcaption><\u002Ffigure><figure style='margin:0'><div style='border:1px solid rgba(17,17,17,.14);border-radius:14px;overflow:hidden;box-shadow:0 30px 70px -38px rgba(17,17,17,.35);background:#fff'><img src='assets/img/finos/forecasts.jpg' alt='FINOS Forecasts view modelling possible financial futures' loading='lazy' style='display:block;width:100%;height:auto'/><\u002Fdiv><figcaption style='margin-top:12px;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#6B6B6D'>Fig 03 — Forecasts · modelling possible futures<\u002Ffigcaption><\u002Ffigure><\u002Fdiv><\u002Fdiv><section id=\"ch10\" data-screen-label=\"10 Journey\" style=\"background:#F5F5F5;padding:{{ secPad }}\">\n  <div style=\"max-width:1240px;margin:0 auto\">\n    <p style=\"margin:0 0 24px;font-size:11px;font-weight:600;letter-spacing:.14em;color:#6B6B6D\">10 — HERO DECISION JOURNEY<\u002Fp>\n    <h2 style=\"margin:0 0 48px;font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:{{ h2Size }};line-height:.94;letter-spacing:.005em;text-transform:uppercase;max-width:20ch;text-wrap:pretty\">One decision became the test case for the entire system.<\u002Fh2>\n\n    <p data-reveal=\"1\" style=\"margin:0 0 40px;font-family:'Bebas Neue',sans-serif;font-size:{{ questionSize }};line-height:.92;letter-spacing:.005em;text-transform:uppercase;color:#111111;max-width:22ch;text-wrap:pretty\">Can I purchase a R1.5M property without compromising my financial goals?<\u002Fp>\n\n    <div style=\"display:grid;grid-template-columns:{{ twoCol }};gap:{{ probGap }};margin-bottom:64px;align-items:start\">\n      <div style=\"border:1px solid #111111;border-radius:14px;padding:{{ diagramPad }};background:#FFFFFF\">\n        <p style=\"margin:0 0 12px;font-size:10.5px;font-weight:600;letter-spacing:.1em;color:#6B6B6D\">THE DECISION<\u002Fp>\n        <p style=\"margin:0 0 8px;font-size:15px;font-weight:700;color:#111111\">Property purchase<\u002Fp>\n        <p style=\"margin:0 0 24px;font-family:'Bebas Neue',sans-serif;font-size:52px;line-height:.9;font-variant-numeric:tabular-nums;color:#111111\">R1,500,000<\u002Fp>\n        <div style=\"display:flex;flex-direction:column;gap:8px;font-size:13px\">\n          <div style=\"display:flex;gap:16px;border-top:1px solid #EFEFEF;padding-top:8px\"><span style=\"flex:1 1 auto;color:#39393B\">Property price<\u002Fspan><span style=\"font-weight:600;font-variant-numeric:tabular-nums\">R1,500,000<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;gap:16px;border-top:1px solid #EFEFEF;padding-top:8px\"><span style=\"flex:1 1 auto;color:#39393B\">Down payment<\u002Fspan><span style=\"font-weight:600;font-variant-numeric:tabular-nums\">R300,000<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;gap:16px;border-top:1px solid #EFEFEF;padding-top:8px\"><span style=\"flex:1 1 auto;color:#39393B\">Loan<\u002Fspan><span style=\"font-weight:600;font-variant-numeric:tabular-nums\">R1,200,000<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;gap:16px;border-top:1px solid #EFEFEF;padding-top:8px\"><span style=\"flex:1 1 auto;color:#39393B\">Term<\u002Fspan><span style=\"font-weight:600;font-variant-numeric:tabular-nums\">20 years<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;gap:16px;border-top:1px solid #EFEFEF;padding-top:8px\"><span style=\"flex:1 1 auto;color:#39393B\">Emergency reserve<\u002Fspan><span style=\"font-weight:600;font-variant-numeric:tabular-nums\">6 months<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;gap:16px;border-top:1px solid #EFEFEF;padding-top:8px\"><span style=\"flex:1 1 auto;color:#39393B\">Salary income<\u002Fspan><span style=\"font-weight:600;font-variant-numeric:tabular-nums\">R45,000 / month<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <p style=\"margin:0 0 16px;font-size:11px;font-weight:600;letter-spacing:.14em;color:#6B6B6D\">WHY THIS IS CONSEQUENTIAL<\u002Fp>\n        <div style=\"display:flex;flex-direction:column;gap:12px\">\n          <p style=\"margin:0;font-size:14.5px;line-height:1.5;color:#111111;border-top:1px solid #CACACB;padding-top:12px;text-wrap:pretty\">A significant capital commitment — the deposit leaves the portfolio permanently.<\u002Fp>\n          <p style=\"margin:0;font-size:14.5px;line-height:1.5;color:#111111;border-top:1px solid #CACACB;padding-top:12px;text-wrap:pretty\">Long-term debt held for two decades.<\u002Fp>\n          <p style=\"margin:0;font-size:14.5px;line-height:1.5;color:#111111;border-top:1px solid #CACACB;padding-top:12px;text-wrap:pretty\">Liquidity impact — cash cover falls immediately after transfer costs.<\u002Fp>\n          <p style=\"margin:0;font-size:14.5px;line-height:1.5;color:#111111;border-top:1px solid #CACACB;padding-top:12px;text-wrap:pretty\">Opportunity cost — return given up by de-investing.<\u002Fp>\n          <p style=\"margin:0;font-size:14.5px;line-height:1.5;color:#111111;border-top:1px solid #CACACB;padding-top:12px;text-wrap:pretty\">Effect on financial goals the portfolio was funding.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <p style=\"margin:0 0 24px;font-size:11px;font-weight:600;letter-spacing:.14em;color:#6B6B6D\">THE JOURNEY<\u002Fp>\n    <div style=\"display:grid;grid-template-columns:{{ journeyGrid }};gap:16px;margin-bottom:64px\">\n      <sc-for list=\"{{ journey }}\" as=\"j\" hint-placeholder-count=\"8\">\n        <div style=\"border-top:2px solid #111111;padding-top:16px;background:transparent\">\n          <span style=\"font-family:'Bebas Neue',sans-serif;font-size:26px;line-height:1;color:#CACACB\">{{ j.n }}<\u002Fspan>\n          <p style=\"margin:8px 0 6px;font-family:'Bebas Neue',sans-serif;font-size:26px;line-height:1;text-transform:uppercase;color:#111111\">{{ j.label }}<\u002Fp>\n          <p style=\"margin:0;font-size:12.5px;line-height:1.45;color:#39393B;text-wrap:pretty\">{{ j.desc }}<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- journey steps -->\n<section aria-label=\"Decision journey, step by step\" style=\"max-width:1240px;margin:0 auto;padding:{{ secPad }}\">\n\n  <!-- 01 UNDERSTAND -->\n  <div data-reveal=\"1\" style=\"border-top:2px solid #111111;padding-top:24px;margin-bottom:64px;display:grid;grid-template-columns:{{ stepGrid }};gap:{{ probGap }};align-items:start\">\n    <div>\n      <p style=\"margin:0 0 12px;font-size:11px;font-weight:600;letter-spacing:.14em;color:#6B6B6D\">STEP 01 — UNDERSTAND<\u002Fp>\n      <h3 style=\"margin:0 0 16px;font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:{{ h3Size }};line-height:1;text-transform:uppercase\">Establish the position first.<\u002Fh3>\n      <p style=\"margin:0 0 24px;font-size:14.5px;line-height:1.55;color:#39393B;text-wrap:pretty\">Before recommending an action, FINOS establishes the user's current financial position — income, cash flow, existing obligations, liquidity, goals and risk context.<\u002Fp>\n      <p style=\"margin:0;display:inline-flex;font-size:12px;font-weight:600;letter-spacing:.06em;color:#FFFFFF;background:#111111;border-radius:999px;padding:8px 16px\">ANNOTATION · CONTEXT BEFORE RECOMMENDATION<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"border:1px solid #CACACB;border-radius:14px;overflow:hidden;background:#FFFFFF\">\n      <div style=\"border-bottom:1px solid #E5E5E5;padding:12px 20px;display:flex;justify-content:space-between;gap:16px\">\n        <span style=\"font-size:{{ frameHead }};font-weight:600;letter-spacing:.08em;color:#6B6B6D\">FINANCIAL POSITION · AUGUST 2026<\u002Fspan>\n        <span style=\"font-size:{{ frameHead }};color:#9E9EA0\">Last synced 8 min ago<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:{{ twoCol }}\">\n        <div style=\"padding:20px;border-right:1px solid #EFEFEF;border-bottom:1px solid #EFEFEF\">\n          <p style=\"margin:0 0 6px;font-size:12.5px;color:#39393B\">Net Worth<\u002Fp>\n          <p style=\"margin:0;font-family:'Bebas Neue',sans-serif;font-size:34px;line-height:1;font-variant-numeric:tabular-nums\">R2,840,420<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"padding:20px;border-bottom:1px solid #EFEFEF\">\n          <p style=\"margin:0 0 6px;font-size:12.5px;color:#39393B\">Liquid Assets<\u002Fp>\n          <p style=\"margin:0;font-family:'Bebas Neue',sans-serif;font-size:34px;line-height:1;font-variant-numeric:tabular-nums\">R420,300<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"padding:20px;border-right:1px solid #EFEFEF\">\n          <p style=\"margin:0 0 6px;font-size:12.5px;color:#39393B\">Investments<\u002Fp>\n          <p style=\"margin:0;font-family:'Bebas Neue',sans-serif;font-size:34px;line-height:1;font-variant-numeric:tabular-nums\">R1,940,200<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"padding:20px\">\n          <p style=\"margin:0 0 6px;font-size:12.5px;color:#39393B\">Debt<\u002Fp>\n          <p style=\"margin:0;font-family:'Bebas Neue',sans-serif;font-size:34px;line-height:1;font-variant-numeric:tabular-nums\">R310,400<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border-top:1px solid #E5E5E5;padding:16px 20px;display:flex;flex-direction:column;gap:8px;font-size:13px\">\n        <div style=\"display:flex;gap:16px\"><span style=\"flex:1 1 auto;color:#39393B\">Total inflows, this month<\u002Fspan><span style=\"font-weight:600;font-variant-numeric:tabular-nums\">R78,500<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;gap:16px\"><span style=\"flex:1 1 auto;color:#39393B\">Committed outflows, before this decision<\u002Fspan><span style=\"font-weight:600;font-variant-numeric:tabular-nums\">R60,100<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;gap:16px\"><span style=\"flex:1 1 auto;color:#39393B\">Rent that a purchase would replace<\u002Fspan><span style=\"font-weight:600;font-variant-numeric:tabular-nums\">R9,800<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- 02 MODEL -->\n  <div data-reveal=\"1\" style=\"border-top:2px solid #111111;padding-top:24px;margin-bottom:64px;display:grid;grid-template-columns:{{ stepGrid }};gap:{{ probGap }};align-items:start\">\n    <div>\n      <p style=\"margin:0 0 12px;font-size:11px;font-weight:600;letter-spacing:.14em;color:#6B6B6D\">STEP 02 — MODEL<\u002Fp>\n      <h3 style=\"margin:0 0 16px;font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:{{ h3Size }};line-height:1;text-transform:uppercase\">Turn the question into a model.<\u002Fh3>\n      <p style=\"margin:0 0 24px;font-size:14.5px;line-height:1.55;color:#39393B;text-wrap:pretty\">Instead of asking FINOS for a binary yes or no, the user turns the question into an explicit scenario. Every output below is calculated from these six inputs.<\u002Fp>\n      <p style=\"margin:0;display:inline-flex;font-size:12px;font-weight:600;letter-spacing:.06em;color:#FFFFFF;background:#111111;border-radius:999px;padding:8px 16px\">ANNOTATION · A VAGUE QUESTION BECOMES AN EXPLICIT DECISION MODEL<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"border:1px solid #CACACB;border-radius:14px;overflow:hidden;background:#FFFFFF\">\n      <div style=\"border-bottom:1px solid #E5E5E5;padding:12px 20px;font-size:{{ frameHead }};font-weight:600;letter-spacing:.08em;color:#6B6B6D\">SCENARIO BUILDER · PROPERTY PURCHASE<\u002Fdiv>\n      <div style=\"padding:20px;display:flex;flex-direction:column;gap:8px;font-size:13px;border-bottom:1px solid #E5E5E5\">\n        <div style=\"display:flex;gap:16px\"><span style=\"flex:1 1 auto;color:#39393B\">Property price<\u002Fspan><span style=\"font-weight:600;font-variant-numeric:tabular-nums\">R1,500,000<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;gap:16px\"><span style=\"flex:1 1 auto;color:#39393B\">Down payment<\u002Fspan><span style=\"font-weight:600;font-variant-numeric:tabular-nums\">R300,000<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;gap:16px\"><span style=\"flex:1 1 auto;color:#39393B\">Rate assumption<\u002Fspan><span style=\"font-weight:600;font-variant-numeric:tabular-nums\">10.75%<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;gap:16px\"><span style=\"flex:1 1 auto;color:#39393B\">Term<\u002Fspan><span style=\"font-weight:600;font-variant-numeric:tabular-nums\">20 years<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;gap:16px\"><span style=\"flex:1 1 auto;color:#39393B\">Monthly running costs<\u002Fspan><span style=\"font-weight:600;font-variant-numeric:tabular-nums\">R4,800<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;gap:16px\"><span style=\"flex:1 1 auto;color:#39393B\">Reserve target for this decision<\u002Fspan><span style=\"font-weight:600;font-variant-numeric:tabular-nums\">6.0 months<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding:20px;background:#FAFAFA;display:flex;flex-direction:column;gap:8px;font-size:13px\">\n        <div style=\"display:flex;gap:16px\"><span style=\"flex:1 1 auto;color:#39393B\">Loan required<\u002Fspan><span style=\"font-weight:600;font-variant-numeric:tabular-nums\">R1,200,000<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;gap:16px\"><span style=\"flex:1 1 auto;color:#39393B\">Estimated monthly payment<\u002Fspan><span style=\"font-weight:600;font-variant-numeric:tabular-nums\">R12,183<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;gap:16px\"><span style=\"flex:1 1 auto;color:#39393B\">Transfer costs<\u002Fspan><span style=\"font-weight:600;font-variant-numeric:tabular-nums\">R52,500<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;gap:16px\"><span style=\"flex:1 1 auto;color:#39393B\">Cash after transfer costs<\u002Fspan><span style=\"font-weight:600;font-variant-numeric:tabular-nums\">R367,800<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;gap:16px\"><span style=\"flex:1 1 auto;color:#39393B\">Projected monthly surplus<\u002Fspan><span style=\"font-weight:600;font-variant-numeric:tabular-nums\">R11,217<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;gap:16px;border-top:1px solid #E5E5E5;padding-top:8px\"><span style=\"flex:1 1 auto;color:#39393B\">Cash cover<\u002Fspan><span style=\"font-weight:600;font-variant-numeric:tabular-nums\">5.5 months · moderate liquidity position<\u002Fspan><\u002Fdiv>\n        <p style=\"margin:6px 0 0;font-size:11.5px;color:#6B6B6D;text-wrap:pretty\">Illustrative estimate based on current assumptions · simulated demo data.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- 03 COMPARE -->\n  <div data-reveal=\"1\" style=\"border-top:2px solid #111111;padding-top:24px;margin-bottom:64px\">\n    <div style=\"display:grid;grid-template-columns:{{ twoCol }};gap:48px;margin-bottom:24px;align-items:start\">\n      <div>\n        <p style=\"margin:0 0 12px;font-size:11px;font-weight:600;letter-spacing:.14em;color:#6B6B6D\">STEP 03 — COMPARE<\u002Fp>\n        <h3 style=\"margin:0;font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:{{ h3Size }};line-height:1;text-transform:uppercase\">Three strategies, one property.<\u002Fh3>\n      <\u002Fdiv>\n      <div>\n        <p style=\"margin:0 0 16px;font-size:14.5px;line-height:1.55;color:#39393B;text-wrap:pretty\">All three strategies buy the same R1,500,000 property. What changes is the deposit — and therefore the loan, the payment, the borrowing ratio and how much cash is left standing behind it.<\u002Fp>\n        <p style=\"margin:0;display:inline-flex;font-size:12px;font-weight:600;letter-spacing:.06em;color:#FFFFFF;background:#111111;border-radius:999px;padding:8px 16px\">ANNOTATION · TRADE-OFFS MOVE TOGETHER, SO THEY ARE SHOWN TOGETHER<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"border:1px solid #CACACB;border-radius:14px;overflow:hidden;background:#FFFFFF\">\n      <div style=\"border-bottom:1px solid #E5E5E5;padding:12px 20px;font-size:{{ frameHead }};font-weight:600;letter-spacing:.08em;color:#6B6B6D\">SCENARIO COMPARISON · R1,500,000 PROPERTY<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:{{ triGrid }}\">\n        <div style=\"padding:20px;border-right:1px solid #EFEFEF\">\n          <p style=\"margin:0 0 12px;font-family:'Bebas Neue',sans-serif;font-size:26px;line-height:1;text-transform:uppercase\">Conservative<\u002Fp>\n          <div style=\"display:flex;flex-direction:column;gap:8px;font-size:12.5px\">\n            <div style=\"display:flex;gap:12px\"><span style=\"flex:1 1 auto;color:#39393B\">Deposit<\u002Fspan><span style=\"font-weight:600;font-variant-numeric:tabular-nums\">R360,000<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;gap:12px\"><span style=\"flex:1 1 auto;color:#39393B\">Loan<\u002Fspan><span style=\"font-weight:600;font-variant-numeric:tabular-nums\">R1,140,000<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;gap:12px\"><span style=\"flex:1 1 auto;color:#39393B\">Monthly payment<\u002Fspan><span style=\"font-weight:600;font-variant-numeric:tabular-nums\">R11,574<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;gap:12px\"><span style=\"flex:1 1 auto;color:#39393B\">Borrowed share<\u002Fspan><span style=\"font-weight:600;font-variant-numeric:tabular-nums\">76%<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;gap:12px\"><span style=\"flex:1 1 auto;color:#39393B\">Cash cover<\u002Fspan><span style=\"font-weight:600;font-variant-numeric:tabular-nums\">5.5 months<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;gap:12px\"><span style=\"flex:1 1 auto;color:#39393B\">Surplus<\u002Fspan><span style=\"font-weight:600;font-variant-numeric:tabular-nums\">R11,826<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;gap:12px;border-top:1px solid #EFEFEF;padding-top:8px\"><span style=\"flex:1 1 auto;color:#39393B\">Position<\u002Fspan><span style=\"font-weight:600;color:#007D48\">Strong<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:20px;border-right:1px solid #EFEFEF;background:#111111;color:#FFFFFF\">\n          <p style=\"margin:0 0 4px;font-size:10px;font-weight:600;letter-spacing:.1em;color:#9E9EA0\">RECOMMENDED<\u002Fp>\n          <p style=\"margin:0 0 12px;font-family:'Bebas Neue',sans-serif;font-size:26px;line-height:1;text-transform:uppercase;color:#FFFFFF\">Balanced<\u002Fp>\n          <div style=\"display:flex;flex-direction:column;gap:8px;font-size:12.5px\">\n            <div style=\"display:flex;gap:12px\"><span style=\"flex:1 1 auto;color:#9E9EA0\">Deposit<\u002Fspan><span style=\"font-weight:600;font-variant-numeric:tabular-nums\">R300,000<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;gap:12px\"><span style=\"flex:1 1 auto;color:#9E9EA0\">Loan<\u002Fspan><span style=\"font-weight:600;font-variant-numeric:tabular-nums\">R1,200,000<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;gap:12px\"><span style=\"flex:1 1 auto;color:#9E9EA0\">Monthly payment<\u002Fspan><span style=\"font-weight:600;font-variant-numeric:tabular-nums\">R12,183<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;gap:12px\"><span style=\"flex:1 1 auto;color:#9E9EA0\">Borrowed share<\u002Fspan><span style=\"font-weight:600;font-variant-numeric:tabular-nums\">80%<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;gap:12px\"><span style=\"flex:1 1 auto;color:#9E9EA0\">Cash cover<\u002Fspan><span style=\"font-weight:600;font-variant-numeric:tabular-nums\">5.5 months<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;gap:12px\"><span style=\"flex:1 1 auto;color:#9E9EA0\">Surplus<\u002Fspan><span style=\"font-weight:600;font-variant-numeric:tabular-nums\">R11,217<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;gap:12px;border-top:1px solid #2B2B2B;padding-top:8px\"><span style=\"flex:1 1 auto;color:#9E9EA0\">Position<\u002Fspan><span style=\"font-weight:600;color:#FFFFFF\">Moderate<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:20px\">\n          <p style=\"margin:0 0 12px;font-family:'Bebas Neue',sans-serif;font-size:26px;line-height:1;text-transform:uppercase\">Aggressive<\u002Fp>\n          <div style=\"display:flex;flex-direction:column;gap:8px;font-size:12.5px\">\n            <div style=\"display:flex;gap:12px\"><span style=\"flex:1 1 auto;color:#39393B\">Deposit<\u002Fspan><span style=\"font-weight:600;font-variant-numeric:tabular-nums\">R240,000<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;gap:12px\"><span style=\"flex:1 1 auto;color:#39393B\">Loan<\u002Fspan><span style=\"font-weight:600;font-variant-numeric:tabular-nums\">R1,260,000<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;gap:12px\"><span style=\"flex:1 1 auto;color:#39393B\">Monthly payment<\u002Fspan><span style=\"font-weight:600;font-variant-numeric:tabular-nums\">R12,792<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;gap:12px\"><span style=\"flex:1 1 auto;color:#39393B\">Borrowed share<\u002Fspan><span style=\"font-weight:600;font-variant-numeric:tabular-nums\">84%<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;gap:12px\"><span style=\"flex:1 1 auto;color:#39393B\">Cash cover<\u002Fspan><span style=\"font-weight:600;font-variant-numeric:tabular-nums\">5.4 months<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;gap:12px\"><span style=\"flex:1 1 auto;color:#39393B\">Surplus<\u002Fspan><span style=\"font-weight:600;font-variant-numeric:tabular-nums\">R10,608<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;gap:12px;border-top:1px solid #EFEFEF;padding-top:8px\"><span style=\"flex:1 1 auto;color:#39393B\">Position<\u002Fspan><span style=\"font-weight:600;color:#D30005\">Elevated<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border-top:1px solid #E5E5E5;padding:16px 20px;font-size:12px;color:#6B6B6D;text-wrap:pretty\">Aggressive borrows 84% of the value, above the 80% workspace borrowing ceiling. Goal impact: the deposit is funded from the portfolio, so the larger the deposit, the less remains invested.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- 04 EVALUATE -->\n  <div data-reveal=\"1\" style=\"border-top:2px solid #111111;padding-top:24px;margin-bottom:64px;display:grid;grid-template-columns:{{ stepGrid }};gap:{{ probGap }};align-items:start\">\n    <div>\n      <p style=\"margin:0 0 12px;font-size:11px;font-weight:600;letter-spacing:.14em;color:#6B6B6D\">STEP 04 — EVALUATE<\u002Fp>\n      <h3 style=\"margin:0 0 16px;font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:{{ h3Size }};line-height:1;text-transform:uppercase\">An argument, not an answer.<\u002Fh3>\n      <p style=\"margin:0 0 24px;font-size:14.5px;line-height:1.55;color:#39393B;text-wrap:pretty\">The recommendation is presented as an argument that can be inspected, rather than an answer that must simply be accepted. Note that FINOS states its own weakness: the recommended option is short of the reserve target the user set.<\u002Fp>\n      <p style=\"margin:0;display:inline-flex;font-size:12px;font-weight:600;letter-spacing:.06em;color:#FFFFFF;background:#111111;border-radius:999px;padding:8px 16px\">ANNOTATION · SEPARATES THE RECOMMENDATION FROM ITS RATIONALE<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"border:1px solid #111111;border-radius:14px;overflow:hidden;background:#FFFFFF\">\n      <div style=\"background:#111111;color:#FFFFFF;padding:20px\">\n        <p style=\"margin:0 0 4px;font-size:10px;font-weight:600;letter-spacing:.1em;color:#9E9EA0\">FINOS RECOMMENDS<\u002Fp>\n        <p style=\"margin:0 0 8px;font-family:'Bebas Neue',sans-serif;font-size:40px;line-height:.95;text-transform:uppercase;color:#FFFFFF\">Balanced approach<\u002Fp>\n        <span style=\"font-size:11px;font-weight:600;letter-spacing:.06em;color:#111111;background:#FFFFFF;border-radius:999px;padding:5px 12px\">MODERATE CONFIDENCE<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"padding:20px;display:flex;flex-direction:column;gap:16px\">\n        <div>\n          <p style=\"margin:0 0 8px;font-size:10.5px;font-weight:600;letter-spacing:.1em;color:#6B6B6D\">WHY · SUPPORTING FACTORS<\u002Fp>\n          <p style=\"margin:0 0 6px;font-size:13px;line-height:1.45;color:#111111;text-wrap:pretty\">Borrowing stays at 80% of the property value, within the 80% workspace borrowing ceiling.<\u002Fp>\n          <p style=\"margin:0;font-size:13px;line-height:1.45;color:#111111;text-wrap:pretty\">Monthly surplus remains positive at R11,217.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"border-top:1px solid #EFEFEF;padding-top:16px\">\n          <p style=\"margin:0 0 8px;font-size:10.5px;font-weight:600;letter-spacing:.1em;color:#6B6B6D\">RISKS<\u002Fp>\n          <p style=\"margin:0;font-size:13px;line-height:1.45;color:#111111;text-wrap:pretty\">Cash cover reaches 5.5 of the 6.0 months this decision asks you to hold — a R35,896 shortfall.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"border-top:1px solid #EFEFEF;padding-top:16px\">\n          <p style=\"margin:0 0 8px;font-size:10.5px;font-weight:600;letter-spacing:.1em;color:#6B6B6D\">ALTERNATIVES<\u002Fp>\n          <p style=\"margin:0;font-size:13px;line-height:1.45;color:#111111;text-wrap:pretty\">Conservative holds the strongest position at R11,574 a month. Aggressive breaks the borrowing ceiling at 84%.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"border-top:1px solid #EFEFEF;padding-top:16px\">\n          <p style=\"margin:0 0 8px;font-size:10.5px;font-weight:600;letter-spacing:.1em;color:#6B6B6D\">ASSUMPTIONS · BASIS<\u002Fp>\n          <p style=\"margin:0;font-size:13px;line-height:1.45;color:#39393B;text-wrap:pretty\">Current financial position plus the assumptions in this scenario — a 10.75% rate, a 20-year term, a deposit funded from the portfolio and a 6.0-month reserve target.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- 05 CHALLENGE -->\n  <div data-reveal=\"1\" style=\"border-top:2px solid #111111;padding-top:24px;margin-bottom:64px;display:grid;grid-template-columns:{{ stepGrid }};gap:{{ probGap }};align-items:start\">\n    <div>\n      <p style=\"margin:0 0 12px;font-size:11px;font-weight:600;letter-spacing:.14em;color:#6B6B6D\">STEP 05 — CHALLENGE<\u002Fp>\n      <h3 style=\"margin:0 0 16px;font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:{{ h3Size }};line-height:1;text-transform:uppercase\">Disagree with the assumption, not the system.<\u002Fh3>\n      <p style=\"margin:0 0 24px;font-size:14.5px;line-height:1.55;color:#39393B;text-wrap:pretty\">Instead of accepting or rejecting the recommendation, the user challenges what it rests on. The reserve target is the user's own policy — so it is the user's to change.<\u002Fp>\n      <p style=\"margin:0;display:inline-flex;font-size:12px;font-weight:600;letter-spacing:.06em;color:#FFFFFF;background:#111111;border-radius:999px;padding:8px 16px\">ANNOTATION · CHALLENGE IS A FIRST-CLASS ACTION, NOT AN ESCAPE HATCH<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"border:1px solid #CACACB;border-radius:14px;overflow:hidden;background:#FFFFFF\">\n      <div style=\"border-bottom:1px solid #E5E5E5;padding:12px 20px;font-size:{{ frameHead }};font-weight:600;letter-spacing:.08em;color:#6B6B6D\">CHALLENGE RECOMMENDATION<\u002Fdiv>\n      <div style=\"padding:20px;display:flex;flex-direction:column;gap:16px\">\n        <p style=\"margin:0;font-size:13.5px;color:#111111\">What do you think FINOS has wrong?<\u002Fp>\n        <div style=\"display:flex;flex-direction:column;gap:8px\">\n          <span style=\"font-size:13px;color:#39393B;border:1px solid #E5E5E5;border-radius:999px;padding:10px 16px\">I expect my income to rise<\u002Fspan>\n          <span style=\"font-size:13px;font-weight:600;color:#FFFFFF;background:#111111;border-radius:999px;padding:10px 16px\">I want a deeper cash reserve<\u002Fspan>\n          <span style=\"font-size:13px;color:#39393B;border:1px solid #E5E5E5;border-radius:999px;padding:10px 16px\">I think rates will fall<\u002Fspan>\n          <span style=\"font-size:13px;color:#39393B;border:1px solid #E5E5E5;border-radius:999px;padding:10px 16px\">I would pay more for the right property<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"border-top:1px solid #EFEFEF;padding-top:16px;display:flex;flex-direction:column;gap:8px;font-size:13px\">\n          <div style=\"display:flex;gap:16px\"><span style=\"flex:1 1 auto;color:#39393B\">Current assumption<\u002Fspan><span style=\"font-weight:600;font-variant-numeric:tabular-nums\">6.0 months<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;gap:16px\"><span style=\"flex:1 1 auto;color:#39393B\">Changed to<\u002Fspan><span style=\"font-weight:600;font-variant-numeric:tabular-nums\">9.0 months of outflow<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <span style=\"align-self:flex-start;font-size:13px;font-weight:600;color:#FFFFFF;background:#111111;border-radius:999px;padding:10px 20px\">Recalculate<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- 06 RECALCULATE -->\n  <div data-reveal=\"1\" style=\"border-top:2px solid #111111;padding-top:24px;margin-bottom:64px\">\n    <div style=\"display:grid;grid-template-columns:{{ twoCol }};gap:48px;margin-bottom:24px;align-items:start\">\n      <div>\n        <p style=\"margin:0 0 12px;font-size:11px;font-weight:600;letter-spacing:.14em;color:#6B6B6D\">STEP 06 — RECALCULATE<\u002Fp>\n        <h3 style=\"margin:0;font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:{{ h3Size }};line-height:1;text-transform:uppercase\">The recommendation changes.<\u002Fh3>\n      <\u002Fdiv>\n      <div>\n        <p style=\"margin:0 0 16px;font-size:14.5px;line-height:1.55;color:#39393B;text-wrap:pretty\">The purpose is not to prove the original recommendation wrong. It is to let the user see how changing their priorities changes the decision — here, a deeper reserve makes every option fall short of the target, and FINOS says so rather than hiding it.<\u002Fp>\n        <p style=\"margin:0;display:inline-flex;font-size:12px;font-weight:600;letter-spacing:.06em;color:#FFFFFF;background:#111111;border-radius:999px;padding:8px 16px\">ANNOTATION · THE SAME ENGINE RE-RUNS, SO THE ANSWER CAN MOVE AGAINST FINOS<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"border:1px solid #CACACB;border-radius:14px;overflow:hidden;background:#FFFFFF\">\n      <div style=\"display:grid;grid-template-columns:{{ triGrid }};gap:8px;border-bottom:1px solid #E5E5E5;padding:12px 20px\">\n        <span aria-hidden=\"true\"><\u002Fspan>\n        <span style=\"font-size:{{ frameHead }};font-weight:600;letter-spacing:.08em;color:#6B6B6D\">BEFORE · 6-MONTH RESERVE<\u002Fspan>\n        <span style=\"font-size:{{ frameHead }};font-weight:600;letter-spacing:.08em;color:#111111\">AFTER · 9-MONTH RESERVE<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"padding:20px;display:flex;flex-direction:column;gap:12px;font-size:13px\">\n        <div style=\"display:grid;grid-template-columns:{{ triGrid }};gap:8px;border-bottom:1px solid #EFEFEF;padding-bottom:12px\">\n          <span style=\"color:#39393B\">Reserve target<\u002Fspan><span style=\"font-weight:600;font-variant-numeric:tabular-nums\">6.0 months<\u002Fspan><span style=\"font-weight:600;font-variant-numeric:tabular-nums\">9.0 months<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:{{ triGrid }};gap:8px;border-bottom:1px solid #EFEFEF;padding-bottom:12px\">\n          <span style=\"color:#39393B\">Cash after transfer costs<\u002Fspan><span style=\"font-weight:600;font-variant-numeric:tabular-nums\">R367,800<\u002Fspan><span style=\"font-weight:600;font-variant-numeric:tabular-nums\">R367,800<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:{{ triGrid }};gap:8px;border-bottom:1px solid #EFEFEF;padding-bottom:12px\">\n          <span style=\"color:#39393B\">Held back as reserve<\u002Fspan><span style=\"font-weight:600;font-variant-numeric:tabular-nums\">R403,696<\u002Fspan><span style=\"font-weight:600;font-variant-numeric:tabular-nums\">R605,545<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:{{ triGrid }};gap:8px;border-bottom:1px solid #EFEFEF;padding-bottom:12px\">\n          <span style=\"color:#39393B\">Short of that target<\u002Fspan><span style=\"font-weight:600;font-variant-numeric:tabular-nums\">R35,896<\u002Fspan><span style=\"font-weight:600;font-variant-numeric:tabular-nums\">R237,745<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:{{ triGrid }};gap:8px;border-bottom:1px solid #EFEFEF;padding-bottom:12px\">\n          <span style=\"color:#39393B\">Liquidity position<\u002Fspan><span style=\"font-weight:600\">Moderate<\u002Fspan><span style=\"font-weight:600;color:#D30005\">Elevated<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:{{ triGrid }};gap:8px\">\n          <span style=\"color:#39393B\">FINOS recommends<\u002Fspan><span style=\"font-weight:600\">Balanced approach<\u002Fspan><span style=\"font-weight:600\">Conservative approach<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border-top:1px solid #E5E5E5;padding:16px 20px;background:#FAFAFA;font-size:12.5px;line-height:1.5;color:#111111;text-wrap:pretty\">At a 9-month target no option clears the borrowing ceiling and the reserve target together — Conservative is the least exposed of the three, at R11,574 a month with a R232,262 shortfall against the deeper target.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- 07 APPROVE -->\n  <div data-reveal=\"1\" style=\"border-top:2px solid #111111;padding-top:24px;margin-bottom:64px;display:grid;grid-template-columns:{{ stepGrid }};gap:{{ probGap }};align-items:start\">\n    <div>\n      <p style=\"margin:0 0 12px;font-size:11px;font-weight:600;letter-spacing:.14em;color:#6B6B6D\">STEP 07 — APPROVE<\u002Fp>\n      <h3 style=\"margin:0 0 16px;font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:{{ h3Size }};line-height:1;text-transform:uppercase\">Approval is an act, not a side effect.<\u002Fh3>\n      <p style=\"margin:0 0 24px;font-size:14.5px;line-height:1.55;color:#39393B;text-wrap:pretty\">Approval is an explicit interaction rather than an invisible consequence of using the system. Everything being authorised is restated first, and the user has to acknowledge that it is their decision, not FINOS's.<\u002Fp>\n      <p style=\"margin:0;display:inline-flex;font-size:12px;font-weight:600;letter-spacing:.06em;color:#FFFFFF;background:#111111;border-radius:999px;padding:8px 16px\">ANNOTATION · NOTHING IS RECORDED THAT A NAMED PERSON DID NOT AUTHORISE<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"border:1px solid #111111;border-radius:14px;overflow:hidden;background:#FFFFFF\">\n      <div style=\"border-bottom:1px solid #E5E5E5;padding:12px 20px;font-size:{{ frameHead }};font-weight:600;letter-spacing:.08em;color:#6B6B6D\">REVIEW &amp; APPROVE<\u002Fdiv>\n      <div style=\"padding:20px;display:flex;flex-direction:column;gap:12px;font-size:13px\">\n        <div style=\"display:flex;gap:16px;border-bottom:1px solid #EFEFEF;padding-bottom:12px\"><span style=\"flex:1 1 auto;color:#39393B\">Decision<\u002Fspan><span style=\"font-weight:600;text-align:right\">Property purchase · R1,500,000<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;gap:16px;border-bottom:1px solid #EFEFEF;padding-bottom:12px\"><span style=\"flex:1 1 auto;color:#39393B\">Scenario<\u002Fspan><span style=\"font-weight:600;text-align:right\">Balanced · version 2<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;gap:16px;border-bottom:1px solid #EFEFEF;padding-bottom:12px\"><span style=\"flex:1 1 auto;color:#39393B\">Recommendation<\u002Fspan><span style=\"font-weight:600;text-align:right\">Balanced approach · moderate confidence<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;gap:16px;border-bottom:1px solid #EFEFEF;padding-bottom:12px\"><span style=\"flex:1 1 auto;color:#39393B\">Assumptions<\u002Fspan><span style=\"font-weight:600;text-align:right\">10.75% · 20 years · 6.0-month reserve<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;gap:16px;border-bottom:1px solid #EFEFEF;padding-bottom:12px\"><span style=\"flex:1 1 auto;color:#39393B\">Key trade-off<\u002Fspan><span style=\"font-weight:600;text-align:right\">R300,000 leaves the portfolio<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;gap:16px;border-bottom:1px solid #EFEFEF;padding-bottom:12px\"><span style=\"flex:1 1 auto;color:#39393B\">Risk carried<\u002Fspan><span style=\"font-weight:600;text-align:right\">R35,896 short of the reserve target<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;gap:16px\"><span style=\"flex:1 1 auto;color:#39393B\">Expected monthly impact<\u002Fspan><span style=\"font-weight:600;font-variant-numeric:tabular-nums\">R12,183<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border-top:1px solid #E5E5E5;padding:16px 20px;background:#FAFAFA\">\n        <p style=\"margin:0 0 16px;font-size:12.5px;line-height:1.5;color:#111111;text-wrap:pretty\">I understand this is my decision, based on assumptions I set, and that FINOS has recommended rather than authorised it.<\u002Fp>\n        <div style=\"display:flex;flex-wrap:wrap;gap:12px\">\n          <span style=\"font-size:13px;font-weight:600;color:#111111;border:1px solid #CACACB;border-radius:999px;padding:10px 20px\">Go back<\u002Fspan>\n          <span style=\"font-size:13px;font-weight:600;color:#FFFFFF;background:#111111;border-radius:999px;padding:10px 20px\">Approve decision<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- 08 AUDIT -->\n  <div data-reveal=\"1\" style=\"border-top:2px solid #111111;padding-top:24px;margin-bottom:64px;display:grid;grid-template-columns:{{ stepGrid }};gap:{{ probGap }};align-items:start\">\n    <div>\n      <p style=\"margin:0 0 12px;font-size:11px;font-weight:600;letter-spacing:.14em;color:#6B6B6D\">STEP 08 — AUDIT<\u002Fp>\n      <h3 style=\"margin:0 0 16px;font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:{{ h3Size }};line-height:1;text-transform:uppercase\">The reasoning survives the decision.<\u002Fh3>\n      <p style=\"margin:0 0 24px;font-size:14.5px;line-height:1.55;color:#39393B;text-wrap:pretty\">The decision does not disappear after approval. FINOS preserves the reasoning and the actions that led to it — including the moment the user disagreed and what that changed.<\u002Fp>\n      <p style=\"margin:0;display:inline-flex;font-size:12px;font-we
