document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"ebbf4476-d733-4aa7-b8cc-d4cf5ffdbcdb\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin=\"\">\n<style>/* latin-ext */\n@font-face {\n  font-family: 'Bebas Neue';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"cfcd0c6d-9fae-4226-87a3-99d70b11c7bf\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Bebas Neue';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"9a9fa3a9-2a00-4353-9c7e-ba764bf18563\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  html { scroll-behavior: smooth; }\n  body { margin: 0; background: #FFFFFF; color: #111111; font-family: -apple-system, \"Segoe UI\", \"Helvetica Neue\", Arial, sans-serif; -webkit-font-smoothing: antialiased; }\n  * { box-sizing: border-box; }\n  a { color: #111111; text-decoration: none; }\n  a:hover { color: #007D48; }\n  :focus-visible { outline: 2px solid #007D48; outline-offset: 3px; }\n  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div ref=\"{{ rootRef }}\" style=\"position:relative;background:#FFFFFF\">\n\n<nav aria-label=\"Case study chapters\" style=\"{{ railStyle }}\">\n  <div style=\"font-family:'Bebas Neue',sans-serif;font-size:19px;letter-spacing:.22em;color:#111111;margin-bottom:24px\">FINOS<\u002Fdiv>\n  <ol style=\"list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px\">\n    <sc-for list=\"{{ chapters }}\" as=\"ch\" hint-placeholder-count=\"9\">\n      <li>\n        <a href=\"{{ ch.href }}\" aria-current=\"{{ ch.current }}\" style=\"display:flex;gap:10px;align-items:baseline;font-size:12px;color:{{ ch.tone }};font-weight:{{ ch.weight }}\">\n          <span style=\"font-variant-numeric:tabular-nums;letter-spacing:.04em\">{{ ch.n }}<\u002Fspan>\n          <span>{{ ch.label }}<\u002Fspan>\n          <span style=\"font-size:9.5px;letter-spacing:.08em;color:#9E9EA0\">{{ ch.state }}<\u002Fspan>\n        <\u002Fa>\n      <\u002Fli>\n    <\u002Fsc-for>\n  <\u002Fol>\n<\u002Fnav>\n\n<div aria-hidden=\"true\" style=\"position:fixed;top:0;left:0;right:0;height:2px;background:#EFEFEF;z-index:60\">\n  <div ref=\"{{ barRef }}\" style=\"height:2px;width:0%;background:#111111\"><\u002Fdiv>\n<\u002Fdiv>\n\n<main style=\"{{ mainStyle }}\">\n\n<!-- ============ 01 HERO ============ -->\n<section id=\"ch01\" data-screen-label=\"01 Hero\" style=\"max-width:1240px;margin:0 auto;padding:{{ heroPad }}\">\n  <p style=\"margin:0 0 24px;font-size:11px;font-weight:600;letter-spacing:.14em;color:#6B6B6D\">FINOS · AI FINANCIAL OPERATING SYSTEM<\u002Fp>\n  <h1 style=\"margin:0 0 32px;font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:{{ h1Size }};line-height:.92;letter-spacing:.005em;text-transform:uppercase;max-width:20ch;text-wrap:pretty\">Designing an AI financial operating system for better decisions — not just better dashboards.<\u002Fh1>\n  <p style=\"margin:0 0 48px;font-size:{{ leadSize }};line-height:1.5;color:#39393B;max-width:62ch;text-wrap:pretty\">FINOS is a concept financial operating system exploring how AI can help people understand their financial position, model possible futures, evaluate trade-offs and take action — while keeping humans in control of consequential decisions.<\u002Fp>\n\n  <dl style=\"display:grid;grid-template-columns:{{ metaGrid }};gap:24px;margin:0 0 24px;border-top:1px solid #111111;padding-top:24px\">\n    <sc-for list=\"{{ meta }}\" as=\"m\" hint-placeholder-count=\"5\">\n      <div>\n        <dt style=\"font-size:10.5px;font-weight:600;letter-spacing:.1em;color:#6B6B6D;margin-bottom:8px\">{{ m.k }}<\u002Fdt>\n        <dd style=\"margin:0;font-size:13px;line-height:1.45;color:#111111;text-wrap:pretty\">{{ m.v }}<\u002Fdd>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdl>\n\n  <div style=\"display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-top:1px solid #E5E5E5;padding-top:24px;margin-bottom:64px\">\n    <span style=\"font-size:10.5px;font-weight:600;letter-spacing:.1em;color:#6B6B6D;margin-right:8px\">PROJECT STATUS<\u002Fspan>\n    <sc-for list=\"{{ statusTags }}\" as=\"t\" hint-placeholder-count=\"4\">\n      <span style=\"font-size:11.5px;font-weight:600;color:#111111;border:1px solid #CACACB;border-radius:999px;padding:7px 14px\">{{ t }}<\u002Fspan>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n\n  <h2 style=\"margin:0 0 24px;font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:{{ h2Size }};line-height:.94;letter-spacing:.005em;text-transform:uppercase;max-width:16ch;text-wrap:pretty\">My role<\u002Fh2>\n  <p style=\"margin:0 0 32px;font-size:{{ leadSize }};line-height:1.5;color:#39393B;max-width:70ch;text-wrap:pretty\">I led the product definition, UX strategy, research synthesis, information architecture, decision architecture, AI interaction model, interaction design and high-fidelity prototyping for FINOS.<\u002Fp>\n  <dl style=\"display:grid;grid-template-columns:{{ respGrid }};gap:16px;margin:0 0 48px\">\n    <sc-for list=\"{{ resp }}\" as=\"r\" hint-placeholder-count=\"6\">\n      <div style=\"border-top:2px solid #111111;padding-top:12px\">\n        <dt style=\"font-size:10.5px;font-weight:600;letter-spacing:.1em;color:#111111;margin-bottom:6px\">{{ r.k }}<\u002Fdt>\n        <dd style=\"margin:0;font-size:12.5px;line-height:1.5;color:#39393B;text-wrap:pretty\">{{ r.v }}<\u002Fdd>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdl>\n\n  <p style=\"margin:0 0 16px;font-size:11px;font-weight:600;letter-spacing:.14em;color:#6B6B6D\">WHAT I OWNED<\u002Fp>\n  <dl style=\"display:grid;grid-template-columns:{{ ownGrid }};gap:1px;background:#CACACB;border:1px solid #CACACB;border-radius:14px;overflow:hidden;margin:0 0 64px\">\n    <sc-for list=\"{{ owned }}\" as=\"o\" hint-placeholder-count=\"5\">\n      <div style=\"background:#FFFFFF;padding:20px\">\n        <dt style=\"font-size:10.5px;font-weight:600;letter-spacing:.1em;color:#6B6B6D;margin-bottom:8px\">{{ o.k }}<\u002Fdt>\n        <dd style=\"margin:0;font-size:12.5px;line-height:1.5;color:#111111;text-wrap:pretty\">{{ o.v }}<\u002Fdd>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdl>\n\n  <p style=\"margin:0 0 8px;font-size:11px;font-weight:600;letter-spacing:.14em;color:#6B6B6D\">THE CASE STUDY IN EIGHT SECTIONS<\u002Fp>\n  <p style=\"margin:0 0 24px;font-size:13.5px;color:#6B6B6D;max-width:60ch;text-wrap:pretty\">Twenty chapters, grouped. Jump to any section — the full chapter rail stays available for the deep dive.<\u002Fp>\n  <ol style=\"list-style:none;margin:0;padding:0;display:grid;grid-template-columns:{{ mapGrid }};gap:16px\">\n    <sc-for list=\"{{ map }}\" as=\"s\" hint-placeholder-count=\"8\">\n      <li>\n        <a href=\"{{ s.href }}\" style=\"display:flex;flex-direction:column;gap:8px;height:100%;border:1px solid #CACACB;border-radius:14px;padding:20px;background:#FFFFFF\" style-hover=\"border-color:#111111\">\n          <span style=\"font-family:'Bebas Neue',sans-serif;font-size:20px;line-height:1;color:#CACACB\">{{ s.n }}<\u002Fspan>\n          <span style=\"font-family:'Bebas Neue',sans-serif;font-size:24px;line-height:.98;text-transform:uppercase;color:#111111;text-wrap:pretty\">{{ s.k }}<\u002Fspan>\n          <span style=\"font-size:12.5px;line-height:1.5;color:#39393B;text-wrap:pretty\">{{ s.why }}<\u002Fspan>\n          <span style=\"margin-top:auto;font-size:11px;font-weight:600;letter-spacing:.06em;color:#6B6B6D\">{{ s.ch }}<\u002Fspan>\n        <\u002Fa>\n      <\u002Fli>\n    <\u002Fsc-for>\n  <\u002Fol>\n<\u002Fsection>\n\n<section aria-label=\"The FINOS decision experience\" style=\"background:#F5F5F5;padding:{{ bandPad }};margin-top:48px\">\n  <div style=\"max-width:1240px;margin:0 auto\">\n    <p style=\"margin:0 0 8px;font-size:11px;font-weight:600;letter-spacing:.14em;color:#6B6B6D\">THE CORE EXPERIENCE · FINOS V1.4.1<\u002Fp>\n    <p style=\"margin:0 0 48px;font-size:{{ leadSize }};line-height:1.5;color:#111111;max-width:52ch;text-wrap:pretty\">One consequential decision, end to end — the same property decision travels through all six surfaces.<\u002Fp>\n\n    <ol style=\"list-style:none;margin:0;padding:0;display:grid;grid-template-columns:{{ frameGrid }};gap:{{ frameGap }}\">\n\n      <li data-reveal=\"1\" style=\"display:flex;flex-direction:column;gap:12px\">\n        <div style=\"display:flex;align-items:baseline;gap:12px\">\n          <span style=\"font-family:'Bebas Neue',sans-serif;font-size:24px;color:#111111\">01<\u002Fspan>\n          <span style=\"font-size:12.5px;font-weight:600;color:#111111\">Context<\u002Fspan>\n          <span style=\"font-size:11.5px;color:#6B6B6D\">Command Center<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"border:1px solid #E5E5E5;border-radius:14px;background:#FFFFFF;overflow:hidden\">\n          <div style=\"display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid #EFEFEF;background:#111111\">\n            <span aria-hidden=\"true\" style=\"width:10px;height:10px;border-radius:999px;background:#FFFFFF\"><\u002Fspan>\n            <span style=\"font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:.2em;color:#FFFFFF\">FINOS<\u002Fspan>\n            <span style=\"margin-left:auto;font-size:10px;color:#9E9EA0\">Command Center<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"padding:20px\">\n            <p style=\"margin:0 0 16px;font-family:'Bebas Neue',sans-serif;font-size:26px;line-height:.95;text-transform:uppercase;color:#111111\">Good morning, Alex.<\u002Fp>\n            <div style=\"display:grid;grid-template-columns:1fr 1fr;border:1px solid #EFEFEF;border-radius:11px;overflow:hidden\">\n              <div style=\"padding:14px 16px;border-right:1px solid #EFEFEF;border-bottom:1px solid #EFEFEF\">\n                <span style=\"display:block;font-size:10.5px;color:#6B6B6D;margin-bottom:4px\">Net Worth<\u002Fspan>\n                <span style=\"display:block;font-size:19px;font-weight:600;color:#111111\">R2,840,420<\u002Fspan>\n                <span style=\"font-size:10.5px;color:#007D48\">↑ 4.2% vs July<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"padding:14px 16px;border-bottom:1px solid #EFEFEF\">\n                <span style=\"display:block;font-size:10.5px;color:#6B6B6D;margin-bottom:4px\">Liquid Assets<\u002Fspan>\n                <span style=\"display:block;font-size:19px;font-weight:600;color:#111111\">R420,300<\u002Fspan>\n                <span style=\"font-size:10.5px;color:#007D48\">↑ 2.8% across 3 accounts<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"padding:14px 16px;border-right:1px solid #EFEFEF\">\n                <span style=\"display:block;font-size:10.5px;color:#6B6B6D;margin-bottom:4px\">Investments<\u002Fspan>\n                <span style=\"display:block;font-size:19px;font-weight:600;color:#111111\">R1,940,200<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"padding:14px 16px\">\n                <span style=\"display:block;font-size:10.5px;color:#6B6B6D;margin-bottom:4px\">Debt<\u002Fspan>\n                <span style=\"display:block;font-size:19px;font-weight:600;color:#111111\">R310,400<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"margin:0;font-size:12px;color:#39393B;text-wrap:pretty\">The system assembles the position before asking anything of the user.<\u002Fp>\n      <\u002Fli>\n\n      <li data-reveal=\"1\" style=\"display:flex;flex-direction:column;gap:12px\">\n        <div style=\"display:flex;align-items:baseline;gap:12px\">\n          <span style=\"font-family:'Bebas Neue',sans-serif;font-size:24px;color:#111111\">02<\u002Fspan>\n          <span style=\"font-size:12.5px;font-weight:600;color:#111111\">Scenario<\u002Fspan>\n          <span style=\"font-size:11.5px;color:#6B6B6D\">Scenario Builder<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"border:1px solid #E5E5E5;border-radius:14px;background:#FFFFFF;padding:20px\">\n          <p style=\"margin:0 0 16px;font-size:10.5px;font-weight:600;letter-spacing:.1em;color:#6B6B6D\">COMPARE APPROACHES<\u002Fp>\n          <div style=\"display:flex;flex-direction:column;gap:8px\">\n            <div style=\"border:1px solid #EFEFEF;border-radius:11px;padding:12px 16px\">\n              <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:4px\">\n                <span style=\"font-size:12.5px;font-weight:600\">Conservative<\u002Fspan>\n                <span style=\"font-size:11px;color:#007D48;font-weight:600\">◆ strong<\u002Fspan>\n              <\u002Fdiv>\n              <span style=\"font-size:11.5px;color:#6B6B6D\">Deposit R360,000 · R11,574 a month · 76% of value<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"border:1px solid #111111;border-radius:11px;padding:12px 16px;box-shadow:0 1px 2px rgba(17,17,17,.08)\">\n              <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:4px\">\n                <span style=\"font-size:12.5px;font-weight:600\">Balanced<\u002Fspan>\n                <span style=\"font-size:9.5px;font-weight:700;letter-spacing:.08em\">RECOMMENDED<\u002Fspan>\n                <span style=\"font-size:11px;color:#39393B;font-weight:600\">◆ moderate<\u002Fspan>\n              <\u002Fdiv>\n              <span style=\"font-size:11.5px;color:#6B6B6D\">Deposit R300,000 · R12,183 a month · 80% of value<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"border:1px solid #EFEFEF;border-radius:11px;padding:12px 16px\">\n              <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:4px\">\n                <span style=\"font-size:12.5px;font-weight:600\">Aggressive<\u002Fspan>\n                <span style=\"font-size:11px;color:#D30005;font-weight:600\">◆ strained<\u002Fspan>\n              <\u002Fdiv>\n              <span style=\"font-size:11.5px;color:#6B6B6D\">Deposit R240,000 · R12,792 a month · 84% of value<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"margin:0;font-size:12px;color:#39393B;text-wrap:pretty\">The prototype recalculates outputs deterministically from the scenario assumptions. These calculations demonstrate interaction and scenario behaviour and have not been independently validated as production financial models.<\u002Fp>\n      <\u002Fli>\n\n      <li data-reveal=\"1\" style=\"display:flex;flex-direction:column;gap:12px\">\n        <div style=\"display:flex;align-items:baseline;gap:12px\">\n          <span style=\"font-family:'Bebas Neue',sans-serif;font-size:24px;color:#111111\">03<\u002Fspan>\n          <span style=\"font-size:12.5px;font-weight:600;color:#111111\">Recommendation<\u002Fspan>\n          <span style=\"font-size:11.5px;color:#6B6B6D\">Decision Room<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"border:1px solid #E5E5E5;border-radius:14px;background:#FFFFFF;padding:20px\">\n          <p style=\"margin:0 0 12px;font-size:10.5px;font-weight:600;letter-spacing:.1em;color:#6B6B6D\">RECOMMENDATION<\u002Fp>\n          <div style=\"display:flex;align-items:center;gap:12px;margin-bottom:12px\">\n            <span style=\"font-family:'Bebas Neue',sans-serif;font-size:28px;line-height:1;text-transform:uppercase\">Balanced approach<\u002Fspan>\n            <span style=\"font-size:11.5px;font-weight:600;color:#6B6B6D\">● Moderate confidence<\u002Fspan>\n          <\u002Fdiv>\n          <p style=\"margin:0 0 16px;font-size:12.5px;line-height:1.5;color:#39393B;text-wrap:pretty\">A R300,000 deposit lands at R12,183 a month and leaves R367,800 liquid — 5.5 months of cover against R67,283 of monthly outflow once the bond replaces your rent.<\u002Fp>\n          <div style=\"display:flex;flex-direction:column;gap:8px\">\n            <div style=\"display:flex;gap:8px;font-size:12px;color:#111111\"><span aria-hidden=\"true\" style=\"color:#007D48\">●<\u002Fspan><span style=\"text-wrap:pretty\">Borrowing stays at 80% of the property value, within the 80% workspace borrowing ceiling<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;gap:8px;font-size:12px;color:#111111\"><span aria-hidden=\"true\" style=\"color:#007D48\">●<\u002Fspan><span style=\"text-wrap:pretty\">Monthly surplus remains positive at R11,217<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;gap:8px;font-size:12px;color:#111111\"><span aria-hidden=\"true\" style=\"color:#D30005\">▲<\u002Fspan><span style=\"text-wrap:pretty\">Cash cover reaches 5.5 of the 6.0 months this decision asks you to hold — a R35,896 shortfall<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"margin:0;font-size:12px;color:#39393B;text-wrap:pretty\">Reasoning, evidence and open risks arrive with the recommendation, not behind it.<\u002Fp>\n      <\u002Fli>\n\n      <li data-reveal=\"1\" style=\"display:flex;flex-direction:column;gap:12px\">\n        <div style=\"display:flex;align-items:baseline;gap:12px\">\n          <span style=\"font-family:'Bebas Neue',sans-serif;font-size:24px;color:#111111\">04<\u002Fspan>\n          <span style=\"font-size:12.5px;font-weight:600;color:#111111\">Challenge<\u002Fspan>\n          <span style=\"font-size:11.5px;color:#6B6B6D\">Decision Room<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"border:1px solid #E5E5E5;border-radius:14px;background:#FFFFFF;padding:20px\">\n          <p style=\"margin:0 0 16px;font-size:12.5px;color:#111111;text-wrap:pretty\">Two paths from here. Accepting this recommendation is not the only correct outcome.<\u002Fp>\n          <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px\">\n            <span style=\"height:38px;display:inline-flex;align-items:center;justify-content:center;padding:0 16px;border:1px solid #111111;border-radius:999px;font-size:13px;font-weight:600;color:#111111\">Challenge recommendation<\u002Fspan>\n            <span style=\"height:38px;display:inline-flex;align-items:center;justify-content:center;padding:0 16px;border-radius:999px;background:#111111;color:#FFFFFF;font-size:13px;font-weight:600\">Review &amp; approve<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-wrap:wrap;gap:16px;margin-bottom:16px\">\n            <span style=\"font-size:12.5px;font-weight:600;color:#39393B;text-decoration:underline;text-underline-offset:3px\">Modify scenario<\u002Fspan>\n            <span style=\"font-size:12.5px;font-weight:600;color:#39393B;text-decoration:underline;text-underline-offset:3px\">Ask FINOS<\u002Fspan>\n            <span style=\"font-size:12.5px;font-weight:600;color:#39393B;text-decoration:underline;text-underline-offset:3px\">Decision history<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"border-top:1px solid #EFEFEF;padding-top:16px;display:flex;flex-direction:column;gap:8px\">\n            <span style=\"font-size:10.5px;font-weight:600;letter-spacing:.1em;color:#6B6B6D\">CHALLENGE THIS RECOMMENDATION<\u002Fspan>\n            <span style=\"font-size:12px;color:#111111\">I expect my income to rise<\u002Fspan>\n            <span style=\"font-size:12px;color:#111111\">I want a deeper cash reserve<\u002Fspan>\n            <span style=\"font-size:12px;color:#111111\">I think rates will fall<\u002Fspan>\n            <span style=\"font-size:12px;color:#111111\">I would pay more for the right property<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"margin:0;font-size:12px;color:#39393B;text-wrap:pretty\">Disagreement is a designed path, written in the user's voice — adopting a challenge re-runs the recommendation.<\u002Fp>\n      <\u002Fli>\n\n      <li data-reveal=\"1\" style=\"display:flex;flex-direction:column;gap:12px\">\n        <div style=\"display:flex;align-items:baseline;gap:12px\">\n          <span style=\"font-family:'Bebas Neue',sans-serif;font-size:24px;color:#111111\">05<\u002Fspan>\n          <span style=\"font-size:12.5px;font-weight:600;color:#111111\">Approval<\u002Fspan>\n          <span style=\"font-size:11.5px;color:#6B6B6D\">Review &amp; Approve<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"border:1px solid #E5E5E5;border-radius:14px;background:#FFFFFF;overflow:hidden\">\n          <div style=\"padding:20px 20px 16px;border-bottom:1px solid #EFEFEF\">\n            <div style=\"font-size:10.5px;font-weight:700;letter-spacing:.12em;color:#6B6B6D;margin-bottom:8px\">REVIEW &amp; APPROVE<\u002Fdiv>\n            <div style=\"font-size:15.5px;font-weight:600;color:#111111\">Record this property decision · Balanced<\u002Fdiv>\n            <div style=\"margin-top:6px;font-size:12px;color:#39393B;text-wrap:pretty\">Triggered by · FINOS recommendation, Balanced approach<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"padding:20px\">\n            <div style=\"display:flex;flex-direction:column;gap:8px;margin-bottom:16px;font-size:12.5px\">\n              <div style=\"display:flex\"><span style=\"flex:1 1 auto;color:#39393B\">Property<\u002Fspan><span style=\"font-weight:600;font-variant-numeric:tabular-nums\">R1,500,000<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex\"><span style=\"flex:1 1 auto;color:#39393B\">Deposit<\u002Fspan><span style=\"font-weight:600;font-variant-numeric:tabular-nums\">R300,000<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex\"><span style=\"flex:1 1 auto;color:#39393B\">Term<\u002Fspan><span style=\"font-weight:600\">20 years<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex\"><span style=\"flex:1 1 auto;color:#39393B\">Monthly impact<\u002Fspan><span style=\"font-weight:600;font-variant-numeric:tabular-nums\">R12,183<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"border-top:1px solid #EFEFEF;padding-top:16px;margin-bottom:16px;display:flex;flex-direction:column;gap:8px;font-size:12px\">\n              <div style=\"display:flex;gap:12px\"><span style=\"width:88px;flex:0 0 auto;color:#6B6B6D\">Impact<\u002Fspan><span style=\"flex:1 1 auto;color:#111111;text-wrap:pretty\">Liquidity R367,800 after transfer costs · reserve cover 5.5 months<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;gap:12px\"><span style=\"width:88px;flex:0 0 auto;color:#6B6B6D\">Trade-off<\u002Fspan><span style=\"flex:1 1 auto;color:#111111;text-wrap:pretty\">A larger deposit protects cash cover but raises the monthly commitment<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;gap:12px\"><span style=\"width:88px;flex:0 0 auto;color:#6B6B6D\">Risk<\u002Fspan><span style=\"flex:1 1 auto;color:#111111;text-wrap:pretty\">Cash cover reaches 5.5 of the 6.0 months this decision asks you to hold<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;gap:12px\"><span style=\"width:88px;flex:0 0 auto;color:#6B6B6D\">Authority<\u002Fspan><span style=\"flex:1 1 auto;color:#111111;text-wrap:pretty\">You are recording a decision and its assumptions. FINOS does not move money or place trades.<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;gap:12px;align-items:flex-start;background:#F5F5F5;border:1px solid #E5E5E5;border-radius:14px;padding:12px 16px\">\n              <span aria-hidden=\"true\" style=\"flex:0 0 auto;margin-top:1px;width:16px;height:16px;border-radius:4px;background:#111111;color:#FFFFFF;font-size:11px;line-height:16px;text-align:center\">✓<\u002Fspan>\n              <span style=\"font-size:12px;color:#111111;text-wrap:pretty\">I have reviewed the impact, trade-off and risk above, and I authorise this decision record.<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:8px;align-items:center;padding:16px 20px;border-top:1px solid #EFEFEF;background:#F5F5F5\">\n            <span style=\"height:34px;display:inline-flex;align-items:center;padding:0 16px;border:1px solid #CACACB;border-radius:999px;background:#FFFFFF;font-size:12.5px;font-weight:600;color:#111111\">Go back<\u002Fspan>\n            <span style=\"flex:1 1 auto\"><\u002Fspan>\n            <span style=\"height:34px;display:inline-flex;align-items:center;padding:0 20px;border-radius:999px;background:#111111;color:#FFFFFF;font-size:12.5px;font-weight:600\">Approve decision<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"margin:0;font-size:12px;color:#39393B;text-wrap:pretty\">Nothing consequential executes without an explicit, attributed human approval.<\u002Fp>\n      <\u002Fli>\n\n      <li data-reveal=\"1\" style=\"display:flex;flex-direction:column;gap:12px\">\n        <div style=\"display:flex;align-items:baseline;gap:12px\">\n          <span style=\"font-family:'Bebas Neue',sans-serif;font-size:24px;color:#111111\">06<\u002Fspan>\n          <span style=\"font-size:12.5px;font-weight:600;color:#111111\">Audit<\u002Fspan>\n          <span style=\"font-size:11.5px;color:#6B6B6D\">Decision Room · trail<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"border:1px solid #E5E5E5;border-radius:14px;background:#FFFFFF;padding:20px\">\n          <p style=\"margin:0 0 16px;font-size:10.5px;font-weight:600;letter-spacing:.1em;color:#6B6B6D\">DECISION TRAIL<\u002Fp>\n          <ol style=\"list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:16px\">\n            <sc-for list=\"{{ trail }}\" as=\"t\" hint-placeholder-count=\"5\">\n              <li style=\"display:flex;gap:12px\">\n                <span style=\"flex:0 0 auto;font-size:11px;color:#6B6B6D;font-variant-numeric:tabular-nums;padding-top:1px\">{{ t.time }}<\u002Fspan>\n                <span style=\"flex:1 1 auto;min-width:0\">\n                  <span style=\"display:block;font-size:12.5px;font-weight:600;color:#111111\">{{ t.title }}<\u002Fspan>\n                  <span style=\"display:block;font-size:11.5px;line-height:1.45;color:#39393B;text-wrap:pretty\">{{ t.detail }}<\u002Fspan>\n                  <span style=\"display:block;font-size:10.5px;color:#6B6B6D;margin-top:2px\">{{ t.actor }}<\u002Fspan>\n                <\u002Fspan>\n              <\u002Fli>\n            <\u002Fsc-for>\n          <\u002Fol>\n        <\u002Fdiv>\n        <p style=\"margin:0;font-size:12px;color:#39393B;text-wrap:pretty\">Every step is attributed — what AI proposed, what the human changed and approved.<\u002Fp>\n      <\u002Fli>\n    <\u002Fol>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<div style='max-width:1400px;margin:0 auto;padding:8px 24px 110px'><figure style='margin:0'><div style='border-radius:24px;overflow:hidden;box-shadow:0 70px 140px -54px rgba(17,17,17,.6);background:#0b0b0c'><img src='assets/img/finos/mock-command.jpg' alt='FINOS Command Center on a laptop — net worth, liquid assets, investments and the FINOS briefing, staged on an industrial trolley' style='display:block;width:100%;height:auto'/><\u002Fdiv><figcaption style='margin-top:14px;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#6B6B6D'>Mockup 01 — Command Center · the whole financial picture on one screen<\u002Ffigcaption><\u002Ffigure><\u002Fdiv>\n\n<!-- ============ 02 SYSTEM ============ -->\n<section id=\"ch02\" data-screen-label=\"02 System\" style=\"max-width:1240px;margin:0 auto;padding:{{ secPad }}\">\n  <p style=\"margin:0 0 24px;font-size:11px;font-weight:600;letter-spacing:.14em;color:#6B6B6D\">02 — FINOS IN ONE SENTENCE<\u002Fp>\n  <h2 style=\"margin:0 0 32px;font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:{{ h2Size }};line-height:.94;letter-spacing:.005em;text-transform:uppercase;max-width:22ch;text-wrap:pretty\">From financial information to financial decisions.<\u002Fh2>\n  <div style=\"display:grid;grid-template-columns:{{ twoCol }};gap:48px;margin-bottom:64px\">\n    <p style=\"margin:0;font-size:{{ leadSize }};line-height:1.5;color:#111111;text-wrap:pretty\">Most financial products help people see their money.<\u002Fp>\n    <p style=\"margin:0;font-size:{{ leadSize }};line-height:1.5;color:#39393B;text-wrap:pretty\">FINOS explores how an AI-powered system could help people reason about what to do next.<\u002Fp>\n  <\u002Fdiv>\n\n  <ol style=\"list-style:none;margin:0;padding:0;display:grid;grid-template-columns:{{ stageGrid }};gap:0;border-top:1px solid #111111\">\n    <sc-for list=\"{{ stages }}\" as=\"s\" hint-placeholder-count=\"9\">\n      <li data-reveal=\"1\" style=\"border-bottom:1px solid #E5E5E5;border-right:1px solid #E5E5E5;padding:24px 20px;display:flex;flex-direction:column;gap:8px;background:{{ s.bg }}\">\n        <span style=\"font-family:'Bebas Neue',sans-serif;font-size:34px;line-height:1;color:{{ s.num }}\">{{ s.n }}<\u002Fspan>\n        <span style=\"font-size:13.5px;font-weight:600;color:{{ s.fg }}\">{{ s.label }}<\u002Fspan>\n        <span style=\"font-size:12px;line-height:1.45;color:{{ s.muted }};text-wrap:pretty\">{{ s.desc }}<\u002Fspan>\n        <span style=\"font-size:10px;font-weight:600;letter-spacing:.1em;color:{{ s.muted }};margin-top:auto;padding-top:12px\">{{ s.actor }}<\u002Fspan>\n      <\u002Fli>\n    <\u002Fsc-for>\n  <\u002Fol>\n<\u002Fsection>\n\n<section aria-label=\"Core principle\" style=\"background:#111111;color:#FFFFFF;padding:{{ bandPad }}\">\n  <div style=\"max-width:1240px;margin:0 auto\">\n    <p style=\"margin:0 0 24px;font-size:11px;font-weight:600;letter-spacing:.14em;color:#9E9EA0\">CORE PRINCIPLE<\u002Fp>\n    <p style=\"margin:0;font-family:'Bebas Neue',sans-serif;font-size:{{ quoteSize }};line-height:1.02;letter-spacing:.005em;text-transform:uppercase;max-width:26ch;text-wrap:pretty\">AI can help prepare and explain a decision, but people should remain able to question, approve and understand the consequences of acting on it.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ 03 PROBLEM ============ -->\n<div style='max-width:1240px;margin:0 auto;padding:0 24px 96px'><p style='margin:0 0 18px;font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#111'>From the prototype — the system in one view<\u002Fp><div style='display:grid;gap:28px'><figure style='margin:0'><div style='border:1px solid rgba(17,17,17,.14);border-radius:14px;overflow:hidden;box-shadow:0 30px 70px -38px rgba(17,17,17,.35);background:#fff'><img src='assets/img/finos/command.jpg' alt='FINOS Command Center showing net worth, liquid assets, investments, debt and items needing attention' loading='lazy' style='display:block;width:100%;height:auto'/><\u002Fdiv><figcaption style='margin-top:12px;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#6B6B6D'>Fig 01 — Command Center · everything that changed since your last review<\u002Ffigcaption><\u002Ffigure><\u002Fdiv><\u002Fdiv><section id=\"ch03\" data-screen-label=\"03 Problem\" style=\"max-width:1240px;margin:0 auto;padding:{{ secPad }}\">\n  <p style=\"margin:0 0 24px;font-size:11px;font-weight:600;letter-spacing:.14em;color:#6B6B6D\">03 — THE PROBLEM<\u002Fp>\n  <h2 style=\"margin:0 0 32px;font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:{{ h2Size }};line-height:.94;letter-spacing:.005em;text-transform:uppercase;max-width:20ch;text-wrap:pretty\">Financial decisions are rarely about one number.<\u002Fh2>\n  <div style=\"display:grid;grid-template-columns:{{ twoCol }};gap:48px;margin-bottom:24px\">\n    <p style=\"margin:0;font-size:{{ leadSize }};line-height:1.5;color:#111111;text-wrap:pretty\">A person's financial reality is distributed across accounts, transactions, investments, bills, goals, documents and future commitments.<\u002Fp>\n    <p style=\"margin:0;font-size:{{ leadSize }};line-height:1.5;color:#39393B;text-wrap:pretty\">When making a consequential decision, the user has to mentally assemble all of this context before they can even begin asking: <em style=\"font-style:normal;color:#111111;font-weight:600\">What should I do?<\u002Fem><\u002Fp>\n  <\u002Fdiv>\n  <p style=\"margin:0;padding-top:24px;border-top:1px solid #111111;font-size:13px;font-weight:600;letter-spacing:.06em;color:#111111\">THE PROBLEM HAS THREE LAYERS<\u002Fp>\n<\u002Fsection>\n\n<!-- problem 01 -->\n<section aria-labelledby=\"p01\" style=\"max-width:1240px;margin:0 auto;padding:0 {{ gutter }} 96px\">\n  <div style=\"display:grid;grid-template-columns:{{ probGrid }};gap:{{ probGap }};align-items:start\">\n    <div>\n      <h3 id=\"p01\" style=\"margin:0 0 16px;font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:{{ h3Size }};line-height:1;text-transform:uppercase\">01 — Fragmented context<\u002Fh3>\n      <p style=\"margin:0 0 24px;font-size:14.5px;line-height:1.55;color:#39393B;text-wrap:pretty\">Financial information often exists as separate pieces. The user becomes the integration layer — holding seven sources in their head long enough to form one picture.<\u002Fp>\n      <div style=\"border-left:3px solid #111111;padding:0 0 0 16px;margin-bottom:16px\">\n        <p style=\"margin:0 0 4px;font-size:10.5px;font-weight:600;letter-spacing:.1em;color:#6B6B6D\">INSIGHT<\u002Fp>\n        <p style=\"margin:0;font-size:14px;line-height:1.5;color:#111111;text-wrap:pretty\">The system needs to construct the financial context before asking the user to make a decision.<\u002Fp>\n      <\u002Fdiv>\n      <p style=\"margin:0;font-size:13px;color:#111111\"><span style=\"font-size:10.5px;font-weight:600;letter-spacing:.1em;color:#6B6B6D;display:block;margin-bottom:4px\">PRODUCT OPPORTUNITY<\u002Fspan><span style=\"font-weight:600\">Unified Financial Context<\u002Fspan><\u002Fp>\n    <\u002Fdiv>\n    <div data-reveal=\"1\" style=\"border:1px solid #E5E5E5;border-radius:14px;padding:{{ diagramPad }};background:#FFFFFF\">\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px;margin-bottom:20px\">\n        <sc-for list=\"{{ sources }}\" as=\"src\" hint-placeholder-count=\"7\">\n          <div style=\"border:1px solid #E5E5E5;border-radius:11px;padding:12px;font-size:11.5px;color:#111111;text-align:center\">{{ src }}<\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div aria-hidden=\"true\" style=\"display:flex;justify-content:center;color:#CACACB;font-size:14px;margin-bottom:20px\">↓<\u002Fdiv>\n      <div style=\"border:1px solid #111111;border-radius:11px;padding:16px;text-align:center;margin-bottom:20px\">\n        <span style=\"display:block;font-size:12.5px;font-weight:600;color:#111111\">USER<\u002Fspan>\n        <span style=\"font-size:11.5px;color:#6B6B6D\">assembles it manually, every time<\u002Fspan>\n      <\u002Fdiv>\n      <div aria-hidden=\"true\" style=\"display:flex;justify-content:center;color:#CACACB;font-size:14px;margin-bottom:20px\">↓<\u002Fdiv>\n      <div style=\"border:1px dashed #9E9EA0;border-radius:11px;padding:16px;text-align:center;background:#F5F5F5\">\n        <span style=\"display:block;font-size:12.5px;font-weight:600;color:#111111\">MENTAL MODEL<\u002Fspan>\n        <span style=\"font-size:11.5px;color:#6B6B6D\">incomplete, unshared, expires<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- problem 02 -->\n<section aria-labelledby=\"p02\" style=\"background:#F5F5F5;padding:{{ bandPad }}\">\n  <div style=\"max-width:1240px;margin:0 auto;display:grid;grid-template-columns:{{ probGrid }};gap:{{ probGap }};align-items:start\">\n    <div>\n      <h3 id=\"p02\" style=\"margin:0 0 16px;font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:{{ h3Size }};line-height:1;text-transform:uppercase\">02 — Complex trade-offs<\u002Fh3>\n      <p style=\"margin:0 0 24px;font-size:14.5px;line-height:1.55;color:#39393B;text-wrap:pretty\">A consequential financial decision isn't represented by a single metric. It involves liquidity, cash flow, debt, risk, goals, time horizon and opportunity cost at once — and changing one assumption can change the entire recommendation.<\u002Fp>\n      <div style=\"border-left:3px solid #111111;padding:0 0 0 16px;margin-bottom:16px\">\n        <p style=\"margin:0 0 4px;font-size:10.5px;font-weight:600;letter-spacing:.1em;color:#6B6B6D\">INSIGHT<\u002Fp>\n        <p style=\"margin:0;font-size:14px;line-height:1.5;color:#111111;text-wrap:pretty\">Instead of presenting one answer, allow users to model and compare possible futures.<\u002Fp>\n      <\u002Fdiv>\n      <p style=\"margin:0;font-size:13px;color:#111111\"><span style=\"font-size:10.5px;font-weight:600;letter-spacing:.1em;color:#6B6B6D;display:block;margin-bottom:4px\">PRODUCT OPPORTUNITY<\u002Fspan><span style=\"font-weight:600\">Scenario Modelling<\u002Fspan><\u002Fp>\n    <\u002Fdiv>\n    <div data-reveal=\"1\" style=\"border:1px solid #E5E5E5;border-radius:14px;padding:{{ diagramPad }};background:#FFFFFF\">\n      <div style=\"display:flex;flex-direction:column;gap:8px;margin-bottom:20px\">\n        <sc-for list=\"{{ forces }}\" as=\"f\" hint-placeholder-count=\"7\">\n          <div style=\"display:flex;align-items:center;gap:12px\">\n            <span style=\"flex:0 0 auto;min-width:118px;font-size:12px;font-weight:600;color:#111111\">{{ f.name }}<\u002Fspan>\n            <span aria-hidden=\"true\" style=\"flex:1 1 auto;height:1px;background:#E5E5E5;position:relative\"><span style=\"position:absolute;right:0;top:-3px;width:7px;height:7px;border-radius:999px;background:#111111\"><\u002Fspan><\u002Fspan>\n            <span style=\"flex:0 0 auto;font-size:11.5px;color:#6B6B6D;text-align:right;max-width:{{ forceW }};text-wrap:pretty\">{{ f.moves }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"border-top:1px solid #111111;padding-top:20px;text-align:center\">\n        <span style=\"display:block;font-family:'Bebas Neue',sans-serif;font-size:30px;line-height:1;text-transform:uppercase;color:#111111\">Decision<\u002Fspan>\n        <span style=\"font-size:11.5px;color:#6B6B6D\">seven inputs, one commitment<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- problem 03 -->\n<section aria-labelledby=\"p03\" style=\"max-width:1240px;margin:0 auto;padding:{{ secPad }}\">\n  <div style=\"display:grid;grid-template-columns:{{ probGrid }};gap:{{ probGap }};align-items:start\">\n    <div>\n      <h3 id=\"p03\" style=\"margin:0 0 16px;font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:{{ h3Size }};line-height:1;text-transform:uppercase\">03 — AI creates a new trust problem<\u002Fh3>\n      <p style=\"margin:0 0 24px;font-size:14.5px;line-height:1.55;color:#39393B;text-wrap:pretty\">AI can produce a recommendation in seconds. But when the consequence is significant, speed is not the scarce resource — grounds for acting are.<\u002Fp>\n      <div style=\"border-left:3px solid #111111;padding:0 0 0 16px;margin-bottom:16px\">\n        <p style=\"margin:0 0 4px;font-size:10.5px;font-weight:600;letter-spacing:.1em;color:#6B6B6D\">INSIGHT<\u002Fp>\n        <p style=\"margin:0;font-size:14px;line-height:1.5;color:#111111;text-wrap:pretty\">Explainability needs to be part of the decision itself — not an optional AI feature.<\u002Fp>\n      <\u002Fdiv>\n      <p style=\"margin:0;font-size:13px;color:#111111\"><span style=\"font-size:10.5px;font-weight:600;letter-spacing:.1em;color:#6B6B6D;display:block;margin-bottom:4px\">PRODUCT OPPORTUNITY<\u002Fspan><span style=\"font-weight:600\">Decision Rationale + Human Control<\u002Fspan><\u002Fp>\n    <\u002Fdiv>\n    <div data-reveal=\"1\">\n      <p style=\"margin:0 0 20px;font-size:11px;font-weight:600;letter-spacing:.14em;color:#6B6B6D\">AI RECOMMENDATION<\u002Fp>\n      <div aria-hidden=\"true\" style=\"height:24px;width:1px;background:#CACACB;margin-left:12px\"><\u002Fdiv>\n      <ol style=\"list-style:none;margin:0;padding:0;border-top:1px solid #111111\">\n        <sc-for list=\"{{ trustQs }}\" as=\"q\" hint-placeholder-count=\"6\">\n          <li style=\"border-bottom:1px solid #E5E5E5;padding:20px 0;display:flex;gap:20px;align-items:baseline\">\n            <span style=\"flex:0 0 auto;min-width:110px;font-size:10.5px;font-weight:700;letter-spacing:.1em;color:#6B6B6D\">{{ q.tag }}<\u002Fspan>\n            <span style=\"flex:1 1 auto;font-family:'Bebas Neue',sans-serif;font-size:{{ trustSize }};line-height:1.05;text-transform:uppercase;color:#111111;text-wrap:pretty\">{{ q.q }}<\u002Fspan>\n          <\u002Fli>\n        <\u002Fsc-for>\n      <\u002Fol>\n      <div aria-hidden=\"true\" style=\"height:24px;width:1px;background:#CACACB;margin-left:12px\"><\u002Fdiv>\n      <p style=\"margin:0;font-size:11px;font-weight:600;letter-spacing:.14em;color:#111111\">USER DECISION<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- chapter 03 summary -->\n<section aria-label=\"Problem summary\" style=\"max-width:1240px;margin:0 auto;padding:0 {{ gutter }} 96px\">\n  <div style=\"display:grid;grid-template-columns:{{ triGrid }};gap:0;border-top:1px solid #111111\">\n    <sc-for list=\"{{ summary }}\" as=\"s\" hint-placeholder-count=\"3\">\n      <div style=\"border-bottom:1px solid #E5E5E5;border-right:1px solid #E5E5E5;padding:32px 24px\">\n        <p style=\"margin:0 0 12px;font-family:'Bebas Neue',sans-serif;font-size:30px;line-height:1;text-transform:uppercase;color:#111111\">{{ s.k }}<\u002Fp>\n        <p style=\"margin:0;font-size:13.5px;line-height:1.5;color:#39393B;text-wrap:pretty\">{{ s.v }}<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n  <p style=\"margin:32px 0 0;font-size:{{ leadSize }};font-weight:600;color:#111111\">FINOS needed to address all three.<\u002Fp>\n<\u002Fsection>\n\n<!-- ============ 04 CHALLENGE ============ -->\n<section id=\"ch04\" data-screen-label=\"04 Challenge\" style=\"max-width:1240px;margin:0 auto;padding:{{ secPad }}\">\n  <p style=\"margin:0 0 24px;font-size:11px;font-weight:600;letter-spacing:.14em;color:#6B6B6D\">04 — THE DESIGN CHALLENGE<\u002Fp>\n  <h2 style=\"margin:0 0 24px;font-size:{{ preRevealSize }};font-weight:400;line-height:1.25;color:#6B6B6D;max-width:26ch;text-wrap:pretty\">The challenge wasn't simply building an AI financial assistant.<\u002Fh2>\n  <p data-reveal=\"1\" style=\"margin:0;font-family:'Bebas Neue',sans-serif;font-size:{{ revealSize }};line-height:.9;letter-spacing:.005em;text-transform:uppercase;color:#111111;max-width:18ch;text-wrap:pretty\">It was deciding how much control AI should have.<\u002Fp>\n<\u002Fsection>\n\n<section aria-label=\"Autonomy spectrum\" style=\"max-width:1240px;margin:0 auto;padding:0 {{ gutter }} 96px\">\n  <p style=\"margin:0 0 24px;font-size:11px;font-weight:600;letter-spacing:.14em;color:#6B6B6D\">THE AUTONOMY SPECTRUM<\u002Fp>\n  <div style=\"display:grid;grid-template-columns:{{ spectrumGrid }};gap:0;align-items:stretch\">\n    <div style=\"border:1px solid #E5E5E5;border-radius:14px 0 0 14px;padding:24px 20px;background:#FFFFFF\">\n      <p style=\"margin:0 0 8px;font-size:10.5px;font-weight:700;letter-spacing:.1em;color:#6B6B6D\">LOW AUTONOMY<\u002Fp>\n      <p style=\"margin:0 0 8px;font-size:15px;font-weight:600;color:#111111\">Manual work<\u002Fp>\n      <p style=\"margin:0;font-size:12.5px;line-height:1.5;color:#39393B;text-wrap:pretty\">The user gathers, calculates and decides. Full agency, no leverage.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"border:1px solid #E5E5E5;border-left:0;padding:24px 20px;background:#FFFFFF\">\n      <p style=\"margin:0 0 8px;font-size:10.5px;font-weight:700;letter-spacing:.1em;color:#6B6B6D\">ASSISTED<\u002Fp>\n      <p style=\"margin:0 0 8px;font-size:15px;font-weight:600;color:#111111\">AI prepares and recommends<\u002Fp>\n      <p style=\"margin:0;font-size:12.5px;line-height:1.5;color:#39393B;text-wrap:pretty\">Useful, but the reasoning stays opaque and the record stays thin.<\u002Fp>\n    <\u002Fdiv>\n    <div data-reveal=\"1\" style=\"border:1px solid #111111;background:#111111;color:#FFFFFF;padding:24px 20px;box-shadow:0 2px 8px rgba(17,17,17,.18)\">\n      <p style=\"margin:0 0 8px;font-size:10.5px;font-weight:700;letter-spacing:.1em;color:#FFFFFF\">FINOS · DELIBERATE POSITION<\u002Fp>\n      <ol style=\"list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px\">\n        <sc-for list=\"{{ finosSteps }}\" as=\"f\" hint-placeholder-count=\"8\">\n          <li style=\"display:flex;gap:10px;align-items:baseline;font-size:12.5px;color:{{ f.tone }}\">\n            <span style=\"font-size:9.5px;font-weight:700;letter-spacing:.08em;min-width:56px\">{{ f.who }}<\u002Fspan>\n            <span style=\"font-weight:600\">{{ f.what }}<\u002Fspan>\n          <\u002Fli>\n        <\u002Fsc-for>\n      <\u002Fol>\n    <\u002Fdiv>\n    <div style=\"border:1px solid #E5E5E5;border-left:0;border-radius:0 14px 14px 0;padding:24px 20px;background:#FFFFFF\">\n      <p style=\"margin:0 0 8px;font-size:10.5px;font-weight:700;letter-spacing:.1em;color:#6B6B6D\">HIGH AUTONOMY<\u002Fp>\n      <p style=\"margin:0 0 8px;font-size:15px;font-weight:600;color:#111111\">AI acts automatically<\u002Fp>\n      <p style=\"margin:0;font-size:12.5px;line-height:1.5;color:#39393B;text-wrap:pretty\">Fast and unaccountable. The consequence arrives before the reasoning does.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <p style=\"margin:24px 0 0;font-size:13.5px;color:#39393B;max-width:70ch;text-wrap:pretty\">FINOS sits deliberately between manual financial management and fully autonomous financial AI — the AI carries the analysis, the human carries the consequence.<\u002Fp>\n<\u002Fsection>\n\n<section aria-label=\"Human-in-the-loop model\" style=\"background:#111111;color:#FFFFFF;padding:{{ bandPad }}\">\n  <div style=\"max-width:1240px;margin:0 auto\">\n    <p style=\"margin:0 0 48px;font-size:11px;font-weight:600;letter-spacing:.14em;color:#9E9EA0\">THE HUMAN-IN-THE-LOOP MODEL<\u002Fp>\n    <div style=\"display:grid;grid-template-columns:{{ hitlGrid }};gap:{{ hitlGap }};align-items:stretch\">\n      <div>\n        <p style=\"margin:0 0 20px;font-size:10.5px;font-weight:700;letter-spacing:.12em;color:#9E9EA0\">AI CAPABILITY<\u002Fp>\n        <ol style=\"list-style:none;margin:0;padding:0;border-top:1px solid #2B2B2B\">\n          <sc-for list=\"{{ aiSide }}\" as=\"a\" hint-placeholder-count=\"3\">\n            <li style=\"border-bottom:1px solid #2B2B2B;padding:20px 0\">\n              <span style=\"display:block;font-family:'Bebas Neue',sans-serif;font-size:26px;line-height:1;text-transform:uppercase;color:#FFFFFF\">{{ a.label }}<\u002Fspan>\n              <span style=\"font-size:12px;color:#9E9EA0;text-wrap:pretty\">{{ a.desc }}<\u002Fspan>\n            <\u002Fli>\n          <\u002Fsc-for>\n        <\u002Fol>\n      <\u002Fdiv>\n      <div aria-hidden=\"true\" style=\"{{ hitlDivider }}\">\n        <span style=\"font-size:9.5px;font-weight:700;letter-spacing:.14em;color:#111111;background:#FFFFFF;padding:6px 10px;border-radius:999px;white-space:nowrap\">HUMAN CONTROL<\u002Fspan>\n      <\u002Fdiv>\n      <div>\n        <p style=\"margin:0 0 20px;font-size:10.5px;font-weight:700;letter-spacing:.12em;color:#FFFFFF\">HUMAN AUTHORITY &amp; SYSTEM RECORD<\u002Fp>\n        <ol style=\"list-style:none;margin:0;padding:0;border-top:1px solid #2B2B2B\">\n          <sc-for list=\"{{ humanSide }}\" as=\"h\" hint-placeholder-count=\"5\">\n            <li style=\"border-bottom:1px solid #2B2B2B;padding:20px 0;display:flex;gap:16px;align-items:baseline\">\n              <span style=\"flex:1 1 auto\"><span style=\"display:block;font-family:'Bebas Neue',sans-serif;font-size:26px;line-height:1;text-transform:uppercase;color:#FFFFFF\">{{ h.label }}<\u002Fspan><span style=\"font-size:12px;color:#9E9EA0;text-wrap:pretty\">{{ h.desc }}<\u002Fspan><\u002Fspan>\n              <span style=\"flex:0 0 auto;font-size:9.5px;font-weight:700;letter-spacing:.08em;color:{{ h.tone }}\">{{ h.by }}<\u002Fspan>\n            <\u002Fli>\n          <\u002Fsc-for>\n        <\u002Fol>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"margin:32px 0 0;font-size:13px;color:#9E9EA0;max-width:74ch;text-wrap:pretty\">The line is not a handoff between two products — it is the point in the architecture where capability stops and authority begins.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section aria-label=\"Central design question\" style=\"max-width:1240px;margin:0 auto;padding:{{ secPad }}\">\n  <p style=\"margin:0 0 32px;font-size:11px;font-weight:600;letter-spacing:.14em;color:#6B6B6D\">THE CENTRAL DESIGN QUESTION<\u002Fp>\n  <p style=\"margin:0 0 32px;font-family:'Bebas Neue',sans-serif;font-size:{{ questionSize }};line-height:.92;letter-spacing:.005em;text-transform:uppercase;color:#111111;max-width:22ch;text-wrap:pretty\">How might we help people make consequential financial decisions with AI — without requiring them to blindly trust it?<\u002Fp>\n  <p style=\"margin:0;font-size:{{ leadSize }};line-height:1.5;color:#39393B;max-width:64ch;text-wrap:pretty\">This question became the north star for FINOS — influencing its decision architecture, AI interactions, approval model and auditability.<\u002Fp>\n<\u002Fsection>\n\n<section aria-label=\"Design principle\" style=\"border-top:1px solid #111111;max-width:1240px;margin:0 auto;padding:{{ secPad }}\">\n  <p style=\"margin:0 0 48px;font-family:'Bebas Neue',sans-serif;font-size:{{ h2Size }};line-height:.94;letter-spacing:.005em;text-transform:uppercase;color:#111111;max-width:20ch;text-wrap:pretty\">AI should increase decision capability — not remove decision agency.<\u002Fp>\n  <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:16px\">\n    <sc-for list=\"{{ equation }}\" as=\"e\" hint-placeholder-count=\"7\">\n      <span style=\"{{ e.style }}\">{{ e.t }}<\u002Fspan>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<div style='max-width:1240px;margin:0 auto;padding:0 24px 96px'><p style='margin:0 0 18px;font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#111'>The money layer FINOS reasons over<\u002Fp><figure style='margin:0'><div style='border-radius:20px;overflow:hidden;box-shadow:0 50px 110px -48px rgba(17,17,17,.5);background:#0b0b0c'><img src='assets/img/finos/mock-cashflow.jpg' alt='FINOS Cash Flow view with income versus expenses bars and asset breakdown, on a dark ribbed stage' loading='lazy' style='display:block;width:100%;height:auto'/><\u002Fdiv><figcaption style='margin-top:14px;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#6B6B6D'>Mockup 02 — Cash Flow · income, spending and momentum in one read<\u002Ffigcaption><\u002Ffigure><\u002Fdiv>\n\n<!-- ============ 05 RESEARCH ============ -->\n<section id=\"ch05\" data-screen-label=\"05 Research\" style=\"max-width:1240px;margin:0 auto;padding:{{ secPad }}\">\n  <p style=\"margin:0 0 24px;font-size:11px;font-weight:600;letter-spacing:.14em;color:#6B6B6D\">05 — RESEARCH<\u002Fp>\n  <h2 style=\"margin:0 0 32px;font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:{{ h2Size }};line-height:.94;letter-spacing:.005em;text-transform:uppercase;max-width:22ch;text-wrap:pretty\">Before designing the system, I needed to understand the decision.<\u002Fh2>\n  <div style=\"display:grid;grid-template-columns:{{ twoCol }};gap:48px;margin-bottom:64px\">\n    <div>\n      <p style=\"margin:0 0 24px;font-size:{{ leadSize }};line-height:1.5;color:#111111;text-wrap:pretty\">Rather than starting with a dashboard or a set of AI features, I framed the research around how people understand financial situations, evaluate consequential decisions and decide whether an AI recommendation deserves their trust.<\u002Fp>\n      <div style=\"border-left:3px solid #111111;padding-left:16px\">\n        <p style=\"margin:0 0 8px;font-size:13.5px;line-height:1.55;color:#111111;text-wrap:pretty\">FINOS used exploratory, self-initiated research to identify recurring decision-making needs and inform the product direction.<\u002Fp>\n        <p style=\"margin:0;font-size:13px;line-height:1.55;color:#39393B;text-wrap:pretty\">This research was directional rather than statistically representative. The goal was to generate and prioritise design hypotheses, not to establish population-level conclusions.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-wrap:wrap;gap:12px;align-items:center;align-content:flex-start\">\n      <span style=\"font-size:11px;font-weight:600;letter-spacing:.1em;color:#111111;border:1px solid #E5E5E5;border-radius:999px;padding:8px 16px\">THE PROBLEM<\u002Fspan>\n      <span aria-hidden=\"true\" style=\"color:#CACACB\">→<\u002Fspan>\n      <span style=\"font-size:11px;font-weight:600;letter-spacing:.1em;color:#111111;border:1px solid #E5E5E5;border-radius:999px;padding:8px 16px\">THE QUESTIONS<\u002Fspan>\n      <span aria-hidden=\"true\" style=\"color:#CACACB\">→<\u002Fspan>\n      <span style=\"font-size:11px;font-weight:600;letter-spacing:.1em;color:#111111;border:1px solid #E5E5E5;border-radius:999px;padding:8px 16px\">THE RESEARCH<\u002Fspan>\n      <span aria-hidden=\"true\" style=\"color:#CACACB\">→<\u002Fspan>\n      <span style=\"font-size:11px;font-weight:600;letter-spacing:.1em;color:#FFFFFF;background:#111111;border-radius:999px;padding:8px 16px\">THE EVIDENCE<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <h3 style=\"margin:0 0 8px;font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:{{ h3Size }};line-height:1;text-transform:uppercase\">I wanted to answer seven questions.<\u002Fh3>\n  <p style=\"margin:0 0 24px;font-size:13.5px;color:#6B6B6D\">Select a question to see the research intent behind it.<\u002Fp>\n  <div style=\"border-bottom:1px solid #E5E5E5;margin-bottom:64px\">\n    <sc-for list=\"{{ rqs }}\" as=\"q\" hint-placeholder-count=\"7\">\n      <div>\n        <button sc-camel-on-click=\"{{ q.toggle }}\" aria-expanded=\"{{ q.expanded }}\" style=\"{{ q.rowStyle }}\">\n          <span style=\"{{ q.numStyle }}\">{{ q.n }}<\u002Fspan>\n          <span style=\"{{ q.qStyle }}\">{{ q.q }}<\u002Fspan>\n          <span aria-hidden=\"true\" style=\"{{ q.signStyle }}\">+<\u002Fspan>\n        <\u002Fbutton>\n        <sc-if value=\"{{ q.open }}\">\n          <div style=\"background:#F5F5F5;padding:0 8px 24px;display:grid;grid-template-columns:{{ twoCol }};gap:24px\">\n            <p style=\"margin:0;font-size:11px;font-weight:600;letter-spacing:.1em;color:#6B6B6D\">{{ q.tag }}<\u002Fp>\n            <p style=\"margin:0;font-size:14.5px;line-height:1.55;color:#111111;text-wrap:pretty\">{{ q.intent }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n\n  <h3 style=\"margin:0 0 16px;font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:{{ h3Size }};line-height:1;text-transform:uppercase;max-width:24ch\">An exploratory, decision-focused research approach.<\u002Fh3>\n  <p style=\"margin:0 0 32px;font-size:{{ leadSize }};line-height:1.5;color:#39393B;max-width:70ch;text-wrap:pretty\">I combined exploratory research, product and competitive analysis, financial decision scenarios and structured usability evaluation to investigate the problem space and stress-test the emerging FINOS concept.<\u002Fp>\n  <div style=\"display:grid;grid-template-columns:{{ methodGrid }};gap:16px;margin-bottom:24px\">\n    <sc-for list=\"{{ methods }}\" as=\"m\" hint-placeholder-count=\"4\">\n      <div style=\"border:1px solid #E5E5E5;border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:8px\">\n        <span style=\"font-family:'Bebas Neue',sans-serif;font-size:26px;line-height:1;color:#CACACB\">{{ m.n }}<\u002Fspan>\n        <p style=\"margin:0;font-size:11px;font-weight:600;letter-spacing:.1em;color:#111111;text-transform:uppercase\">{{ m.label }}<\u002Fp>\n        <p style=\"margin:0;flex:1 1 auto;font-size:13px;line-height:1.5;color:#39393B;text-wrap:pretty\">{{ m.desc }}<\u002Fp>\n        <span style=\"align-self:flex-start;font-size:10px;font-weight:600;letter-spacing:.08em;color:#6B6B6D;border:1px solid #E5E5E5;border-radius:999px;padding:4px 12px\">{{ m.tag }}<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n  <p style=\"margin:0 0 64px;border-left:3px solid #CACACB;padding-left:16px;font-size:12.5px;line-height:1.55;color:#6B6B6D;max-width:80ch;text-wrap:pretty\">This was exploratory, self-initiated research. It is not a statistically representative study: there are no recruited panels, survey samples or population-level claims behind it. Findings below are labelled as exploratory, directional or prototype evaluation so their weight is clear.<\u002Fp>\n\n  <div style=\"border:1px solid #E5E5E5;border-radius:14px;padding:{{ diagramPad }}\">\n    <p style=\"margin:0 0 24px;font-size:11px;font-weight:600;letter-spacing:.14em;color:#6B6B6D\">THE ANALYSIS FRAMEWORK<\u002Fp>\n    <div style=\"display:grid;grid-template-columns:{{ lensGrid }};gap:16px;margin-bottom:24px\">\n      <sc-for list=\"{{ lenses }}\" as=\"l\" hint-placeholder-count=\"4\">\n        <div style=\"border-top:2px solid #111111;padding-top:16px\">\n          <p style=\"margin:0 0 8px;font-family:'Bebas Neue',sans-serif;font-size:28px;line-height:1;text-transform:uppercase\">{{ l.label }}<\u002Fp>\n          <p style=\"margin:0;font-size:13.5px;line-height:1.5;color:#39393B;text-wrap:pretty\">{{ l.q }}<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <p style=\"margin:0;font-size:14.5px;line-height:1.55;color:#111111;max-width:70ch;text-wrap:pretty\">These four lenses became the framework for analysing the research.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ 06 RESEARCH THEMES ============ -->\n<section id=\"ch06\" data-screen-label=\"06 Themes\" style=\"max-width:1240px;margin:0 auto;padding:{{ secPad }}\">\n  <p style=\"margin:0 0 24px;font-size:11px;font-weight:600;letter-spacing:.14em;color:#6B6B6D\">06 — RESEARCH THEMES<\u002Fp>\n  <h2 style=\"margin:0 0 64px;font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:{{ h2Size }};line-height:.94;letter-spacing:.005em;text-transform:uppercase;max-width:20ch;text-wrap:pretty\">Four patterns shaped the direction of FINOS.<\u002Fh2>\n\n  <!-- THEME 01 -->\n  <div data-reveal=\"1\" style=\"border-top:2px solid #111111;padding-top:24px;margin-bottom:64px\">\n    <div style=\"display:grid;grid-template-columns:{{ probGrid }};gap:{{ probGap }};align-items:start\">\n      <div>\n        <p style=\"margin:0 0 12px;font-size:11px;font-weight:600;letter-spacing:.14em;color:#6B6B6D\">THEME 01<\u002Fp>\n        <h3 style=\"margin:0 0 16px;font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:{{ h3Size }};line-height:1;text-transform:uppercase\">Financial context is fragmented.<\u002Fh3>\n        <p style=\"margin:0 0 24px;font-size:14.5px;line-height:1.55;color:#39393B;text-wrap:pretty\">Financial decisions require people to connect information across accounts, transactions, investments, bills, goals and future commitments.<\u002Fp>\n        <div style=\"border-left:3px solid #CACACB;padding-left:16px;margin-bottom:16px\">\n          <p style=\"margin:0 0 6px;font-size:10.5px;font-weight:600;letter-spacing:.1em;color:#6B6B6D\">RESEARCH INTERPRETATION<\u002Fp>\n          <p style=\"margin:0;font-size:13.5px;line-height:1.5;color:#111111;text-wrap:pretty\">The difficulty is not finding individual pieces of information. It is constructing a coherent picture from them.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"border-left:3px solid #111111;padding-left:16px;margin-bottom:16px\">\n          <p style=\"margin:0 0 6px;font-size:10.5px;font-weight:600;letter-spacing:.1em;color:#6B6B6D\">INSIGHT<\u002Fp>\n          <p style=\"margin:0;font-size:13.5px;line-height:1.5;color:#111111;text-wrap:pretty\">Users need the system to establish context before asking them to make a decision.<\u002Fp>\n        <\u002Fdiv>\n        <p style=\"margin:0;display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:600;letter-spacing:.06em;color:#FFFFFF;background:#111111;border-radius:999px;padding:8px 16px\">DESIGN IMPLICATION · BUILD A UNIFIED FINANCIAL CONTEXT<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"border:1px solid #E5E5E5;border-radius:14px;padding:{{ diagramPad }};background:#FAFAFA\">\n        <div style=\"display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px\">\n          <sc-for list=\"{{ sources }}\" as=\"s\" hint-placeholder-count=\"7\">\n            <span style=\"font-size:11px;font-weight:600;letter-spacing:.06em;color:#39393B;background:#FFFFFF;border:1px solid #CACACB;border-radius:999px;padding:6px 14px\">{{ s }}<\u002Fspan>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <p aria-hidden=\"true\" style=\"margin:0 0 20px;text-align:center;color:#CACACB;font-size:18px\">↓<\u002Fp>\n        <p style=\"margin:0 0 20px;text-align:center;font-family:'Bebas Neue',sans-serif;font-size:30px;line-height:1;text-transform:uppercase;color:#FFFFFF;background:#111111;border-radius:14px;padding:14px\">USER<\u002Fp>\n        <p aria-hidden=\"true\" style=\"margin:0 0 20px;text-align:center;color:#CACACB;font-size:18px\">↓<\u002Fp>\n        <p style=\"margin:0;text-align:center;font-family:'Bebas Neue',sans-serif;font-size:30px;line-height:1;text-transform:uppercase;color:#111111;border:1px dashed #6B6B6D;border-radius:14px;padding:14px\">MENTAL MODEL<\u002Fp>\n        <p style=\"margin:1
