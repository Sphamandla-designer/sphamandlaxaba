ight:600;letter-spacing:.06em;color:#FFFFFF;background:#111111;border-radius:999px;padding:8px 16px\">ANNOTATION · THE CHALLENGE IS PART OF THE RECORD, NOT EDITED OUT OF IT<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"border:1px solid #CACACB;border-radius:14px;overflow:hidden;background:#FFFFFF\">\n      <div style=\"border-bottom:1px solid #E5E5E5;padding:12px 20px;font-size:{{ frameHead }};font-weight:600;letter-spacing:.08em;color:#6B6B6D\">DECISION TRAIL · 14 AUG 2026<\u002Fdiv>\n      <div style=\"padding:20px;display:flex;flex-direction:column;gap:16px\">\n        <sc-for list=\"{{ trail }}\" as=\"t\" hint-placeholder-count=\"5\">\n          <div style=\"display:grid;grid-template-columns:52px 1fr;gap:16px;border-bottom:1px solid #EFEFEF;padding-bottom:16px\">\n            <span style=\"font-size:12px;font-variant-numeric:tabular-nums;color:#6B6B6D\">{{ t.time }}<\u002Fspan>\n            <div>\n              <p style=\"margin:0 0 4px;font-size:13.5px;font-weight:700;color:#111111\">{{ t.title }}<\u002Fp>\n              <p style=\"margin:0 0 4px;font-size:12.5px;line-height:1.45;color:#39393B;text-wrap:pretty\">{{ t.detail }}<\u002Fp>\n              <span style=\"font-size:11px;color:#6B6B6D\">{{ t.actor }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"border-top:2px solid #111111;padding-top:32px\">\n    <div style=\"display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:24px\">\n      <span style=\"font-size:11.5px;font-weight:600;letter-spacing:.06em;color:#111111;border:1px solid #CACACB;border-radius:999px;padding:8px 14px\">CONTEXT<\u002Fspan>\n      <span aria-hidden=\"true\" style=\"color:#CACACB\">→<\u002Fspan>\n      <span style=\"font-size:11.5px;font-weight:600;letter-spacing:.06em;color:#111111;border:1px solid #CACACB;border-radius:999px;padding:8px 14px\">MODEL<\u002Fspan>\n      <span aria-hidden=\"true\" style=\"color:#CACACB\">→<\u002Fspan>\n      <span style=\"font-size:11.5px;font-weight:600;letter-spacing:.06em;color:#111111;border:1px solid #CACACB;border-radius:999px;padding:8px 14px\">COMPARE<\u002Fspan>\n      <span aria-hidden=\"true\" style=\"color:#CACACB\">→<\u002Fspan>\n      <span style=\"font-size:11.5px;font-weight:600;letter-spacing:.06em;color:#111111;border:1px solid #CACACB;border-radius:999px;padding:8px 14px\">EXPLAIN<\u002Fspan>\n      <span aria-hidden=\"true\" style=\"color:#CACACB\">→<\u002Fspan>\n      <span style=\"font-size:11.5px;font-weight:600;letter-spacing:.06em;color:#FFFFFF;background:#111111;border-radius:999px;padding:8px 14px\">CHALLENGE<\u002Fspan>\n      <span aria-hidden=\"true\" style=\"color:#CACACB\">→<\u002Fspan>\n      <span style=\"font-size:11.5px;font-weight:600;letter-spacing:.06em;color:#111111;border:1px solid #CACACB;border-radius:999px;padding:8px 14px\">RECALCULATE<\u002Fspan>\n      <span aria-hidden=\"true\" style=\"color:#CACACB\">→<\u002Fspan>\n      <span style=\"font-size:11.5px;font-weight:600;letter-spacing:.06em;color:#111111;border:1px solid #CACACB;border-radius:999px;padding:8px 14px\">APPROVE<\u002Fspan>\n      <span aria-hidden=\"true\" style=\"color:#CACACB\">→<\u002Fspan>\n      <span style=\"font-size:11.5px;font-weight:600;letter-spacing:.06em;color:#111111;border:1px solid #CACACB;border-radius:999px;padding:8px 14px\">AUDIT<\u002Fspan>\n    <\u002Fdiv>\n    <p data-reveal=\"1\" style=\"margin:0;font-family:'Bebas Neue',sans-serif;font-size:{{ revealSize }};line-height:.9;letter-spacing:.005em;text-transform:uppercase;color:#111111;max-width:20ch;text-wrap:pretty\">FINOS turns a financial question into an inspectable decision.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<div style='max-width:1400px;margin:0 auto;padding:0 24px 110px'><figure style='margin:0'><div style='border-radius:20px;overflow:hidden;box-shadow:0 50px 110px -48px rgba(17,17,17,.5);background:#0b0b0c'><img src='assets/img/finos/mock-decision.jpg' alt='FINOS Decision Room asking whether a R1,500,000 property purchase compromises financial goals, with assessment and balanced recommendation' loading='lazy' style='display:block;width:100%;height:auto'/><\u002Fdiv><figcaption style='margin-top:14px;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#6B6B6D'>Mockup 04 — Decision Room · the AI prepares, the person decides<\u002Ffigcaption><\u002Ffigure><\u002Fdiv>\n\n<!-- ============ 11 AI UX ============ -->\n<div style='max-width:1240px;margin:0 auto;padding:0 24px 96px'><p style='margin:0 0 18px;font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#111'>From the prototype — the hero decision journey<\u002Fp><div style='display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:28px'><figure style='margin:0'><div style='border:1px solid rgba(17,17,17,.14);border-radius:14px;overflow:hidden;box-shadow:0 30px 70px -38px rgba(17,17,17,.35);background:#fff'><img src='assets/img/finos/decision-room.jpg' alt='FINOS Decision Room assessing a R1,500,000 property purchase with assessment, key considerations and recommendation' loading='lazy' style='display:block;width:100%;height:auto'/><\u002Fdiv><figcaption style='margin-top:12px;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#6B6B6D'>Fig 04 — Decision Room · one consequential decision, fully framed<\u002Ffigcaption><\u002Ffigure><figure style='margin:0'><div style='border:1px solid rgba(17,17,17,.14);border-radius:14px;overflow:hidden;box-shadow:0 30px 70px -38px rgba(17,17,17,.35);background:#fff'><img src='assets/img/finos/scenarios.jpg' alt='FINOS Scenarios view comparing conservative, balanced and aggressive approaches' loading='lazy' style='display:block;width:100%;height:auto'/><\u002Fdiv><figcaption style='margin-top:12px;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#6B6B6D'>Fig 05 — Scenarios · trade-offs made comparable<\u002Ffigcaption><\u002Ffigure><\u002Fdiv><\u002Fdiv><section id=\"ch11\" data-screen-label=\"11 AI UX\" style=\"max-width:1240px;margin:0 auto;padding:{{ secPad }}\">\n  <p style=\"margin:0 0 24px;font-size:11px;font-weight:600;letter-spacing:.14em;color:#6B6B6D\">11 — AI UX<\u002Fp>\n  <h2 style=\"margin:0 0 32px;font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:{{ h2Size }};line-height:.94;letter-spacing:.005em;text-transform:uppercase;max-width:18ch;text-wrap:pretty\">The AI isn't the decision-maker.<\u002Fh2>\n  <p style=\"margin:0 0 24px;font-size:{{ leadSize }};line-height:1.5;color:#39393B;max-width:70ch;text-wrap:pretty\">The central AI UX challenge was deciding where AI should assist, where it should explain, and where the human must remain in control.<\u002Fp>\n  <div style=\"border:1px solid #111111;border-radius:14px;padding:20px;background:#FFFFFF;max-width:70ch;margin-bottom:64px\">\n    <p style=\"margin:0 0 8px;font-size:10.5px;font-weight:600;letter-spacing:.1em;color:#111111\">AI PROTOTYPE STATUS<\u002Fp>\n    <p style=\"margin:0;font-size:12.5px;line-height:1.5;color:#39393B;text-wrap:pretty\">FINOS explores the interaction model for AI-assisted financial decision-making. AI behaviour is simulated in the prototype and is not presented as a production AI system.<\u002Fp>\n  <\u002Fdiv>\n\n  <p style=\"margin:0 0 24px;font-size:11px;font-weight:600;letter-spacing:.14em;color:#6B6B6D\">RESPONSIBILITY MODEL<\u002Fp>\n  <div style=\"display:grid;grid-template-columns:{{ triGrid }};gap:16px;margin-bottom:64px\">\n    <div style=\"border:1px solid #E5E5E5;border-radius:14px;padding:20px\">\n      <p style=\"margin:0 0 16px;font-family:'Bebas Neue',sans-serif;font-size:30px;line-height:1;text-transform:uppercase;color:#111111\">AI<\u002Fp>\n      <div style=\"display:flex;flex-direction:column;gap:8px\">\n        <span style=\"font-size:13px;font-weight:600;color:#39393B;border:1px solid #E5E5E5;border-radius:999px;padding:10px 16px\">Understand<\u002Fspan>\n        <span style=\"font-size:13px;font-weight:600;color:#39393B;border:1px solid #E5E5E5;border-radius:999px;padding:10px 16px\">Analyse<\u002Fspan>\n        <span style=\"font-size:13px;font-weight:600;color:#39393B;border:1px solid #E5E5E5;border-radius:999px;padding:10px 16px\">Model<\u002Fspan>\n        <span style=\"font-size:13px;font-weight:600;color:#39393B;border:1px solid #E5E5E5;border-radius:999px;padding:10px 16px\">Recommend<\u002Fspan>\n        <span style=\"font-size:13px;font-weight:600;color:#39393B;border:1px solid #E5E5E5;border-radius:999px;padding:10px 16px\">Explain<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"border:1px solid #111111;border-radius:14px;padding:20px;background:#111111;color:#FFFFFF\">\n      <p style=\"margin:0 0 16px;font-family:'Bebas Neue',sans-serif;font-size:30px;line-height:1;text-transform:uppercase;color:#FFFFFF\">Human<\u002Fp>\n      <div style=\"display:flex;flex-direction:column;gap:8px\">\n        <span style=\"font-size:13px;font-weight:600;color:#FFFFFF;border:1px solid #2B2B2B;border-radius:999px;padding:10px 16px\">Review<\u002Fspan>\n        <span style=\"font-size:13px;font-weight:600;color:#FFFFFF;border:1px solid #2B2B2B;border-radius:999px;padding:10px 16px\">Question<\u002Fspan>\n        <span style=\"font-size:13px;font-weight:600;color:#FFFFFF;border:1px solid #2B2B2B;border-radius:999px;padding:10px 16px\">Challenge<\u002Fspan>\n        <span style=\"font-size:13px;font-weight:600;color:#FFFFFF;border:1px solid #2B2B2B;border-radius:999px;padding:10px 16px\">Approve<\u002Fspan>\n      <\u002Fdiv>\n      <p style=\"margin:16px 0 0;font-size:12px;line-height:1.5;color:#9E9EA0;text-wrap:pretty\">The human column is the only one that can authorise anything.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"border:1px solid #E5E5E5;border-radius:14px;padding:20px\">\n      <p style=\"margin:0 0 16px;font-family:'Bebas Neue',sans-serif;font-size:30px;line-height:1;text-transform:uppercase;color:#111111\">System<\u002Fp>\n      <div style=\"display:flex;flex-direction:column;gap:8px\">\n        <span style=\"font-size:13px;font-weight:600;color:#39393B;border:1px solid #E5E5E5;border-radius:999px;padding:10px 16px\">Execute<\u002Fspan>\n        <span style=\"font-size:13px;font-weight:600;color:#39393B;border:1px solid #E5E5E5;border-radius:999px;padding:10px 16px\">Record<\u002Fspan>\n      <\u002Fdiv>\n      <p style=\"margin:16px 0 0;font-size:12px;line-height:1.5;color:#6B6B6D;text-wrap:pretty\">Executes only what was approved, and writes what happened.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:{{ roleGrid }};gap:16px;margin-bottom:64px\">\n    <sc-for list=\"{{ aiRoles }}\" as=\"r\" hint-placeholder-count=\"3\">\n      <div style=\"{{ r.style }}\">\n        <p style=\"{{ r.labelStyle }}\">{{ r.label }}<\u002Fp>\n        <div style=\"display:flex;flex-direction:column;gap:12px\">\n          <sc-for list=\"{{ r.items }}\" as=\"i\" hint-placeholder-count=\"6\">\n            <div style=\"display:flex;gap:12px;align-items:flex-start\">\n              <span aria-hidden=\"true\" style=\"color:{{ i.markTone }};font-size:12px;line-height:1.4\">{{ i.mark }}<\u002Fspan>\n              <span style=\"{{ r.itemStyle }}\">{{ i.t }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n\n  <p style=\"margin:0 0 24px;font-size:11px;font-weight:600;letter-spacing:.14em;color:#6B6B6D\">CONFIDENCE MODEL<\u002Fp>\n  <div style=\"display:grid;grid-template-columns:{{ triGrid }};gap:16px;margin-bottom:24px\">\n    <div style=\"border:1px solid #E5E5E5;border-radius:14px;padding:20px\">\n      <p style=\"margin:0 0 12px;font-size:11px;font-weight:600;letter-spacing:.06em;color:#111111;border:1px solid #CACACB;border-radius:999px;padding:5px 12px;display:inline-block\">HIGH CONFIDENCE<\u002Fp>\n      <p style=\"margin:0;font-size:13px;line-height:1.5;color:#39393B;text-wrap:pretty\">Every supporting factor holds and nothing counted against the recommendation.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"border:1px solid #E5E5E5;border-radius:14px;padding:20px\">\n      <p style=\"margin:0 0 12px;font-size:11px;font-weight:600;letter-spacing:.06em;color:#111111;border:1px solid #CACACB;border-radius:999px;padding:5px 12px;display:inline-block\">MODERATE CONFIDENCE<\u002Fp>\n      <p style=\"margin:0;font-size:13px;line-height:1.5;color:#39393B;text-wrap:pretty\">FINOS still recommends, but at least one risk is carried — and it is named.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"border:1px solid #E5E5E5;border-radius:14px;padding:20px\">\n      <p style=\"margin:0 0 12px;font-size:11px;font-weight:600;letter-spacing:.06em;color:#111111;border:1px solid #CACACB;border-radius:999px;padding:5px 12px;display:inline-block\">NOT ENOUGH INFORMATION<\u002Fp>\n      <p style=\"margin:0;font-size:13px;line-height:1.5;color:#39393B;text-wrap:pretty\">FINOS declines to assess, states what is missing and what would improve confidence.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <p style=\"margin:0 0 64px;border-left:3px solid #111111;padding-left:16px;font-size:14.5px;line-height:1.55;color:#111111;max-width:80ch;text-wrap:pretty\">Confidence is not the same as trust. It is a signal that helps users understand how strongly FINOS can support its recommendation — which is why it always appears next to the reasoning, never on its own.<\u002Fp>\n\n  <p style=\"margin:0 0 24px;font-size:11px;font-weight:600;letter-spacing:.14em;color:#6B6B6D\">DECISION RATIONALE · ANNOTATED<\u002Fp>\n  <div style=\"display:grid;grid-template-columns:{{ stepGrid }};gap:{{ probGap }};margin-bottom:64px;align-items:start\">\n    <div style=\"display:flex;flex-direction:column;gap:12px\">\n      <div style=\"display:flex;gap:12px;border-top:1px solid #CACACB;padding-top:12px\"><span style=\"font-family:'Bebas Neue',sans-serif;font-size:22px;line-height:1;color:#CACACB\">01<\u002Fspan><span style=\"font-size:13.5px;line-height:1.45;color:#111111;text-wrap:pretty\"><strong>Why<\u002Fstrong> — the position FINOS is taking, in one line.<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;gap:12px;border-top:1px solid #CACACB;padding-top:12px\"><span style=\"font-family:'Bebas Neue',sans-serif;font-size:22px;line-height:1;color:#CACACB\">02<\u002Fspan><span style=\"font-size:13.5px;line-height:1.45;color:#111111;text-wrap:pretty\"><strong>Evidence<\u002Fstrong> — the figures that produced it, not adjectives.<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;gap:12px;border-top:1px solid #CACACB;padding-top:12px\"><span style=\"font-family:'Bebas Neue',sans-serif;font-size:22px;line-height:1;color:#CACACB\">03<\u002Fspan><span style=\"font-size:13.5px;line-height:1.45;color:#111111;text-wrap:pretty\"><strong>Assumptions<\u002Fstrong> — what would have to stay true.<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;gap:12px;border-top:1px solid #CACACB;padding-top:12px\"><span style=\"font-family:'Bebas Neue',sans-serif;font-size:22px;line-height:1;color:#CACACB\">04<\u002Fspan><span style=\"font-size:13.5px;line-height:1.45;color:#111111;text-wrap:pretty\"><strong>Risks<\u002Fstrong> — stated by FINOS against its own recommendation.<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;gap:12px;border-top:1px solid #CACACB;padding-top:12px\"><span style=\"font-family:'Bebas Neue',sans-serif;font-size:22px;line-height:1;color:#CACACB\">05<\u002Fspan><span style=\"font-size:13.5px;line-height:1.45;color:#111111;text-wrap:pretty\"><strong>Alternatives<\u002Fstrong> — what the other options would cost instead.<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;gap:12px;border-top:1px solid #CACACB;padding-top:12px\"><span style=\"font-family:'Bebas Neue',sans-serif;font-size:22px;line-height:1;color:#CACACB\">06<\u002Fspan><span style=\"font-size:13.5px;line-height:1.45;color:#111111;text-wrap:pretty\"><strong>Confidence<\u002Fstrong> — how strongly the reasoning holds together.<\u002Fspan><\u002Fdiv>\n      <p style=\"margin:12px 0 0;display:inline-flex;align-self:flex-start;font-size:12px;font-weight:600;letter-spacing:.06em;color:#FFFFFF;background:#111111;border-radius:999px;padding:8px 16px\">TURNS AI OUTPUT INTO SOMETHING USERS CAN INSPECT<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"border:1px solid #111111;border-radius:14px;overflow:hidden;background:#FFFFFF\">\n      <div style=\"background:#111111;color:#FFFFFF;padding:20px;display:flex;flex-wrap:wrap;gap:12px;align-items:baseline;justify-content:space-between\">\n        <span style=\"font-family:'Bebas Neue',sans-serif;font-size:30px;line-height:1;text-transform:uppercase\">Balanced approach<\u002Fspan>\n        <span style=\"font-size:11px;font-weight:600;letter-spacing:.06em;color:#111111;background:#FFFFFF;border-radius:999px;padding:5px 12px\">06 · MODERATE CONFIDENCE<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"padding:20px;display:flex;flex-direction:column;gap:16px;font-size:13px\">\n        <div><p style=\"margin:0 0 4px;font-size:10px;font-weight:600;letter-spacing:.08em;color:#9E9EA0\">01 · WHY<\u002Fp><p style=\"margin:0;line-height:1.45;color:#111111;text-wrap:pretty\">It keeps borrowing inside the ceiling while leaving the most invested.<\u002Fp><\u002Fdiv>\n        <div style=\"border-top:1px solid #EFEFEF;padding-top:16px\"><p style=\"margin:0 0 4px;font-size:10px;font-weight:600;letter-spacing:.08em;color:#9E9EA0\">02 · EVIDENCE<\u002Fp><p style=\"margin:0;line-height:1.45;color:#111111;text-wrap:pretty\">80% borrowed · R11,217 monthly surplus · R1,640,200 left invested.<\u002Fp><\u002Fdiv>\n        <div style=\"border-top:1px solid #EFEFEF;padding-top:16px\"><p style=\"margin:0 0 4px;font-size:10px;font-weight:600;letter-spacing:.08em;color:#9E9EA0\">03 · ASSUMPTIONS<\u002Fp><p style=\"margin:0;line-height:1.45;color:#111111;text-wrap:pretty\">10.75% rate · 20-year term · 6.0-month reserve target · deposit funded from the portfolio.<\u002Fp><\u002Fdiv>\n        <div style=\"border-top:1px solid #EFEFEF;padding-top:16px\"><p style=\"margin:0 0 4px;font-size:10px;font-weight:600;letter-spacing:.08em;color:#9E9EA0\">04 · RISKS<\u002Fp><p style=\"margin:0;line-height:1.45;color:#111111;text-wrap:pretty\">Cash cover reaches 5.5 of 6.0 months — a R35,896 shortfall.<\u002Fp><\u002Fdiv>\n        <div style=\"border-top:1px solid #EFEFEF;padding-top:16px\"><p style=\"margin:0 0 4px;font-size:10px;font-weight:600;letter-spacing:.08em;color:#9E9EA0\">05 · ALTERNATIVES<\u002Fp><p style=\"margin:0;line-height:1.45;color:#111111;text-wrap:pretty\">Conservative R11,574/month at 76% · Aggressive breaks the ceiling at 84%.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"border-top:2px solid #111111;padding-top:24px;margin-bottom:64px\">\n    <h3 style=\"margin:0 0 24px;font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:{{ h3Size }};line-height:1;text-transform:uppercase\">AI recommendations should be challengeable.<\u002Fh3>\n    <div style=\"display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:24px\">\n      <span style=\"font-size:11.5px;font-weight:600;letter-spacing:.06em;color:#111111;border:1px solid #CACACB;border-radius:999px;padding:8px 14px\">RECOMMENDATION<\u002Fspan>\n      <span aria-hidden=\"true\" style=\"color:#CACACB\">→<\u002Fspan>\n      <span style=\"font-size:11.5px;font-weight:600;letter-spacing:.06em;color:#FFFFFF;background:#111111;border-radius:999px;padding:8px 14px\">CHALLENGE<\u002Fspan>\n      <span aria-hidden=\"true\" style=\"color:#CACACB\">→<\u002Fspan>\n      <span style=\"font-size:11.5px;font-weight:600;letter-spacing:.06em;color:#111111;border:1px solid #CACACB;border-radius:999px;padding:8px 14px\">CHANGE ASSUMPTION<\u002Fspan>\n      <span aria-hidden=\"true\" style=\"color:#CACACB\">→<\u002Fspan>\n      <span style=\"font-size:11.5px;font-weight:600;letter-spacing:.06em;color:#111111;border:1px solid #CACACB;border-radius:999px;padding:8px 14px\">RECALCULATE<\u002Fspan>\n      <span aria-hidden=\"true\" style=\"color:#CACACB\">→<\u002Fspan>\n      <span style=\"font-size:11.5px;font-weight:600;letter-spacing:.06em;color:#111111;border:1px solid #CACACB;border-radius:999px;padding:8px 14px\">REVIEW<\u002Fspan>\n      <span aria-hidden=\"true\" style=\"color:#CACACB\">→<\u002Fspan>\n      <span style=\"font-size:11.5px;font-weight:600;letter-spacing:.06em;color:#111111;border:1px solid #CACACB;border-radius:999px;padding:8px 14px\">DECIDE<\u002Fspan>\n    <\u002Fdiv>\n    <p style=\"margin:0;font-size:{{ leadSize }};line-height:1.5;color:#111111;max-width:70ch;text-wrap:pretty\">The user doesn't have to choose between blindly accepting the AI and abandoning it. They can interrogate the model.<\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"background:#111111;color:#FFFFFF;border-radius:14px;padding:{{ diagramPad }}\">\n    <p data-reveal=\"1\" style=\"margin:0 0 32px;font-family:'Bebas Neue',sans-serif;font-size:{{ quoteSize }};line-height:.95;text-transform:uppercase;color:#FFFFFF\">AI prepares. Humans decide.<\u002Fp>\n    <div style=\"display:grid;grid-template-columns:{{ triGrid }};gap:16px\">\n      <div style=\"border:1px solid #2B2B2B;border-radius:14px;padding:20px\">\n        <p style=\"margin:0 0 8px;font-size:10.5px;font-weight:600;letter-spacing:.1em;color:#9E9EA0\">LOW CONSEQUENCE<\u002Fp>\n        <p style=\"margin:0;font-family:'Bebas Neue',sans-serif;font-size:26px;line-height:1;text-transform:uppercase;color:#FFFFFF\">Automation<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"border:1px solid #2B2B2B;border-radius:14px;padding:20px\">\n        <p style=\"margin:0 0 8px;font-size:10.5px;font-weight:600;letter-spacing:.1em;color:#9E9EA0\">MEDIUM CONSEQUENCE<\u002Fp>\n        <p style=\"margin:0;font-family:'Bebas Neue',sans-serif;font-size:26px;line-height:1;text-transform:uppercase;color:#FFFFFF\">Review<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"border:1px solid #FFFFFF;border-radius:14px;padding:20px;background:#1B1B1B\">\n        <p style=\"margin:0 0 8px;font-size:10.5px;font-weight:600;letter-spacing:.1em;color:#9E9EA0\">HIGH CONSEQUENCE<\u002Fp>\n        <p style=\"margin:0;font-family:'Bebas Neue',sans-serif;font-size:26px;line-height:1;text-transform:uppercase;color:#FFFFFF\">Approval<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<div style='max-width:1240px;margin:0 auto;padding:0 24px 96px'><p style='margin:0 0 18px;font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#111'>The evidence behind the decisions<\u002Fp><div style='display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:28px'><figure style='margin:0'><div style='border-radius:20px;overflow:hidden;box-shadow:0 50px 110px -48px rgba(17,17,17,.5);background:#0b0b0c'><img src='assets/img/finos/mock-transactions.jpg' alt='FINOS Transactions list with AI review chips and category filters' loading='lazy' style='display:block;width:100%;height:auto'/><\u002Fdiv><figcaption style='margin-top:14px;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#6B6B6D'>Mockup 05 — Transactions · every line item, AI-reviewed<\u002Ffigcaption><\u002Ffigure><figure style='margin:0'><div style='border-radius:20px;overflow:hidden;box-shadow:0 50px 110px -48px rgba(17,17,17,.5);background:#0b0b0c'><img src='assets/img/finos/mock-risk.jpg' alt='FINOS Portfolio Risk view showing concentration, volatility, liquidity and equity exposure by sector' loading='lazy' style='display:block;width:100%;height:auto'/><\u002Fdiv><figcaption style='margin-top:14px;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#6B6B6D'>Mockup 06 — Portfolio Risk · one factor outside preferred range<\u002Ffigcaption><\u002Ffigure><\u002Fdiv><\u002Fdiv>\n\n<!-- ============ 12 KEY DESIGN DECISIONS ============ -->\n<div style='max-width:1240px;margin:0 auto;padding:0 24px 96px'><p style='margin:0 0 18px;font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#111'>From the prototype — where the AI lives<\u002Fp><div style='display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:28px'><figure style='margin:0'><div style='border:1px solid rgba(17,17,17,.14);border-radius:14px;overflow:hidden;box-shadow:0 30px 70px -38px rgba(17,17,17,.35);background:#fff'><img src='assets/img/finos/ask.jpg' alt='Ask FINOS conversational interface answering financial questions with sourced context' loading='lazy' style='display:block;width:100%;height:auto'/><\u002Fdiv><figcaption style='margin-top:12px;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#6B6B6D'>Fig 06 — Ask FINOS · answers with context, not commands<\u002Ffigcaption><\u002Ffigure><figure style='margin:0'><div style='border:1px solid rgba(17,17,17,.14);border-radius:14px;overflow:hidden;box-shadow:0 30px 70px -38px rgba(17,17,17,.35);background:#fff'><img src='assets/img/finos/insights.jpg' alt='FINOS Insights view surfacing patterns that need attention' loading='lazy' style='display:block;width:100%;height:auto'/><\u002Fdiv><figcaption style='margin-top:12px;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#6B6B6D'>Fig 07 — Insights · the system explains what it noticed<\u002Ffigcaption><\u002Ffigure><\u002Fdiv><\u002Fdiv><section id=\"ch12\" data-screen-label=\"12 Decisions\" style=\"background:#F5F5F5;padding:{{ secPad }}\">\n  <div style=\"max-width:1240px;margin:0 auto\">\n    <p style=\"margin:0 0 24px;font-size:11px;font-weight:600;letter-spacing:.14em;color:#6B6B6D\">12 — KEY DESIGN DECISIONS<\u002Fp>\n    <h2 style=\"margin:0 0 32px;font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:{{ h2Size }};line-height:.94;letter-spacing:.005em;text-transform:uppercase;max-width:22ch;text-wrap:pretty\">The interface was the output. The decision model was the design.<\u002Fh2>\n    <p style=\"margin:0 0 32px;font-size:13.5px;color:#6B6B6D\">Select a decision to see the problem, the call I made, the design response and the outcome.<\u002Fp>\n\n    <div style=\"display:flex;flex-direction:column;gap:16px;margin-bottom:64px\">\n      <sc-for list=\"{{ dds }}\" as=\"d\" hint-placeholder-count=\"6\">\n        <div style=\"{{ d.cardStyle }}\">\n          <button sc-camel-on-click=\"{{ d.toggle }}\" aria-expanded=\"{{ d.expanded }}\" style=\"{{ d.headStyle }}\">\n            <span style=\"display:flex;gap:16px;align-items:baseline\">\n              <span style=\"font-family:'Bebas Neue',sans-serif;font-size:26px;line-height:1;color:#CACACB\">{{ d.n }}<\u002Fspan>\n              <span style=\"{{ d.titleStyle }}\">{{ d.title }}<\u002Fspan>\n            <\u002Fspan>\n            <span aria-hidden=\"true\" style=\"font-size:18px;color:#6B6B6D\">+<\u002Fspan>\n          <\u002Fbutton>\n          <sc-if value=\"{{ d.open }}\">\n            <div style=\"padding:0 24px 24px;display:grid;grid-template-columns:{{ twoCol }};gap:24px\">\n              <div style=\"display:flex;flex-direction:column;gap:16px\">\n                <div>\n                  <p style=\"margin:0 0 4px;font-size:10px;font-weight:600;letter-spacing:.08em;color:#9E9EA0\">PROBLEM<\u002Fp>\n                  <p style=\"margin:0;font-size:13.5px;line-height:1.5;color:#111111;text-wrap:pretty\">{{ d.prob }}<\u002Fp>\n                <\u002Fdiv>\n                <div>\n                  <p style=\"margin:0 0 4px;font-size:10px;font-weight:600;letter-spacing:.08em;color:#9E9EA0\">DECISION<\u002Fp>\n                  <p style=\"margin:0;font-size:13.5px;line-height:1.5;color:#111111;text-wrap:pretty\">{{ d.dec }}<\u002Fp>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:16px\">\n                <div style=\"border-left:3px solid #111111;padding-left:16px\">\n                  <p style=\"margin:0 0 4px;font-size:10px;font-weight:600;letter-spacing:.08em;color:#6B6B6D\">DESIGN RESPONSE<\u002Fp>\n                  <p style=\"margin:0;font-size:14px;font-weight:600;line-height:1.5;color:#111111;text-wrap:pretty\">{{ d.resp }}<\u002Fp>\n                <\u002Fdiv>\n                <div>\n                  <p style=\"margin:0 0 4px;font-size:10px;font-weight:600;letter-spacing:.08em;color:#9E9EA0\">OUTCOME<\u002Fp>\n                  <p style=\"margin:0;font-size:13.5px;line-height:1.5;color:#39393B;text-wrap:pretty\">{{ d.out }}<\u002Fp>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <p style=\"margin:0 0 24px;font-size:11px;font-weight:600;letter-spacing:.14em;color:#6B6B6D\">RESEARCH → PRINCIPLE → PRODUCT DECISION → INTERACTION → OUTCOME<\u002Fp>\n    <div style=\"display:grid;grid-template-columns:{{ chainGrid }};gap:16px;margin-bottom:64px\">\n      <sc-for list=\"{{ ddChain }}\" as=\"c\" hint-placeholder-count=\"6\">\n        <div style=\"border:1px solid #CACACB;border-radius:14px;padding:20px;background:#FFFFFF;display:flex;flex-direction:column;gap:12px\">\n          <span style=\"font-family:'Bebas Neue',sans-serif;font-size:22px;line-height:1;color:#CACACB\">{{ c.n }}<\u002Fspan>\n          <div>\n            <p style=\"margin:0 0 4px;font-size:10px;font-weight:600;letter-spacing:.08em;color:#9E9EA0\">RESEARCH THEME<\u002Fp>\n            <p style=\"margin:0;font-size:12.5px;line-height:1.4;color:#39393B;text-wrap:pretty\">{{ c.theme }}<\u002Fp>\n          <\u002Fdiv>\n          <div>\n            <p style=\"margin:0 0 4px;font-size:10px;font-weight:600;letter-spacing:.08em;color:#9E9EA0\">PRINCIPLE<\u002Fp>\n            <p style=\"margin:0;font-size:12.5px;line-height:1.4;color:#39393B;text-wrap:pretty\">{{ c.principle }}<\u002Fp>\n          <\u002Fdiv>\n          <div>\n            <p style=\"margin:0 0 4px;font-size:10px;font-weight:600;letter-spacing:.08em;color:#9E9EA0\">INTERACTION<\u002Fp>\n            <p style=\"margin:0;font-size:13px;font-weight:700;line-height:1.4;color:#111111;text-wrap:pretty\">{{ c.resp }}<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"border-top:1px solid #EFEFEF;padding-top:12px;margin-top:auto\">\n            <p style=\"margin:0 0 4px;font-size:10px;font-weight:600;letter-spacing:.08em;color:#9E9EA0\">OUTCOME<\u002Fp>\n            <p style=\"margin:0;font-size:12.5px;line-height:1.4;color:#39393B;text-wrap:pretty\">{{ c.out }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <div style=\"border-top:2px solid #111111;padding-top:32px\">\n      <p data-reveal=\"1\" style=\"margin:0 0 16px;font-family:'Bebas Neue',sans-serif;font-size:{{ quoteSize }};line-height:.95;text-transform:uppercase;color:#111111;max-width:20ch;text-wrap:pretty\">The strongest design decisions weren't visual decisions.<\u002Fp>\n      <p style=\"margin:0 0 32px;font-size:{{ leadSize }};line-height:1.5;color:#39393B;max-width:60ch;text-wrap:pretty\">They were decisions about how FINOS should behave.<\u002Fp>\n      <div style=\"display:flex;flex-wrap:wrap;gap:12px;align-items:center\">\n        <span style=\"font-family:'Bebas Neue',sans-serif;font-size:26px;line-height:1;text-transform:uppercase;color:#111111;border-bottom:2px solid #111111;padding-bottom:4px\">Context<\u002Fspan>\n        <span aria-hidden=\"true\" style=\"color:#CACACB;font-size:18px\">+<\u002Fspan>\n        <span style=\"font-family:'Bebas Neue',sans-serif;font-size:26px;line-height:1;text-transform:uppercase;color:#111111;border-bottom:2px solid #111111;padding-bottom:4px\">Scenarios<\u002Fspan>\n        <span aria-hidden=\"true\" style=\"color:#CACACB;font-size:18px\">+<\u002Fspan>\n        <span style=\"font-family:'Bebas Neue',sans-serif;font-size:26px;line-height:1;text-transform:uppercase;color:#111111;border-bottom:2px solid #111111;padding-bottom:4px\">Explanation<\u002Fspan>\n        <span aria-hidden=\"true\" style=\"color:#CACACB;font-size:18px\">+<\u002Fspan>\n        <span style=\"font-family:'Bebas Neue',sans-serif;font-size:26px;line-height:1;text-transform:uppercase;color:#111111;border-bottom:2px solid #111111;padding-bottom:4px\">Challenge<\u002Fspan>\n        <span aria-hidden=\"true\" style=\"color:#CACACB;font-size:18px\">+<\u002Fspan>\n        <span style=\"font-family:'Bebas Neue',sans-serif;font-size:26px;line-height:1;text-transform:uppercase;color:#111111;border-bottom:2px solid #111111;padding-bottom:4px\">Control<\u002Fspan>\n        <span aria-hidden=\"true\" style=\"color:#CACACB;font-size:18px\">+<\u002Fspan>\n        <span style=\"font-family:'Bebas Neue',sans-serif;font-size:26px;line-height:1;text-transform:uppercase;color:#111111;border-bottom:2px solid #111111;padding-bottom:4px\">Traceability<\u002Fspan>\n        <span aria-hidden=\"true\" style=\"color:#CACACB;font-size:18px\">=<\u002Fspan>\n        <span style=\"font-family:'Bebas Neue',sans-serif;font-size:32px;line-height:1;letter-spacing:.1em;text-transform:uppercase;color:#FFFFFF;background:#111111;padding:6px 16px;border-radius:999px\">FINOS<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n\n<div style=\"max-width:1240px;margin:0 auto;padding:0 {{ gutter }}\">\n  <div style=\"border-top:2px solid #111111;padding:24px 0;display:grid;grid-template-columns:{{ twoCol }};gap:24px;align-items:baseline\">\n    <p style=\"margin:0;font-size:10.5px;font-weight:600;letter-spacing:.1em;color:#6B6B6D\">PRODUCT ARCHITECTURE TAKEAWAY<\u002Fp>\n    <p style=\"margin:0;font-size:{{ leadSize }};line-height:1.45;color:#111111;max-width:60ch;text-wrap:pretty\">FINOS is structured around decisions rather than dashboards.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ============ 13 PROTOTYPE EVOLUTION ============ -->\n<div style='max-width:1240px;margin:0 auto;padding:0 24px 96px'><p style='margin:0 0 18px;font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#111'>From the prototype — decisions leave a trail<\u002Fp><div style='display:grid;gap:28px'><figure style='margin:0'><div style='border:1px solid rgba(17,17,17,.14);border-radius:14px;overflow:hidden;box-shadow:0 30px 70px -38px rgba(17,17,17,.35);background:#fff'><img src='assets/img/finos/history.jpg' alt='FINOS Decision History listing past decisions with their reasoning and status' loading='lazy' style='display:block;width:100%;height:auto'/><\u002Fdiv><figcaption style='margin-top:12px;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#6B6B6D'>Fig 08 — Decision History · every consequential choice stays accountable<\u002Ffigcaption><\u002Ffigure><\u002Fdiv><\u002Fdiv><section id=\"ch13\" data-screen-label=\"13 Prototype\" style=\"max-width:1240px;margin:0 auto;padding:{{ secPad }}\">\n  <p style=\"margin:0 0 24px;font-size:11px;font-weight:600;letter-spacing:.14em;color:#6B6B6D\">13 — PROTOTYPE EVOLUTION<\u002Fp>\n  <h2 style=\"margin:0 0 32px;font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:{{ h2Size }};line-height:.94;letter-spacing:.005em;text-transform:uppercase;max-width:20ch;text-wrap:pretty\">FINOS didn't arrive at V1.4.1 in one pass.<\u002Fh2>\n  <p style=\"margin:0 0 64px;font-size:{{ leadSize }};line-height:1.5;color:#39393B;max-width:70ch;text-wrap:pretty\">The product evolved through successive design iterations as the decision model became clearer, research surfaced new requirements and usability evaluation exposed friction.<\u002Fp>\n\n  <p style=\"margin:0 0 24px;font-size:11px;font-weight:600;letter-spacing:.14em;color:#6B6B6D\">VERSION TIMELINE · SELECT A VERSION<\u002Fp>\n  <div style=\"display:grid;grid-template-columns:{{ verGrid }};gap:16px;margin-bottom:24px\">\n    <sc-for list=\"{{ vers }}\" as=\"v\" hint-placeholder-count=\"6\">\n      <button sc-camel-on-click=\"{{ v.pick }}\" aria-expanded=\"{{ v.expanded }}\" style=\"{{ v.style }}\">\n        <span style=\"{{ v.vStyle }}\">{{ v.v }}<\u002Fspan>\n        <span style=\"{{ v.nameStyle }}\">{{ v.name }}<\u002Fspan>\n        <span style=\"{{ v.focusStyle }}\">{{ v.focus }}<\u002Fspan>\n      <\u002Fbutton>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n  <sc-if value=\"{{ hasVer }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"border:1px solid #111111;border-radius:14px;padding:{{ diagramPad }};margin-bottom:64px;background:#FFFFFF\">\n      <div style=\"display:grid;grid-template-columns:{{ twoCol }};gap:{{ probGap }};align-items:start\">\n        <div>\n          <p style=\"margin:0 0 8px;font-family:'Bebas Neue',sans-serif;font-size:40px;line-height:1;text-transform:uppercase;color:#111111\">{{ verOpen.v }}<\u002Fp>\n          <p style=\"margin:0 0 16px;font-size:11px;font-weight:600;letter-spacing:.1em;color:#6B6B6D\">{{ verOpen.name }}<\u002Fp>\n          <p style=\"margin:0;font-size:14.5px;line-height:1.55;color:#111111;text-wrap:pretty\">{{ verOpen.desc }}<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"border-left:3px solid #111111;padding-left:20px\">\n          <p style=\"margin:0 0 8px;font-size:10.5px;font-weight:600;letter-spacing:.1em;color:#6B6B6D\">{{ verOpen.noteLabel }}<\u002Fp>\n          <p style=\"margin:0;font-size:{{ leadSize }};line-height:1.5;color:#111111;text-wrap:pretty\">{{ verOpen.note }}<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <div style=\"display:grid;grid-template-columns:{{ twoCol }};gap:16px;margin-bottom:32px\">\n    <div style=\"border:1px solid #E5E5E5;border-radius:14px;padding:20px;background:#FAFAFA\">\n      <p style=\"margin:0 0 16px;font-size:10.5px;font-weight:600;letter-spacing:.1em;color:#6B6B6D\">EARLY FINOS<\u002Fp>\n      <div style=\"display:flex;flex-wrap:wrap;gap:8px\">\n        <span style=\"font-size:12.5px;font-weight:600;color:#39393B;border:1px solid #E5E5E5;border-radius:999px;padding:8px 14px\">Financial information<\u002Fspan>\n        <span style=\"font-size:12.5px;font-weight:600;color:#39393B;border:1px solid #E5E5E5;border-radius:999px;padding:8px 14px\">AI insights<\u002Fspan>\n        <span style=\"font-size:12.5px;font-weight:600;color:#39393B;border:1px solid #E5E5E5;border-radius:999px;padding:8px 14px\">Scenarios<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"border:1px solid #111111;border-radius:14px;padding:20px;background:#111111\">\n      <p style=\"margin:0 0 16px;font-size:10.5px;font-weight:600;letter-spacing:.1em;color:#9E9EA0\">EVOLVED FINOS<\u002Fp>\n      <div style=\"display:flex;flex-wrap:wrap;gap:8px\">\n        <span style=\"font-size:12.5px;font-weight:600;color:#FFFFFF;border:1px solid #2B2B2B;border-radius:999px;padding:8px 14px\">Context<\u002Fspan>\n        <span style=\"font-size:12.5px;font-weight:600;color:#FFFFFF;border:1px solid #2B2B2B;border-radius:999px;padding:8px 14px\">Scenarios<\u002Fspan>\n        <span style=\"font-size:12.5px;font-weight:600;color:#FFFFFF;border:1px solid #2B2B2B;border-radius:999px;padding:8px 14px\">Trade-offs<\u002Fspan>\n        <span style=\"font-size:12.5px;font-weight:600;color:#FFFFFF;border:1px solid #2B2B2B;border-radius:999px;padding:8px 14px\">AI reasoning<\u002Fspan>\n        <span style=\"font-size:12.5px;font-weight:600;color:#FFFFFF;border:1px solid #2B2B2B;border-radius:999px;padding:8px 14px\">Challengeability<\u002Fspan>\n        <span style=\"font-size:12.5px;font-weight:600;color:#FFFFFF;border:1px solid #2B2B2B;border-radius:999px;padding:8px 14px\">Human approval<\u002Fspan>\n        <span style=\"font-size:12.5px;font-weight:600;color:#FFFFFF;border:1px solid #2B2B2B;border-radius:999px;padding:8px 14px\">Auditability<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"margin-bottom:64px\">\n    <p data-reveal=\"1\" style=\"margin:0 0 16px;font-family:'Bebas Neue',sans-serif;font-size:{{ quoteSize }};line-height:.95;text-transform:uppercase;color:#111111;max-width:20ch;text-wrap:pretty\">The biggest evolution wasn't visual. It was conceptual.<\u002Fp>\n    <p style=\"margin:0;font-size:{{ leadSize }};line-height:1.5;color:#39393B;max-width:60ch;text-wrap:pretty\">FINOS evolved from an AI financial dashboard concept into a structured decision-support operating system.<\u002Fp>\n  <\u002Fdiv>\n\n  <p style=\"margin:0 0 24px;font-size:11px;font-weight:600;letter-spacing:.14em;color:#6B6B6D\">WHAT CHANGED — AND WHY<\u002Fp>\n  <div style=\"border:1px solid #CACACB;border-radius:14px;overflow:hidden;background:#FFFFFF\">\n    <div style=\"display:grid;grid-template-columns:{{ triGrid }};gap:16px;padding:12px 20px;border-bottom:1px solid #E5E5E5;background:#FAFAFA\">\n      <span style=\"font-size:10.5px;font-weight:600;letter-spacing:.08em;color:#6B6B6D\">PROBLEM / QUESTION<\u002Fspan>\n      <span style=\"font-size:10.5px;font-weight:600;letter-spacing:.08em;color:#6B6B6D\">DESIGN RESPONSE<\u002Fspan>\n      <span style=\"font-size:10.5px;font-weight:600;letter-spacing:.08em;color:#6B6B6D\">RESULT<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"padding:20px;display:flex;flex-direction:column;gap:16px\">\n      <div style=\"display:grid;grid-template-columns:{{ triGrid }};gap:16px;border-bottom:1px solid #EFEFEF;padding-bottom:16px\">\n        <span style=\"font-size:13px;color:#39393B\">Decision clarity<\u002Fspan><span style=\"font-size:13.5px;font-weight:600;color:#111111\">Structured Decision Room<\u002Fspan><span style=\"font-size:13px;color:#39393B\">A clearer decision workflow<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:{{ triGrid }};gap:16px;border-bottom:1px solid #EFEFEF;padding-bottom:16px\">\n        <span style=\"font-size:13px;color:#39393B\">AI trust<\u002Fspan><span style=\"font-size:13.5px;font-weight:600;color:#111111\">Decision Rationale<\u002Fspan><span style=\"font-size:13px;color:#39393B\">A more inspectable recommendation<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:{{ triGrid }};gap:16px;border-bottom:1px solid #EFEFEF;padding-bottom:16px\">\n        <span style=\"font-size:13px;color:#39393B\">Binary acceptance<\u002Fspan><span style=\"font-size:13.5px;font-weight:600;color:#111111\">Challenge interaction<\u002Fspan><span style=\"font-size:13px;color:#39393B\">Greater user control<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:{{ triGrid }};gap:16px;border-bottom:1px solid #EFEFEF;padding-bottom:16px\">\n        <span style=\"font-size:13px;color:#39393B\">Automation risk<\u002Fspan><span style=\"font-size:13.5px;font-weight:600;color:#111111\">Risk-proportional approval model<\u002Fspan><span style=\"font-size:13px;color:#39393B\">Human oversight where it matters<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:{{ triGrid }};gap:16px\">\n        <span style=\"font-size:13px;color:#39393B\">Accountability<\u002Fspan><span style=\"font-size:13.5px;font-weight:600;color:#111111\">Decision History and Audit<\u002Fspan><span style=\"font-size:13px;color:#39393B\">Traceability after the fact<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ 14 USABILITY EVALUATION ============ -->\n<div style='max-width:1240px;margin:0 auto;padding:0 24px 96px'><p style='margin:0 0 18px;font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#111'>Explore V1.4.1 yourself<\u002Fp><div style='border:1px solid rgba(17,17,17,.14);border-radius:14px;overflow:hidden;box-shadow:0 30px 70px -38px rgba(17,17,17,.35);background:#111'><div style='position:relative;padding-top:62%'><iframe src='finos-proto.html' title='FINOS interactive prototype - V1.4.1' loading='lazy' style='position:absolute;top:0;left:0;width:100%;height:100%;border:0'><\u002Fiframe><\u002Fdiv><\u002Fdiv><p style='margin:14px 0 0;font-size:12px;color:#6B6B6D'>The full interactive prototype, embedded live - use the sidebar to move between Command Center, Decision Room, Scenarios and Ask FINOS.<\u002Fp><a href='finos-proto.html' target='_blank' rel='noopener' style='display:inline-block;margin-top:16px;padding:13px 24px;background:#111;color:#fff;border-radius:999px;font-size:13px;font-weight:600;text-decoration:none'>Open the full prototype &#8599;<\u002Fa><\u002Fdiv><section id=\"ch14\" data-screen-label=\"14 Usability\" style=\"background:#F5F5F5;padding:{{ secPad }}\">\n  <div style=\"max-width:1240px;margin:0 auto\">\n    <p style=\"margin:0 0 24px;font-size:11px;font-weight:600;letter-spacing:.14em;color:#6B6B6D\">14 — USABILITY EVALUATION<\u002Fp>\n    <h2 style=\"margin:0 0 32px;font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:{{ h2Size }};line-height:.94;letter-spacing:.005em;text-transform:uppercase;max-width:22ch;text-wrap:pretty\">I needed to find out whether the decision model actually made sense.<\u002Fh2>\n    <div style=\"display:grid;grid-template-columns:{{ twoCol }};gap:48px;margin-bottom:64px;align-items:start\">\n      <p style=\"margin:0;font-size:{{ leadSize }};line-height:1.5;color:#111111;text-wrap:pretty\">After the core experience was established, I evaluated the prototype around the moments where misunderstanding would have the greatest consequence.<\u002Fp>\n      <div style=\"border:1px solid #CACACB;border-radius:14px;padding:20px;background:#FFFFFF\">\n        <p style=\"margin:0 0 8px;font-size:10.5px;font-weight:600;letter-spacing:.1em;color:#6B6B6D\">EXPLORATORY PROTOTYPE EVALUATION<\u002Fp>\n        <p style=\"margin:0 0 8px;font-size:12.5px;line-height:1.5;color:#39393B;text-wrap:pretty\">These findings should be interpreted as directional signals from prototype evaluation rather than statistically representative usability results.<\u002Fp>\n        <p style=\"margin:0;font-size:12.5px;line-height:1.5;color:#39393B;text-wrap:pretty\">No panel, no sample, no participant identities and no percentages. Each item below is labelled with the kind of evidence it rests on.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"border:1px solid #111111;border-radius:14px;padding:{{ diagramPad }};background:#111111;color:#FFFFFF;margin-bottom:24px\">\n      <p style=\"margin:0 0 16px;font-size:10.5px;font-weight:600;letter-spacing:.1em;color:#9E9EA0\">PRIMARY QUESTION<\u002Fp>\n      <p data-reveal=\"1\" style=\"margin:0;font-family:'Bebas Neue',sans-serif;font-size:{{ revealSize }};line-height:.95;letter-spacing:.005em;text-transform:uppercase;color:#FFFFFF;max-width:26ch;text-wrap:pretty\">Can a user understand, evaluate and challenge an AI-supported financial recommendation without losing a sense of control?<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:{{ taskGrid }};gap:16px;margin-bottom:64px\">\n      <sc-for list=\"{{ secqs }}\" as=\"q\" hint-placeholder-count=\"8\">\n        <div style=\"border-top:1px solid #CACACB;padding-top:12px;display:flex;gap:12px\">\n          <span style=\"font-family:'Bebas Neue',sans-serif;font-size:20px;line-height:1.1;color:#CACACB\">{{ q.n }}<\u002Fspan>\n          <span style=\"flex:1 1 auto;font-size:13px;line-height:1.45;color:#111111;text-wrap:pretty\">{{ q.q }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <p style=\"margin:0 0 24px;font-size:11px;font-weight:600;letter-spacing:.14em;color:#6B6B6D\">TEST SCENARIO · A DECISION TASK, NOT FINANCIAL ADVICE<\u002Fp>\n    <div style=\"display:grid;grid-template-columns:{{ twoCol }};gap:16px;margin-bottom:64px;align-items:start\">\n      <div style=\"border:1px solid #CACACB;border-radius:14px;padding:20px;background:#FFFFFF\">\n        <p style=\"margin:0 0 16px;font-size:15px;font-weight:700;color:#111111;text-wrap:pretty\">You're considering purchasing a R1.5M property.<\u002Fp>\n        <div style=\"display:flex;flex-direction:column;gap:8px;font-size:13px\">\n          <div style=\"display:flex;gap:16px;border-top:1px solid #EFEFEF;padding-top:8px\"><span style=\"flex:1 1 auto;color:#39393B\">Property price<\u002Fspan><span style=\"font-weight:600;font-variant-numeric:tabular-nums\">R1,500,000<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;gap:16px;border-top:1px solid #EFEFEF;padding-top:8px\"><span style=\"flex:1 1 auto;color:#39393B\">Down payment<\u002Fspan><span style=\"font-weight:600;font-variant-numeric:tabular-nums\">R300,000<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;gap:16px;border-top:1px solid #EFEFEF;padding-top:8px\"><span style=\"flex:1 1 auto;color:#39393B\">Loan<\u002Fspan><span style=\"font-weight:600;font-variant-numeric:tabular-nums\">R1,200,000<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;gap:16px;border-top:1px solid #EFEFEF;padding-top:8px\"><span style=\"flex:1 1 auto;color:#39393B\">Term<\u002Fspan><span style=\"font-weight:600;font-variant-numeric:tabular-nums\">20 years<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;gap:16px;border-top:1px solid #EFEFEF;padding-top:8px\"><span style=\"flex:1 1 auto;color:#39393B\">Emergency reserve<\u002Fspan><span style=\"font-weight:600;font-variant-numeric:tabular-nums\">6 months<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <p style=\"margin:0 0 16px;font-size:11px;font-weight:600;letter-spacing:.14em;color:#6B6B6D\">EVALUATION FRAMEWORK<\u002Fp>\n        <div style=\"display:flex;flex-direction:column;gap:12px\">\n          <div style=\"border-top:1px solid #CACACB;padding-top:12px\"><p style=\"margin:0 0 2px;font-family:'Bebas Neue',sans-serif;font-size:22px;line-height:1;text-transform:uppercase;color:#111111\">Understanding<\u002Fp><p style=\"margin:0;font-size:12.5px;color:#39393B\">Can users understand what the system is saying?<\u002Fp><\u002Fdiv>\n          <div style=\"border-top:1px solid #CACACB;padding-top:12px\"><p style=\"margin:0 0 2px;font-family:'Bebas Neue',sans-serif;font-size:22px;line-height:1;text-transform:uppercase;color:#111111\">Discoverability<\u002Fp><p style=\"margin:0;font-size:12.5px;color:#39393B\">Can users find the right action?<\u002Fp><\u002Fdiv>\n          <div style=\"border-top:1px solid #CACACB;padding-top:12px\"><p style=\"margin:0 0 2px;font-family:'Bebas Neue',sans-serif;font-size:22px;line-height:1;text-transform:uppercase;color:#111111\">Control<\u002Fp><p style=\"margin:0;font-size:12.5px;color:#39393B\">Can users challenge or change the recommendation?<\u002Fp><\u002Fdiv>\n          <div style=\"border-top:1px solid #CACACB;padding-top:12px\"><p style=\"margin:0 0 2px;font-family:'Bebas Neue',sans-serif;font-size:22px;line-height:1;text-transform:uppercase;color:#111111\">Confidence<\u002Fp><p style=\"margin:0;font-size:12.5px;color:#39393B\">Do users understand enough to make an informed decision?<\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <p style=\"margin:0 0 24px;font-size:11px;font-weight:600;letter-spacing:.14em;color:#6B6B6D\">TASK FLOW<\u002Fp>\n    <div style=\"display:grid;grid-template-columns:{{ taskGrid }};gap:16px;margin-bottom:64px\">\n      <sc-for list=\"{{ tasks }}\" as=\"t\" hint-placeholder-count=\"9\">\n        <div style=\"border:1px solid #CACACB;border-radius:14px;padding:20px;background:#FFFFFF;display:flex;flex-direction:column;gap:8px\">\n          <span style=\"font-family:'Bebas Neue',sans-serif;font-size:22px;line-height:1;color:#CACACB\">TASK {{ t.n }}<\u002Fspan>\n          <span style=\"font-size:13px;line-height:1.45;color:#111111;text-wrap:pretty\">{{ t.t }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <p style=\"margin:0 0 8px;font-size:11px;font-weight:600;letter-spacing:.14em;color:#6B6B6D\">FINDINGS<\u002Fp>\n    <p style=\"margin:0 0 32px;font-size:13.5px;color:#6B6B6D\">Grouped by theme, severity stated in text as well as position. Select a finding to open it.<\u002Fp>\n    <div style=\"display:flex;flex-direction:column;gap:16px;margin-bottom:64px\">\n      <sc-for list=\"{{ finds }}\" as=\"f\" hint-placeholder-count=\"6\">\n        <div style=\"{{ f.cardStyle }}\">\n          <button sc-camel-on-click=\"{{ f.toggle }}\" aria-expanded=\"{{ f.expanded }}\" style=\"{{ f.headStyle }}\">\n            <span style=\"flex:1 1 280px;display:flex;flex-wrap:wrap;gap:12px;align-items:center\">\n              <span style=\"{{ f.sevStyle }}\">{{ f.sev }}<\u002Fspan>\n              <span style=\"font-family:'Bebas Neue',sans-serif;font-size:20px;line-height:1.2;color:#CACACB\">{{ f.n }}<\u002Fspan>\n              <span style=\"flex:1 1 200px;font-size:15px;font-weight:700;line-height:1.35;color:#111111;text-wrap:pretty\">{{ f.title }}<\u002Fspan>\n            <\u002Fspan>\n            <span style=\"{{ f.kindStyle }}\">{{ f.kind }}<\u002Fspan>\n          <\u002Fbutton>\n          <sc-if value=\"{{ f.open }}\">\n            <div style=\"padding:0 24px 24px;display:grid;grid-template-columns:{{ twoCol }};gap:24px\">\n              <div style=\"display:flex;flex-direction:column;gap:16px\">\n                <div>\n                  <p style=\"margin:0 0 4px;font-size:10px;font-weight:600;letter-spacing:.08em;color:#9E9EA0\">THEME<\u002Fp>\n                  <p style=\"margin:0;font-size:13.5px;font-weight:600;color:#111111\">{{ f.theme }}<\u002Fp>\n                <\u002Fdiv>\n                <div>\n                  <p style=\"margin:0 0 4px;font-size:10px;font-weight:600;letter-spacing:.08em;color:#9E9EA0\">WHAT HAPPENED<\u002Fp>\n                  <p style=\"margin:0;font-size:13.5px;line-height:1.5;color:#111111;text-wrap:pretty\">{{ f.behav }}<\u002Fp>\n                <\u002Fdiv>\n                <div>\n                  <p style=\"margin:0 0 4px;font-size:10px;font-weight:600;letter-spacing:.08em;color:#9E9EA0\">EVIDENCE<\u002Fp>\n                  <p style=\"margin:0;font-size:13px;line-height:1.5;color:#39393B;text-wrap:pretty\">{{ f.ev }}<\u002Fp>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:16px\">\n                <div>\n                  <p style=\"margin:0 0 4px;font-size:10px;font-weight:600;letter-spacing:.08em;color:#9E9EA0\">WHY IT MATTERS<\u002Fp>\n                  <p style=\"margin:0;font-size:13.5px;line-height:1.5;color:#111111;text-wrap:pretty\">{{ f.matters }}<\u002Fp>\n                <\u002Fdiv>\n                <div style=\"border-left:3px solid #111111;padding-left:16px\">\n                  <p style=\"margin:0 0 4px;font-size:10px;font-weight:600;letter-spacing:.08em;color:#6B6B6D\">DESIGN RESPONSE<\u002Fp>\n                  <p style=\"margin:0;font-size:13.5px;line-height:1.5;color:#111111;text-wrap:pretty\">{{ f.resp }}<\u002Fp>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <p style=\"margin:0 0 24px;font-size:11px;font-weight:600;letter-spacing:.14em;color:#6B6B6D\">BEFORE ITERATION → AFTER ITERATION · RECOMMENDATION HIERARCHY<\u002Fp>\n    <div style=\"display:grid;grid-template-columns:{{ twoCol }};gap:16px;margin-bottom:24px\">\n      <div style=\"border:1px solid #CACACB;border-radius:14px;overflow:hidden;background:#FFFFFF\">\n        <div style=\"border-bottom:1px solid #E5E5E5;padding:12px 20px;font-size:{{ frameHead }};font-weight:600;letter-spacing:.08em;color:#6B6B6D\">BEFORE ITERATION · V1.3<\u002Fdiv>\n        <div style=\"padding:20px\">\n          <p style=\"margin:0 0 8px;font-family:'Bebas Neue',sans-serif;font-size:30px;line-height:1;text-transform:uppercase;color:#111111\">Balanced<\u002Fp>\n          <p style=\"margin:0 0 16px;font-size:13px;color:#39393B\">R12,183 a month · 80% borrowed<\u002Fp>\n          <div style=\"display:flex;gap:12px\">\n            <span style=\"font-size:12.5px;font-weight:600;color:#FFFFFF;background:#111111;border-radius:999px;padding:9px 18px\">Accept<\u002Fspan>\n            <span style=\"font-size:12.5px;font-weight:600;color:#111111;border:1px solid #CACACB;border-radius:999px;padding:9px 18px\">Reject<\u002Fspan>\n          <\u002Fdiv>\n          <p style=\"margin:16px 0 0;font-size:12px;line-height:1.5;color:#6B6B6D;text-wrap:pretty\">The option, a figure and two buttons. No stated confidence, no reasoning, and no route for disagreeing with one assumption.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border:1px solid #111111;border-radius:14px;overflow:hidden;background:#FFFFFF\">\n        <div style=\"border-bottom:1px solid #E5E5E5;padding:12px 20px;font-size:{{ frameHead }};font-weight:600;letter-spacing:.08em;color:#111111\">AFTER ITERATION · V1.4.1 · FINAL PROTOTYPE<\u002Fdiv>\n        <div style=\"padding:20px\">\n          <p style=\"margin:0 0 4px;font-size:10px;font-weight:600;letter-spacing:.1em;color:#6B6B6D\">FINOS RECOMMENDS<\u002Fp>\n          <p style=\"margin:0 0 8px;font-family:'Bebas Neue',sans-serif;font-size:30px;line-height:1;text-transform:uppercase;color:#111111\">Balanced approach<\u002Fp>\n          <span style=\"display:inline-block;font-size:11px;font-weight:600;letter-spacing:.06em;color:#FFFFFF;background:#111111;border-radius:999px;padding:5px 12px;margin-bottom:16px\">MODERATE CONFIDENCE<\u002Fspan>\n          <p style=\"margin:0 0 4px;font-size:12.5px;line-height:1.45;color:#111111;text-wrap:pretty\">Why · borrowing stays at 80%, within the 80% ceiling; surplus holds at R11,217.<\u002Fp>\n          <p style=\"margin:0 0 16px;font-size:12.5px;line-height:1.45;color:#111111;text-wrap:pretty\">Risk · cash cover reaches 5.5 of 6.0 months — a R35,896 shortfall.<\u002Fp>\n          <div style=\"display:flex;flex-wrap:wrap;gap:12px\">\n            <span style=\"font-size:12.5px;font-weight:600;color:#111111;border:1px solid #111111;border-radius:999px;padding:9px 18px\">Challenge recommendation<\u002Fspan>\n            <span style=\"font-size:12.5px;font-weight:600;color:#FFFFFF;background:#111111;border-radius:999px;padding:9px 18px\">Review &amp; approve<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:{{ twoCol }};gap:16px\">\n      <div style=\"border-left:3px solid #CACACB;padding-left:16px\">\n        <p style=\"margin:0 0 4px;font-size:10px;font-weight:600;letter-spacing:.08em;color:#9E9EA0\">OBSERVATION<\u002Fp>\n        <p style=\"margin:0;font-size:13px;line-height:1.5;color:#39393B;text-wrap:pretty\">Accept or reject framed the recommendation as a verdict to comply with, and gave a user who disagreed with one assumption no way to say so.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"border-left:3px solid #111111;padding-left:16px\">\n        <p style=\"margin:0 0 4px;font-size:10px;font-weight:600;letter-spacing:.08em;color:#6B6B6D\">ITERATION<\u002Fp>\n        <p style=\"margin:0;font-size:13px;line-height:1.5;color:#111111;text-wrap:pretty\">Name it as a recommendation, carry the confidence and the reasoning with it, state the risk against itself, and make challenge a peer action to approval.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ 15 FINDINGS → ITERATIONS ============ -->\n<section id=\"ch15\" data-screen-label=\"15 Iterations\" style=\"max-width:1240px;margin:0 auto;padding:{{ secPad }}\">\n  <p style=\"margin:0 0 24px;font-size:11px;font-weight:600;letter-spacing:.14em;color:#6B6B6D\">15 — FINDINGS → ITERATIONS<\u002Fp>\n  <h2 style=\"margin:0 0 32px;font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:{{ h2Size }};line-height:.94;letter-spacing:.005em;text-transform:uppercase;max-width:18ch;text-wrap:pretty\">Every important change needed a reason.<\u002Fh2>\n  <p style=\"margin:0 0 64px;font-size:{{ leadSize }};line-height:1.5;color:#39393B;max-width:70ch;text-wrap:pretty\">The evaluation wasn't used to collect compliments. It was used to identify where the experience could fail at the exact moments where financial decisions become consequential.<\u002Fp>\n\n  <div style=\"display:grid;grid-template-columns:{{ loopGrid }};gap:16px;margin-bottom:24px\">\n    <div style=\"border-top:2px solid #111111;padding-top:12px\"><p style=\"margin:0;font-family:'Bebas Neue',sans-serif;font-size:24px;line-height:1;text-transform:uppercase;color:#111111\">Observe<\u002Fp><\u002Fdiv>\n    <div style=\"border-top:2px solid #111111;padding-top:12px\"><p style=\"margin:0;font-family:'Bebas Neue',sans-serif;font-size:24px;line-height:1;text-transform:uppercase;color:#111111\">Identify<\u002Fp><\u002Fdiv>\n    <div style=\"border-top:2px solid #111111;padding-top:12px\"><p style=\"margin:0;font-family:'Bebas Neue',sans-serif;font-size:24px;line-height:1;text-transform:uppercase;color:#111111\">Prioritise<\u002Fp><\u002Fdiv>\n    <div style=\"border-top:2px solid #111111;padding-top:12px\"><p style=\"margin:0;font-family:'Bebas Neue',sans-serif;font-size:24px;line-height:1;text-transform:uppercase;color:#111111\">Design<\u002Fp><\u002Fdiv>\n    <div style=\"border-top:2px solid #111111;padding-top:12px\"><p style=\"margin:0;font-family:'Bebas Neue',sans-serif;font-size:24px;line-height:1;text-transform:uppercase;color:#111111\">Test<\u002Fp><\u002Fdiv>\n    <div style=\"border-top:2px solid #111111;padding-top:12px\"><p style=\"margin:0;font-family:'Bebas Neue',sans-serif;font-size:24px;line-height:1;text-transform:uppercase;color:#111111\">Iterate<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n  <p style=\"margin:0 0 64px;border-left:3px solid #111111;padding-left:16px;font-size:14.5px;line-height:1.55;color:#111111;max-width:70ch;text-wrap:pretty\">Prototype evaluation became part of the product loop rather than a final validation step.<\u002Fp>\n\n  <p style=\"margin:0 0 24px;font-size:11px;font-weight:600;letter-spacing:.14em;color:#6B6B6D\">ITERATIONS · SELECT ONE TO OPEN<\u002Fp>\n  <div style=\"display:flex;flex-direction:column;gap:16px;margin-bottom:64px\">\n    <sc-for list=\"{{ iters }}\" as=\"it\" hint-placeholder-count=\"5\">\n      <div style=\"{{ it.style }}\">\n        <button sc-camel-on-click=\"{{ it.toggle }}\" aria-expanded=\"{{ it.expanded }}\" style=\"width:100%;text-align:left;background:transparent;border:0;padding:20px;cursor:pointer;display:flex;flex-wrap:wrap;gap:16px;align-items:baseline;justify-content:space-between\">\n          <span style=\"display:flex;gap:16px;align-items:baseline\">\n            <span style=\"font-family:'Bebas Neue',sans-serif;font-size:24px;line-height:1;color:#CACACB\">{{ it.n }}<\u002Fspan>\n            <span style=\"font-size:15px;font-weight:700;color:#111111\">{{ it.prob }}<\u002Fspan>\n          <\u002Fspan>\n          <span style=\"font-size:10.5px;font-weight:600;letter-spacing:.08em;color:#6B6B6D;border:1px solid #E5E5E5;border-radius:999px;padding:4px 10px\">{{ it.prin }}<\u002Fspan>\n        <\u002Fbutton>\n        <sc-if value=\"{{ it.open }}\">\n          <div style=\"padding:0 20px 20px;display:grid;grid-template-columns:{{ triGrid }};gap:16px\">\n            <div>\n              <p style=\"margin:0 0 4px;font-size:10px;font-weight:600;letter-spacing:.08em;color:#9E9EA0\">INSIGHT<\u002Fp>\n              <p style=\"margin:0;font-size:13px;line-height:1.5;color:#111111;text-wrap:pretty\">{{ it.insight }}<\u002Fp>\n            <\u002Fdiv>\n            <div>\n              <p style=\"margin:0 0 4px;font-size:10px;font-weight:600;letter-spacing:.08em;color:#9E9EA0\">CHANGE<\u002Fp>\n              <p style=\"margin:0;font-size:13.5px;font-weight:600;line-height:1.5;color:#111111;text-wrap:pretty\">{{ it.change }}<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"border-left:3px solid #111111;padding-left:16px\">\n              <p style=\"margin:0 0 4px;font-size:10px;font-weight:600;letter-spacing:.08em;color:#6B6B6D\">RESULT<\u002Fp>\n              <p style=\"margin:0;font-size:13px;line-height:1.5;color:#111111;text-wrap:pretty\">{{ it.result }}<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n\n  <p style=\"margin:0 0 24px;font-size:11px;font-weight:600;letter-spacing:.14em;color:#6B6B6D\">QUALITATIVE OUTCOMES · NO NUMERICAL CLAIMS<\u002Fp>\n  <div style=\"display:grid;grid-template-columns:{{ twoCol }};gap:16px;margin-bottom:64px\">\n    <div style=\"border:1px solid #E5E5E5;border-radius:14px;padding:20px;background:#FAFAFA\">\n      <p style=\"margin:0 0 16px;font-size:10.5px;font-weight:600;letter-spacing:.1em;color:#6B6B6D\">BEFORE<\u002Fp>\n      <div style=\"display:flex;flex-direction:column;gap:12px;font-size:13.5px;color:#39393B\">\n        <span style=\"border-top:1px solid #E5E5E5;padding-top:12px\">Recommendation readable as a verdict<\u002Fspan>\n        <span style=\"border-top:1px solid #E5E5E5;padding-top:12px\">Limited explanation<\u002Fspan>\n        <span style=\"border-top:1px solid #E5E5E5;padding-top:12px\">Disagreement difficult to express<\u002Fspan>\n        <span style=\"border-top:1px solid #E5E5E5;padding-top:12px\">Consequences established earlier, not at approval<\u002Fspan>\n        <span style=\"border-top:1px solid #E5E5E5;padding-top:12px\">Outcome recorded without its reasoning<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"border:1px solid #111111;border-radius:14px;padding:20px;background:#FFFFFF\">\n      <p style=\"margin:0 0 16px;font-size:10.5px;font-weight:600;letter-spacing:.1em;color:#111111\">AFTER<\u002Fp>\n      <div style=\"display:flex;flex-direction:column;gap:12px;font-size:13.5px;font-weight:600;color:#111111\">\n        <span style=\"border-top:1px solid #E5E5E5;padding-top:12px\">Named as a recommendation, with its confidence<\u002Fspan>\n        <span style=\"border-top:1px solid #E5E5E5;padding-top:12px\">Inspectable rationale<\u002Fspan>\n        <span style=\"border-top:1px solid #E5E5E5;padding-top:12px\">Challenge is a visible, intentional action<\u002Fspan>\n        <span style=\"border-top:1px solid #E5E5E5;padding-top:12px\">Restated at the moment of authorising<\u002Fspan>\n        <span style=\"border-top:1px solid #E5E5E5;padding-top:12px\">Reasoning and disagreement preserved<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"background:#111111;color:#FFFFFF;border-radius:14px;padding:{{ diagramPad }};margin-bottom:64px\">\n    <p data-reveal=\"1\" style=\"margin:0 0 16px;font-family:'Bebas Neue',sans-serif;font-size:{{ quoteSize }};line-height:.95;text-transform:uppercase;color:#FFFFFF;max-width:22ch;text-wrap:pretty\">The most important change wasn't adding more AI.<\u002Fp>\n    <p style=\"margin:0 0 32px;font-size:{{ leadSize }};line-height:1.5;color:#E5E5E5;max-width:50ch;text-wrap:pretty\">It was making the AI easier to question.<\u002Fp>\n    <div style=\"display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:32px\">\n      <span style=\"font-size:11.5px;font-weight:600;letter-spacing:.06em;color:#FFFFFF;border:1px solid #2B2B2B;border-radius:999px;padding:8px 14px\">AI RECOMMENDATION<\u002Fspan>\n      <span aria-hidden=\"true\" style=\"color:#6B6B6D\">→<\u002Fspan>\n      <span style=\"font-size:11.5px;font-weight:600;letter-spacing:.06em;color:#FFFFFF;border:1px solid #2B2B2B;border-radius:999px;padding:8px 14px\">WHY?<\u002Fspan>\n      <span aria-hidden=\"true\" style=\"color:#6B6B6D\">→<\u002Fspan>\n      <span style=\"font-size:11.5px;font-weight:600;letter-spacing:.06em;color:#FFFFFF;border:1px solid #2B2B2B;border-radius:999px;padding:8px 14px\">ASSUMPTIONS<\u002Fspan>\n      <span aria-hidden=\"true\" style=\"color:#6B6B6D\">→<\u002Fspan>\n      <span style=\"font-size:11.5px;font-weight:600;letter-spacing:.06em;color:#111111;background:#FFFFFF;border-radius:999px;padding:8px 14px\">CHALLENGE<\u002Fspan>\n      <span aria-hidden=\"true\" style=\"color:#6B6B6D\">→<\u002Fspan>\n      <span style=\"font-size:11.5px;font-weight:600;letter-spacing:.06em;color:#FFFFFF;border:1px solid #2B2B2B;border-radius:999px;padding:8px 14px\">RECALCULATE<\u002Fspan>\n      <span aria-hidden=\"true\" style=\"color:#6B6B6D\">→<\u002Fspan>\n      <span style=\"font-size:11.5px;font-weight:600;letter-spacing:.06em;color:#FFFFFF;border:1px solid #2B2B2B;border-radius:999px;padding:8px 14px\">HUMAN DECISION<\u002Fspan>\n    <\u002Fdiv>\n    <p style=\"margin:0;font-size:14.5px;line-height:1.55;color:#E5E5E5;max-width:70ch;text-wrap:pretty\">The goal wasn't to maximise AI autonomy. It was to maximise useful AI assistance while preserving meaningful human control.<\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"border-top:2px solid #111111;padding-top:32px\">\n    <div style=\"display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:32px\">\n      <span style=\"font-size:11.5px;font-weight:600;letter-spacing:.06em;color:#111111;border:1px solid #CACACB;border-radius:999px;padding:8px 14px\">RESEARCH<\u002Fspan>\n      <span aria-hidden=\"true\" style=\"color:#CACACB\">→<\u002Fspan>\n      <span style=\"font-size:11.5px;font-weight:600;letter-spacing:.06em;color:#111111;border:1px solid #CACACB;border-radius:999px;padding:8px 14px\">PROTOTYPE<\u002Fspan>\n      <span aria-hidden=\"true\" style=\"color:#CACACB\">→<\u002Fspan>\n      <span style=\"font-size:11.5px;font-weight:600;letter-spacing:.06em;color:#111111;border:1px solid #CACACB;border-radius:999px;padding:8px 14px\">USABILITY EVALUATION<\u002Fspan>\n      <span aria-hidden=\"true\" style=\"color:#CACACB\">→<\u002Fspan>\n      <span style=\"font-size:11.5px;font-weight:600;letter-spacing:.06em;color:#111111;border:1px solid #CACACB;border-radius:999px;padding:8px 14px\">FINDING<\u002Fspan>\n      <span aria-hidden=\"true\" style=\"color:#CACACB\">→<\u002Fspan>\n      <span style=\"font-size:11.5px;font-weight:600;letter-spacing:.06em;color:#111111;border:1px solid #CACACB;border-radius:999px;padding:8px 14px\">ITERATION<\u002Fspan>\n      <span aria-hidden=\"true\" style=\"color:#CACACB\">→<\u002Fspan>\n      <span style=\"font-size:11.5px;font-weight:600;letter-spacing:.06em;color:#FFFFFF;background:#111111;border-radius:999px;padding:8px 14px\">V1.4.1<\u002Fspan>\n    <\u002Fdiv>\n    <p data-reveal=\"1\" style=\"margin:0;font-family:'Bebas Neue',sans-serif;font-size:{{ revealSize }};line-height:.9;letter-spacing:.005em;text-transform:uppercase;color:#111111;max-width:24ch;text-wrap:pretty\">FINOS became stronger when the prototype was treated as something to interrogate — not something to defend.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<div style=\"max-width:1240px;margin:0 auto;padding:0 {{ gutter }}\">\n  <div style=\"border-top:2px solid #111111;padding:24px 0;display:grid;grid-template-columns:{{ twoCol }};gap:24px;align-items:baseline\">\n    <p style=\"margin:0;font-size:10.5px;font-weight:600;letter-spacing:.1em;color:#6B6B6D\">VALIDATION TAKEAWAY<\u002Fp>\n    <p style=\"margin:0;font-size:{{ leadSize }};line-height:1.45;color:#111111;max-width:60ch;text-wrap:pretty\">The prototype became stronger when assumptions were made inspectable and challengeable.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fdiv>\n<!-- transition -->\n<section aria-label=\"Next chapter\" style=\"background:#F5F5F5;padding:{{ bandPad }}\">\n  <div style=\"max-width:1240px;margin:0 auto;display:grid;grid-template-columns:{{ twoCol }};gap:48px;align-items:end\">\n    <div>\n      <p style=\"margin:0 0 16px;font-size:11px;font-weight:600;letter-spacing:.14em;color:#6B6B6D\">NEXT — AND FINAL<\u002Fp>\n      <p style=\"margin:0 0 16px;font-family:'Bebas Neue',sans-serif;font-size:{{ h2Size }};line-height:.94;text-transform:uppercase;color:#111111\">Final FINOS Experience<\u002Fp>\n      <p style=\"margin:0;font-size:14.5px;line-height:1.55;color:#39393B;max-width:60ch;text-wrap:pretty\">After multiple iterations, the next question was whether the complete experience could support a consequential financial decision from context to approval and audit.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:12px;align-items:{{ ctaAlign }}\">\n      <a href=\"#ch16\" style=\"height:46px;display:inline-flex;align-items:center;padding:0 24px;border-radius:999px;background:#111111;color:#FFFFFF;font-size:13.5px;font-weight:600\" style-hover=\"background:#39393B\">Explore the final experience →<\u002Fa>\n      <span style=\"font-size:11.5px;color:#6B6B6D\">Chapters 01–20 · complete<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n\n\n\n<div style='max-width:1400px;margin:0 auto;padding:0 24px 110px'><figure style='margin:0'><div style='border-radius:20px;overflow:hidden;box-shadow:0 50px 110px -48px rgba(17,17,17,.5);background:#0b0b0c'><img src='assets/img/finos/mock-investments.jpg' alt='FINOS Investments view with 24 holdings across three mandates, on a laptop in a calm lounge setting' loading='lazy' style='display:block;width:100%;height:auto'/><\u002Fdiv><figcaption style='margin-top:14px;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#6B6B6D'>Mockup 07 — Investments · calm oversight of 24 holdings<\u002Ffigcaption><\u002Ffigure><\u002Fdiv>\n\n<!-- ============ 16 FINAL FINOS EXPERIENCE ============ -->\n<section id=\"ch16\" data-screen-label=\"16 Final experience\" style=\"max-width:1240px;margin:0 auto;padding:{{ secPad }}\">\n  <p style=\"margin:0 0 24px;font-size:11px;font-weight:600;letter-spacing:.14em;color:#6B6B6D\">16 — FINAL FINOS EXPERIENCE<\u002Fp>\n  <h2 style=\"margin:0 0 32px;font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:{{ h2Size }};line-height:.94;letter-spacing:.005em;text-transform:uppercase;max-width:16ch;text-wrap:pretty\">One financial decision. One connected system.<\u002Fh2>\n  <p style=\"margin:0 0 64px;font-size:{{ leadSize }};line-height:1.5;color:#39393B;max-width:72ch;text-wrap:pretty\">After multiple iterations, FINOS became a connected decision experience that moves from financial context to scenario modelling, AI-supported evaluation, human approval and post-decision traceability.<\u002Fp>\n\n  <div style=\"display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:24px\">\n    <span style=\"font-size:11.5px;font-weight:600;letter-spacing:.06em;color:#111111;border:1px solid #CACACB;border-radius:999px;padding:9px 16px\">CONTEXT<\u002Fspan>\n    <span aria-hidden=\"true\" style=\"color:#CACACB\">→<\u002Fspan>\n    <span style=\"font-size:11.5px;font-weight:600;letter-spacing:.06em;color:#111111;border:1px solid #CACACB;border-radius:999px;padding:9px 16px\">SCENARIO<\u002Fspan>\n    <span aria-hidden=\"true\" style=\"color:#CACACB\">→<\u002Fspan>\n    <span style=\"font-size:11.5px;font-weight:600;letter-spacing:.06em;color:#111111;border:1px solid #CACACB;border-radius:999px;padding:9px 16px\">COMPARE<\u002Fspan>\n    <span aria-hidden=\"true\" style=\"color:#CACACB\">→<\u002Fspan>\n    <span style=\"font-size:11.5px;font-weight:600;letter-spacing:.06em;color:#111111;border:1px solid #CACACB;border-radius:999px;padding:9px 16px\">RECOMMEND<\u002Fspan>\n    <span aria-hidden=\"true\" style=\"color:#CACACB\">→<\u002Fspan>\n    <span style=\"font-size:11.5px;font-weight:600;letter-spacing:.06em;color:#111111;border:1px solid #CACACB;border-radius:999px;padding:9px 16px\">EXPLAIN<\u002Fspan>\n    <span aria-hidden=\"true\" style=\"color:#CACACB\">→<\u002Fspan>\n    <span style=\"font-size:11.5px;font-weight:600;letter-spacing:.06em;color:#FFFFFF;background:#111111;border-radius:999px;padding:9px 16px\">CHALLENGE<\u002Fspan>\n    <span aria-hidden=\"true\" style=\"color:#CACACB\">→<\u002Fspan>\n    <span style=\"font-size:11.5px;font-weight:600;letter-spacing:.06em;color:#111111;border:1px solid #CACACB;border-radius:999px;padding:9px 16px\">APPROVE<\u002Fspan>\n    <span aria-hidden=\"true\" style=\"color:#CACACB\">→<\u002Fspan>\n    <span style=\"font-size:11.5px;font-weight:600;letter-spacing:.06em;color:#111111;border:1px solid #CACACB;border-radius:999px;padding:9px 16px\">AUDIT<\u002Fspan>\n  <\u002Fdiv>\n  <p style=\"margin:0 0 64px;border-left:3px solid #111111;padding-left:16px;font-size:14.5px;line-height:1.55;color:#111111;max-width:60ch;text-wrap:pretty\">FINOS turns financial complexity into an inspectable decision.<\u002Fp>\n\n  <p style=\"margin:0 0 24px;font-size:11px;font-weight:600;letter-spacing:.14em;color:#6B6B6D\">WALKTHROUGH · EIGHT MOMENTS FROM V1.4.1<\u002Fp>\n  <div style=\"display:grid;grid-template-columns:{{ momGrid }};gap:16px;margin-bottom:64px\">\n    <sc-for list=\"{{ moms }}\" as=\"m\" hint-placeholder-count=\"8\">\n      <div style=\"display:flex;flex-direction:column;gap:12px\">\n        <div style=\"border:1px solid #E5E5E5;border-radius:14px;background:#FFFFFF;overflow:hidden;flex:1 1 auto;display:flex;flex-direction:column\">\n          <div style=\"display:flex;align-items:center;gap:8px;padding:10px 16px;background:#111111\">\n            <span aria-hidden=\"true\" style=\"width:9px;height:9px;border-radius:999px;background:#FFFFFF\"><\u002Fspan>\n            <span style=\"font-family:'Bebas Neue',sans-serif;font-size:12px;letter-spacing:.2em;color:#FFFFFF\">FINOS<\u002Fspan>\n            <span style=\"margin-left:auto;font-size:10px;color:#9E9EA0\">{{ m.surface }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"padding:20px;display:flex;flex-direction:column;gap:16px;flex:1 1 auto\">\n            <span style=\"font-family:'Bebas Neue',sans-serif;font-size:20px;line-height:1;color:#CACACB\">{{ m.n }}<\u002Fspan>\n            <h3 style=\"margin:0;font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:26px;line-height:.98;text-transform:uppercase;color:#111111;text-wrap:pretty\">{{ m.title }}<\u002Fh3>\n            <p style=\"margin:auto 0 0;border:1px solid #EFEFEF;border-radius:11px;padding:12px 14px;font-size:11.5px;line-height:1.45;color:#39393B;font-variant-numeric:tabular-nums;text-wrap:pretty\">{{ m.detail }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"margin:0;border-left:3px solid #111111;padding-left:12px;font-size:12.5px;font-weight:600;line-height:1.4;color:#111111;text-wrap:pretty\">{{ m.note }}<\u002Fp>\n        <p style=\"margin:0;font-size:11.5px;line-height:1.45;color:#6B6B6D;text-wrap:pretty\">{{ m.body }}<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n\n  <p style=\"margin:0 0 24px;font-size:11px;font-weight:600;letter-spacing:.14em;color:#6B6B6D\">THE SYSTEM, ASSEMBLED<\u002Fp>\n  <div style=\"display:grid;grid-template-columns:{{ triGrid }};gap:1px;background:#CACACB;border:1px solid #CACACB;border-radius:14px;overflow:hidden;margin-bottom:64px\">\n    <div style=\"background:#FFFFFF;padding:20px\"><p style=\"margin:0 0 8px;font-size:10.5px;font-weight:600;letter-spacing:.1em;color:#6B6B6D\">CONTEXT<\u002Fp><p style=\"margin:0;font-size:13px;line-height:1.5;color:#111111;text-wrap:pretty\">Position, cash flow, obligations and liquidity, established before anything is recommended.<\u002Fp><\u002Fdiv>\n    <div style=\"background:#FFFFFF;padding:20px\"><p style=\"margin:0 0 8px;font-size:10.5px;font-weight:600;letter-spacing:.1em;color:#6B6B6D\">INTELLIGENCE<\u002Fp><p style=\"margin:0;font-size:13px;line-height:1.5;color:#111111;text-wrap:pretty\">Observations that carry their source data, interpretation, impact and next step.<\u002Fp><\u002Fdiv>\n    <div style=\"background:#FFFFFF;padding:20px\"><p style=\"margin:0 0 8px;font-size:10.5px;font-weight:600;letter-spacing:.1em;color:#6B6B6D\">SCENARIOS<\u002Fp><p style=\"margin:0;font-size:13px;line-height:1.5;color:#111111;text-wrap:pretty\">A deterministic engine, versioned, with each version storing the result it produced.<\u002Fp><\u002Fdiv>\n    <div style=\"background:#FFFFFF;padding:20px\"><p style=\"margin:0 0 8px;font-size:10.5px;font-weight:600;letter-spacing:.1em;
